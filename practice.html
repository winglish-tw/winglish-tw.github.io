us 連續的"}, {"n": 10, "s": "The clouds parted and a ______ of light fell on the church, through the windows, and onto the floor.", "zh": "雲層散開，一＿＿光照在教堂上，穿過窗戶，落在地板上。", "o": ["dip", "beam", "spark", "path"], "a": 1, "w": {"0": "dip 是「下沉；泡一下」，不是光的單位。", "2": "spark 是「火花」，不會從雲裡照下來。", "3": "path 是「小路」，a path of light 不是常用說法。"}, "k": "關鍵：a beam of light＝一道光束。", "v": "beam 光束｜part 分開"}, {"n": 11, "s": "Instead of a gift, Tim’s grandmother always ______ some money in the birthday card she gave him.", "zh": "提姆的奶奶總是不送禮物，而是在給他的生日卡裡＿＿一些錢。", "o": ["enclosed", "installed", "preserved", "rewarded"], "a": 0, "w": {"1": "installed 是「安裝」，意思不合。", "2": "preserved 是「保存」，意思不合。", "3": "rewarded 是「獎勵」，句型是 reward sb with sth。"}, "k": "關鍵：把錢「附在、夾在」卡片裡 → enclose。", "v": "enclose 隨信附上；圍住"}, {"n": 12, "s": "While winning a gold ______ is what every Olympic athlete dreams of, it becomes meaningless if it is achieved by cheating.", "zh": "雖然贏得金＿＿是每位奧運選手的夢想，但如果是靠作弊得來的，就變得毫無意義。", "o": ["signal", "glory", "medal", "profit"], "a": 2, "w": {"0": "signal 是「信號」，意思不合。", "1": "glory 是「榮耀」，不說 a gold glory。", "3": "profit 是「利潤」，意思不合。"}, "k": "關鍵：奧運選手夢想贏得 a gold medal＝金牌。", "v": "medal 獎牌｜cheat 作弊｜meaningless 無意義的"}, {"n": 13, "s": "The thief went into the apartment building and stole some jewelry. He then ______ himself as a security guard and walked out the front gate.", "zh": "小偷進入公寓偷了珠寶，接著把自己＿＿成警衛，從大門走出去。", "o": ["balanced", "calculated", "disguised", "registered"], "a": 2, "w": {"0": "balanced 是「平衡」，意思不合。", "1": "calculated 是「計算」，意思不合。", "3": "registered 是「登記；註冊」，意思不合。"}, "k": "關鍵：disguise oneself as＝把自己偽裝成……。", "v": "disguise 偽裝｜jewelry 珠寶｜security guard 警衛"}, {"n": 14, "s": "Due to numerous accidents that occurred while people were playing Pokémon GO, players were advised to be ______ of possible dangers in the environment.", "zh": "因為很多人玩寶可夢 GO 時發生意外，玩家被建議要＿＿環境中可能的危險。", "o": ["aware", "ashamed", "doubtful", "guilty"], "a": 0, "w": {"1": "ashamed of 是「為……感到羞恥」，意思不合。", "2": "doubtful of 是「懷疑」，意思不合。", "3": "guilty of 是「犯了……罪」，意思不合。"}, "k": "關鍵：be aware of＝注意到、意識到。", "v": "aware 意識到的｜numerous 許多的｜occur 發生"}, {"n": 15, "s": "Sherlock Holmes, a detective in a popular fiction series, has impressed readers with his amazing powers of ______ and his knowledge of trivial facts.", "zh": "福爾摩斯是熱門小說系列中的偵探，以驚人的＿＿力和瑣碎知識讓讀者印象深刻。", "o": ["innocence", "estimation", "assurance", "observation"], "a": 3, "w": {"0": "innocence 是「天真；無罪」，不說 powers of innocence。", "1": "estimation 是「估計」，不是偵探的招牌能力。", "2": "assurance 是「保證；自信」，意思不合。"}, "k": "關鍵：偵探最厲害的是 powers of observation＝觀察力。", "v": "observation 觀察｜trivial 瑣碎的｜detective 偵探"}], "gl": {"1": ["溫柔地", "正常地", "堅固地", "有利地"], "2": ["追求；從事", "發誓", "預訂；保留", "起草"], "3": ["本土的", "棘手的", "偏遠的", "空著的"], "4": ["任命", "消除", "佔據", "認同"], "5": ["令人放鬆的", "令人尷尬的", "吸引人的", "防衛的"], "6": ["幾乎沒有", "相當地", "僅僅", "樂意地"], "7": ["嚮導", "痕跡", "密碼", "印刷品"], "8": ["進入", "編輯", "強加", "催促"], "9": ["憲法", "反對", "雕刻品", "冒險"], "10": ["下沉", "光束", "火花", "小路"], "11": ["附上", "安裝", "保存", "獎勵"], "12": ["信號", "榮耀", "獎牌", "利潤"], "13": ["平衡", "計算", "偽裝", "登記"], "14": ["意識到的", "羞恥的", "懷疑的", "有罪的"], "15": ["天真", "估計", "保證", "觀察"]}, "hint": {"1": "沒設定鬧鈴卻會響，表示時鐘「不正常」。", "2": "「從事」某種職業，用哪個動詞？", "3": "好幾天遇不到人，那是什麼樣的地方？", "4": "把團體利益放前面，表示他們很「認同」團體。", "5": "認錯人還跟他要簽名，心情會如何？", "6": "句子裡有 any，要找帶「否定」意思的副詞。", "7": "消失得「無影無蹤」怎麼說？", "8": "東尼揮著招牌，「力勸」路人進來。", "9": "藝術家用沙子做出什麼？", "10": "一「道」光，用哪個名詞？", "11": "把錢「夾在」卡片裡。", "12": "奧運選手夢想的「金牌」。", "13": "小偷把自己「裝扮」成警衛。", "14": "要「注意」環境中的危險。", "15": "偵探最厲害的是什麼能力？"}, "tag": {"1": "副詞", "2": "動詞", "3": "形容詞", "4": "動詞", "5": "形容詞", "6": "副詞", "7": "名詞", "8": "動詞", "9": "名詞", "10": "名詞", "11": "動詞", "12": "名詞", "13": "動詞", "14": "形容詞", "15": "名詞", "16": "片語", "17": "名詞", "18": "動詞", "19": "連接詞", "20": "介係詞", "21": "片語", "22": "片語", "23": "動詞", "24": "介係詞", "25": "連接詞", "26": "轉折語", "27": "名詞", "28": "片語", "29": "片語", "30": "動詞"}};
const DATA105={"vocab": [{"n": 1, "s": "Posters of the local rock band were displayed in store windows to promote the sale of their ______ tickets.", "zh": "當地搖滾樂團的海報貼在商店櫥窗，宣傳他們的＿＿門票。", "o": ["journey", "traffic", "concert", "record"], "a": 2, "w": {"0": "journey 是「旅程」，樂團不賣旅程的票。", "1": "traffic 是「交通」，traffic ticket 是「交通罰單」，意思不合。", "3": "record 是「唱片；紀錄」，唱片不用買票。"}, "k": "關鍵：搖滾樂團賣的票 → 演唱會門票：concert tickets。", "v": "concert 演唱會｜promote 宣傳｜display 展示"}, {"n": 2, "s": "Maria didn’t want to deliver the bad news to David about his failing the job interview. She herself was quite ______ about it.", "zh": "瑪莉亞不想告訴大衛他面試沒通過的壞消息，她自己也對這件事很＿＿。", "o": ["awful", "drowsy", "tragic", "upset"], "a": 3, "w": {"0": "awful 是「糟糕的」，通常形容事物，不說人 awful about it。", "1": "drowsy 是「昏昏欲睡的」，意思不合。", "2": "tragic 是「悲劇的」，形容事件，不形容人的心情。"}, "k": "關鍵：be upset about＝對……感到難過、心煩。", "v": "upset 難過的；心煩的｜deliver 傳達"}, {"n": 3, "s": "The newcomer speaks with a strong Irish ______; he must be from Ireland.", "zh": "這位新來的人說話有很重的愛爾蘭＿＿，他一定是從愛爾蘭來的。", "o": ["accent", "identity", "gratitude", "signature"], "a": 0, "w": {"1": "identity 是「身分」，不說 speak with an identity。", "2": "gratitude 是「感激」，意思不合。", "3": "signature 是「簽名」，意思不合。"}, "k": "關鍵：從說話判斷來自哪裡 → 口音：speak with an accent。", "v": "accent 口音｜newcomer 新來的人"}, {"n": 4, "s": "Although Maggie has been physically ______ to her wheelchair since the car accident, she does not limit herself to indoor activities.", "zh": "雖然瑪姬車禍後身體就被＿＿在輪椅上，但她不把自己限制在室內活動。", "o": ["ceased", "committed", "confined", "conveyed"], "a": 2, "w": {"0": "ceased 是「停止」，意思不合。", "1": "be committed to 是「致力於」，不是身體被限制。", "3": "conveyed 是「傳達；運送」，意思不合。"}, "k": "關鍵：be confined to a wheelchair＝只能坐輪椅（被侷限在輪椅上）。", "v": "confine 限制；侷限｜wheelchair 輪椅"}, {"n": 5, "s": "All passengers riding in cars are required to fasten their seatbelts in order to reduce the risk of ______ in case of an accident.", "zh": "所有坐車的乘客都必須繫上安全帶，以降低萬一發生事故時＿＿的風險。", "o": ["injury", "offense", "sacrifice", "victim"], "a": 0, "w": {"1": "offense 是「冒犯；罪行」，意思不合。", "2": "sacrifice 是「犧牲」，意思不合。", "3": "victim 是「受害者」，是人，不說 the risk of victim。"}, "k": "關鍵：繫安全帶是為了降低「受傷」的風險：risk of injury。", "v": "injury 受傷｜fasten 繫緊｜in case of 萬一"}, {"n": 6, "s": "The principal of this school is a man of exceptional ______. He sets aside a part of his salary for a scholarship fund for children from needy families.", "zh": "這所學校的校長非常＿＿，他撥出一部分薪水，設立獎學金給清寒家庭的孩子。", "o": ["security", "maturity", "facility", "generosity"], "a": 3, "w": {"0": "security 是「安全」，意思不合。", "1": "maturity 是「成熟」，跟捐錢沒有直接關係。", "2": "facility 是「設施；才能」，意思不合。"}, "k": "關鍵：拿薪水設獎學金 → 「慷慨」：a man of generosity。", "v": "generosity 慷慨｜principal 校長｜set aside 撥出｜needy 貧困的"}, {"n": 7, "s": "The science teacher always ______ the use of the laboratory equipment before she lets her students use it on their own.", "zh": "自然老師在讓學生自己操作實驗器材前，總是先＿＿使用方法。", "o": ["tolerates", "associates", "demonstrates", "exaggerates"], "a": 2, "w": {"0": "tolerates 是「容忍」，意思不合。", "1": "associates 是「聯想」，句型是 associate A with B。", "3": "exaggerates 是「誇大」，意思不合。"}, "k": "關鍵：先「示範」給學生看，學生再自己操作：demonstrate。", "v": "demonstrate 示範｜laboratory 實驗室｜equipment 器材"}, {"n": 8, "s": "Most of the area is covered by woods, where bird species are so ______ that it is a paradise for birdwatchers.", "zh": "這個地區大部分是樹林，鳥類種類非常＿＿，是賞鳥人的天堂。", "o": ["durable", "private", "realistic", "numerous"], "a": 3, "w": {"0": "durable 是「耐用的」，不形容鳥類。", "1": "private 是「私人的」，意思不合。", "2": "realistic 是「實際的」，意思不合。"}, "k": "關鍵：賞鳥天堂 → 鳥的種類「很多」：numerous。", "v": "numerous 眾多的｜species 物種｜paradise 天堂"}, {"n": 9, "s": "In most cases, the committee members can reach agreement quickly. ______, however, they differ greatly in opinion and have a hard time making decisions.", "zh": "大部分情況下，委員們很快就能達成共識。不過，＿＿他們意見差很多，很難做決定。", "o": ["Occasionally", "Automatically", "Enormously", "Innocently"], "a": 0, "w": {"1": "Automatically 是「自動地」，意思不合。", "2": "Enormously 是「非常地」，不能放句首修飾整句。", "3": "Innocently 是「天真地」，意思不合。"}, "k": "關鍵：In most cases（大部分時候）和 however 對比 → 「偶爾」：Occasionally。", "v": "occasionally 偶爾｜committee 委員會｜differ 不同"}, {"n": 10, "s": "Many people try to save a lot of money before ______, since having enough money would give them a sense of security for their future.", "zh": "很多人在＿＿前努力存很多錢，因為有足夠的錢會讓他們對未來有安全感。", "o": ["isolation", "promotion", "retirement", "announcement"], "a": 2, "w": {"0": "isolation 是「孤立」，意思不合。", "1": "promotion 是「升遷」，升遷前存錢跟安全感關係不大。", "3": "announcement 是「宣布」，意思不合。"}, "k": "關鍵：為了「未來」的安全感而存錢 → 退休前：before retirement。", "v": "retirement 退休｜security 安全感"}, {"n": 11, "s": "In winter, our skin tends to become dry and ______, a problem which is usually treated by applying lotions or creams.", "zh": "冬天時，我們的皮膚容易變得乾燥又＿＿，通常擦乳液或乳霜來處理。", "o": ["alert", "itchy", "steady", "flexible"], "a": 1, "w": {"0": "alert 是「警覺的」，不形容皮膚。", "2": "steady 是「穩定的」，意思不合。", "3": "flexible 是「有彈性的」，不是需要處理的問題。"}, "k": "關鍵：冬天皮膚乾燥又「癢」，要擦乳液：itchy。", "v": "itchy 癢的｜apply 塗抹｜lotion 乳液"}, {"n": 12, "s": "Benson married Julie soon after he had ______ her heart and gained her parents’ approval.", "zh": "班森在＿＿茱莉的心、又得到她父母的同意後，很快就娶了她。", "o": ["conquered", "estimated", "guaranteed", "intensified"], "a": 0, "w": {"1": "estimated 是「估計」，意思不合。", "2": "guaranteed 是「保證」，意思不合。", "3": "intensified 是「加強」，意思不合。"}, "k": "關鍵：conquer one’s heart＝贏得芳心（征服某人的心）。", "v": "conquer 征服｜approval 同意"}, {"n": 13, "s": "The recent flood completely ______ my parents’ farm. The farmhouse and fruit trees were all gone and nothing was left.", "zh": "最近的水災完全＿＿了我爸媽的農場，農舍和果樹全沒了，什麼都沒留下。", "o": ["ruined", "cracked", "hastened", "neglected"], "a": 0, "w": {"1": "cracked 是「使裂開」，不會什麼都沒留下。", "2": "hastened 是「加速」，意思不合。", "3": "neglected 是「忽視」，水災不會忽視農場。"}, "k": "關鍵：什麼都沒留下 → 完全「毀了」：ruin。", "v": "ruin 毀壞｜flood 水災"}, {"n": 14, "s": "The results of this survey are not reliable because the people it questioned were not a typical or ______ sample of the entire population that was studied.", "zh": "這份調查結果不可靠，因為受訪者不是研究對象全體中典型或有＿＿的樣本。", "o": ["primitive", "spiritual", "representative", "informative"], "a": 2, "w": {"0": "primitive 是「原始的」，意思不合。", "1": "spiritual 是「精神的」，意思不合。", "3": "informative 是「有知識性的」，不是在形容樣本。"}, "k": "關鍵：typical or representative sample＝有代表性的樣本，和 typical 意思相近。", "v": "representative 有代表性的｜reliable 可靠的｜sample 樣本"}, {"n": 15, "s": "In line with the worldwide green movement, carmakers have been working hard to make their new models more ______ friendly to reduce pollution.", "zh": "配合全球的綠色運動，汽車廠商努力讓新車款更＿＿友善，以減少污染。", "o": ["liberally", "individually", "financially", "environmentally"], "a": 3, "w": {"0": "liberally 是「大方地」，意思不合。", "1": "individually 是「個別地」，意思不合。", "2": "financially 是「財務上」，跟減少污染無關。"}, "k": "關鍵：減少污染 → 環保：environmentally friendly。", "v": "environmentally friendly 環保的｜in line with 配合"}], "gl": {"1": ["旅程", "交通", "演唱會", "唱片"], "2": ["糟糕的", "昏昏欲睡的", "悲劇的", "難過的"], "3": ["口音", "身分", "感激", "簽名"], "4": ["停止", "致力", "侷限", "傳達"], "5": ["受傷", "冒犯", "犧牲", "受害者"], "6": ["安全", "成熟", "設施", "慷慨"], "7": ["容忍", "聯想", "示範", "誇大"], "8": ["耐用的", "私人的", "實際的", "眾多的"], "9": ["偶爾", "自動地", "非常地", "天真地"], "10": ["孤立", "升遷", "退休", "宣布"], "11": ["警覺的", "癢的", "穩定的", "有彈性的"], "12": ["征服", "估計", "保證", "加強"], "13": ["毀壞", "使裂開", "加速", "忽視"], "14": ["原始的", "精神的", "有代表性的", "有知識性的"], "15": ["大方地", "個別地", "財務上", "環境上"]}, "hint": {"1": "搖滾樂團會賣什麼門票？", "2": "要告訴朋友壞消息，自己心情如何？", "3": "聽說話就知道從哪裡來，靠的是什麼？", "4": "車禍後只能「被限制」在輪椅上。", "5": "繫安全帶是為了降低什麼風險？", "6": "拿自己的薪水幫助清寒學生，這是什麼美德？", "7": "讓學生自己用之前，老師先怎麼做？", "8": "賞鳥天堂，鳥的種類很怎樣？", "9": "「大部分時候」很快有共識，「偶爾」卻吵很久。", "10": "為了未來的安全感，在什麼之前存錢？", "11": "冬天皮膚乾，還會怎樣？", "12": "「贏得」她的心。", "13": "什麼都沒留下，農場被怎麼了？", "14": "和 typical 意思接近的形容詞。", "15": "減少污染 → 對什麼友善？"}, "tag": {"1": "名詞", "2": "形容詞", "3": "名詞", "4": "動詞", "5": "名詞", "6": "名詞", "7": "動詞", "8": "形容詞", "9": "副詞", "10": "名詞", "11": "形容詞", "12": "動詞", "13": "動詞", "14": "形容詞", "15": "副詞", "16": "轉折語", "17": "片語", "18": "片語", "19": "名詞子句", "20": "轉折語", "21": "名詞子句", "22": "動詞", "23": "介係詞", "24": "時態", "25": "名詞", "26": "代名詞", "27": "動詞", "28": "片語", "29": "介係詞", "30": "形容詞"}};
const DATA104={"vocab": [{"n": 1, "s": "Nowadays many companies adopt a ______ work schedule which allows their employees to decide when to arrive at work—from as early as 6 a.m. to as late as 11 a.m.", "zh": "現在很多公司採用＿＿的上班時間，讓員工自己決定幾點上班——最早早上六點，最晚十一點。", "o": ["relative", "severe", "primitive", "flexible"], "a": 3, "w": {"0": "relative 是「相對的」，意思不合。", "1": "severe 是「嚴格的；嚴重的」，意思相反。", "2": "primitive 是「原始的」，意思不合。"}, "k": "關鍵：員工自己決定幾點上班 → 「彈性的」上班時間：flexible。", "v": "flexible 有彈性的｜adopt 採用｜schedule 時間表"}, {"n": 2, "s": "To teach children right from wrong, some parents will ______ their children when they behave well and punish them when they misbehave.", "zh": "為了教孩子分辨是非，有些父母會在孩子表現好時＿＿他們，表現不好時處罰他們。", "o": ["settle", "declare", "reward", "neglect"], "a": 2, "w": {"0": "settle 是「解決；定居」，意思不合。", "1": "declare 是「宣布」，意思不合。", "3": "neglect 是「忽視」，意思不合。"}, "k": "關鍵：和 punish（處罰）對比 → 表現好就「獎勵」：reward。", "v": "reward 獎勵｜punish 處罰｜misbehave 行為不檢"}, {"n": 3, "s": "To stick to a tight budget, Robert bought a more ______ LED TV instead of a fancy, expensive 3D TV.", "zh": "為了守住吃緊的預算，羅伯特買了一台比較＿＿的 LED 電視，而不是花俏又昂貴的 3D 電視。", "o": ["technical", "significant", "affordable", "expressive"], "a": 2, "w": {"0": "technical 是「技術的」，意思不合。", "1": "significant 是「重要的」，意思不合。", "3": "expressive 是「富表情的」，意思不合。"}, "k": "關鍵：預算吃緊、和 expensive 對比 → 「買得起的、便宜的」：affordable。", "v": "affordable 負擔得起的｜budget 預算｜fancy 花俏的"}, {"n": 4, "s": "David’s new book made it to the best-seller list because of its beautiful ______ and amusing stories.", "zh": "大衛的新書擠進暢銷排行榜，因為它有美麗的＿＿和有趣的故事。", "o": ["operations", "illustrations", "engagements", "accomplishments"], "a": 1, "w": {"0": "operations 是「手術；運作」，意思不合。", "2": "engagements 是「訂婚；約定」，意思不合。", "3": "accomplishments 是「成就」，不是書裡的內容。"}, "k": "關鍵：書裡美麗的東西＋有趣的故事 → 「插圖」：illustrations。", "v": "illustration 插圖｜best-seller 暢銷書｜amusing 有趣的"}, {"n": 5, "s": "The airport was closed because of the snowstorm, and our ______ for Paris had to be delayed until the following day.", "zh": "機場因為暴風雪關閉，我們前往巴黎的＿＿只好延到隔天。", "o": ["movement", "registration", "tendency", "departure"], "a": 3, "w": {"0": "movement 是「移動；運動」，不說 movement for Paris。", "1": "registration 是「登記」，意思不合。", "2": "tendency 是「傾向」，意思不合。"}, "k": "關鍵：機場關閉 → 「出發」延期：departure for＋地點。", "v": "departure 出發｜delay 延誤｜snowstorm 暴風雪"}, {"n": 6, "s": "The moment the students felt the earthquake, they ran ______ out of the classroom to an open area outside.", "zh": "學生一感覺到地震，就＿＿跑出教室，到外面的空地。", "o": ["swiftly", "nearly", "loosely", "formally"], "a": 0, "w": {"1": "nearly 是「幾乎」，不修飾 ran。", "2": "loosely 是「鬆散地」，意思不合。", "3": "formally 是「正式地」，意思不合。"}, "k": "關鍵：地震時「迅速地」跑出去：swiftly。", "v": "swiftly 迅速地｜the moment 一……就"}, {"n": 7, "s": "The ______ capacity of this elevator is 400 kilograms. For safety reasons, it shouldn’t be overloaded.", "zh": "這台電梯的＿＿載重是 400 公斤，為了安全，不應該超載。", "o": ["delicate", "automatic", "essential", "maximum"], "a": 3, "w": {"0": "delicate 是「精緻的；脆弱的」，意思不合。", "1": "automatic 是「自動的」，意思不合。", "2": "essential 是「必要的」，意思不合。"}, "k": "關鍵：不可超載 → 「最大」載重：maximum capacity。", "v": "maximum 最大的｜capacity 容量｜overload 超載"}, {"n": 8, "s": "An open display of ______ behavior between men and women, such as hugging and kissing, is not allowed in some conservative societies.", "zh": "在一些保守的社會，男女公開表現＿＿的行為，例如擁抱和親吻，是不被允許的。", "o": ["intimate", "ashamed", "earnest", "urgent"], "a": 0, "w": {"1": "ashamed 是「感到羞恥的」，形容人，不形容行為。", "2": "earnest 是「認真的」，意思不合。", "3": "urgent 是「緊急的」，意思不合。"}, "k": "關鍵：擁抱、親吻 → 「親密的」行為：intimate。", "v": "intimate 親密的｜conservative 保守的｜display 展現"}, {"n": 9, "s": "When taking medicine, we should read the instructions on the ______ carefully because they provide important information such as how and when to take it.", "zh": "吃藥時，我們應該仔細閱讀＿＿上的說明，因為上面有怎麼吃、什麼時候吃等重要資訊。", "o": ["medals", "quotes", "labels", "recipes"], "a": 2, "w": {"0": "medals 是「獎牌」，意思不合。", "1": "quotes 是「引言；報價」，意思不合。", "3": "recipes 是「食譜」，不是藥的說明。"}, "k": "關鍵：藥瓶上寫說明的地方 → 「標籤」：labels。", "v": "label 標籤｜instruction 說明"}, {"n": 10, "s": "The angry passengers argued ______ with the airline staff because their flight was cancelled without any reason.", "zh": "生氣的乘客＿＿和航空公司人員爭吵，因為航班無故被取消。", "o": ["evidently", "furiously", "obediently", "suspiciously"], "a": 1, "w": {"0": "evidently 是「顯然地」，不修飾爭吵的樣子。", "2": "obediently 是「順從地」，和 angry 矛盾。", "3": "suspiciously 是「懷疑地」，意思不合。"}, "k": "關鍵：angry passengers → 「憤怒地」爭吵：furiously。", "v": "furiously 憤怒地｜cancel 取消｜staff 員工"}, {"n": 11, "s": "To ______ the new product, the company offered some free samples before they officially launched it.", "zh": "為了＿＿新產品，公司在正式上市前提供了一些免費試用品。", "o": ["contribute", "impress", "promote", "estimate"], "a": 2, "w": {"0": "contribute 是「貢獻」，意思不合。", "1": "impress 是「使印象深刻」，受詞通常是人。", "3": "estimate 是「估計」，意思不合。"}, "k": "關鍵：送試用品是為了「推銷、宣傳」：promote。", "v": "promote 宣傳；推廣｜sample 樣品｜launch 推出"}, {"n": 12, "s": "I was worried about my first overseas trip, but my father ______ me that he would help plan the trip so that nothing would go wrong.", "zh": "我很擔心第一次出國旅行，但爸爸＿＿我，他會幫忙規劃，讓一切順利。", "o": ["rescued", "assured", "inspired", "conveyed"], "a": 1, "w": {"0": "rescued 是「拯救」，不接 that 子句。", "2": "inspired 是「激勵」，不接 sb that 子句。", "3": "conveyed 是「傳達」，句型是 convey sth to sb。"}, "k": "關鍵：assure sb that...＝向某人保證……，讓人放心。", "v": "assure 向……保證｜overseas 海外的"}, {"n": 13, "s": "The recent cooking oil scandals have led to calls for tougher ______ of sales of food products.", "zh": "最近的食用油醜聞，讓大家呼籲對食品銷售做更嚴格的＿＿。", "o": ["tolerance", "guarantee", "regulation", "distribution"], "a": 2, "w": {"0": "tolerance 是「容忍」，意思相反。", "1": "guarantee 是「保證」，不說 tougher guarantee。", "3": "distribution 是「分配」，意思不合。"}, "k": "關鍵：食安醜聞 → 呼籲更嚴格的「管理、規範」：tougher regulation。", "v": "regulation 規範；管理｜scandal 醜聞"}, {"n": 14, "s": "John should ______ more often with his friends and family after work, instead of staying in his room to play computer games.", "zh": "約翰下班後應該多和朋友家人＿＿，而不是待在房間打電動。", "o": ["explore", "interact", "negotiate", "participate"], "a": 1, "w": {"0": "explore 是「探索」，不接 with sb。", "2": "negotiate with 是「和……談判」，意思不合。", "3": "participate 要接 in，意思是「參加」。"}, "k": "關鍵：interact with sb＝和某人互動。", "v": "interact 互動"}, {"n": 15, "s": "To prevent the spread of the Ebola virus from West Africa to the rest of the world, many airports have begun Ebola ______ for passengers from the infected areas.", "zh": "為了防止伊波拉病毒從西非擴散到全世界，很多機場開始對來自疫區的旅客進行伊波拉＿＿。", "o": ["screenings", "listings", "clippings", "blockings"], "a": 0, "w": {"1": "listings 是「列表」，意思不合。", "2": "clippings 是「剪報」，意思不合。", "3": "blockings 不是常用說法。"}, "k": "關鍵：機場對旅客做的「篩檢」：screenings。", "v": "screening 篩檢｜infected 受感染的｜spread 擴散"}], "gl": {"1": ["相對的", "嚴格的", "原始的", "有彈性的"], "2": ["解決", "宣布", "獎勵", "忽視"], "3": ["技術的", "重要的", "負擔得起的", "富表情的"], "4": ["手術", "插圖", "約定", "成就"], "5": ["移動", "登記", "傾向", "出發"], "6": ["迅速地", "幾乎", "鬆散地", "正式地"], "7": ["精緻的", "自動的", "必要的", "最大的"], "8": ["親密的", "羞恥的", "認真的", "緊急的"], "9": ["獎牌", "引言", "標籤", "食譜"], "10": ["顯然地", "憤怒地", "順從地", "懷疑地"], "11": ["貢獻", "使印象深刻", "宣傳", "估計"], "12": ["拯救", "向…保證", "激勵", "傳達"], "13": ["容忍", "保證", "規範", "分配"], "14": ["探索", "互動", "談判", "參加"], "15": ["篩檢", "列表", "剪報", "阻擋"]}, "hint": {"1": "員工可以自己選上班時間，是什麼樣的制度？", "2": "和「處罰」相反的是什麼？", "3": "預算吃緊，要買怎樣的電視？", "4": "書裡除了故事，還有什麼漂亮的東西？", "5": "機場關了，什麼被延到隔天？", "6": "地震時要怎麼跑？", "7": "不能超載，表示這是「最大」載重。", "8": "擁抱、親吻是什麼樣的行為？", "9": "藥瓶上寫說明的那張紙叫什麼？", "10": "生氣的乘客怎麼吵架？", "11": "送免費試用品是為了什麼？", "12": "爸爸「保證」一切會順利。", "13": "食安出事，大家要求更嚴格的什麼？", "14": "和家人朋友「互動」。", "15": "機場對旅客做的「篩檢」。"}, "tag": {"1": "形容詞", "2": "動詞", "3": "形容詞", "4": "名詞", "5": "名詞", "6": "副詞", "7": "形容詞", "8": "形容詞", "9": "名詞", "10": "副詞", "11": "動詞", "12": "動詞", "13": "名詞", "14": "動詞", "15": "名詞", "16": "動詞", "17": "介係詞", "18": "主詞動詞一致", "19": "形容詞", "20": "動詞", "21": "轉折語", "22": "副詞", "23": "分詞", "24": "動詞", "25": "形容詞", "26": "動名詞", "27": "介係詞", "28": "名詞", "29": "被動語態", "30": "副詞"}};
const DATA103={"vocab": [{"n": 1, "s": "Lost and scared, the little dog ______ along the streets, looking for its master.", "zh": "小狗迷路又害怕，沿著街道＿＿，尋找牠的主人。", "o": ["dismissed", "glided", "wandered", "marched"], "a": 2, "w": {"0": "dismissed 是「解散；不予考慮」，意思不合。", "1": "glided 是「滑行」，用來形容鳥、船，不形容迷路的狗。", "3": "marched 是「齊步走；行軍」，和迷路害怕不合。"}, "k": "關鍵：迷路、找主人 → 在街上「漫無目的地走」：wander。", "v": "wander 徘徊；漫步｜master 主人"}, {"n": 2, "s": "On a sunny afternoon last month, we all took off our shoes and walked on the grass with ______ feet.", "zh": "上個月一個晴朗的下午，我們都脫掉鞋子，＿＿腳在草地上走。", "o": ["bare", "raw", "tough", "slippery"], "a": 0, "w": {"1": "raw 是「生的；未加工的」，不形容腳。", "2": "tough 是「堅硬的；艱難的」，意思不合。", "3": "slippery 是「滑的」，意思不合。"}, "k": "關鍵：脫掉鞋子 → 「光著」腳：bare feet。", "v": "bare 赤裸的｜take off 脫掉"}, {"n": 3, "s": "It is both legally and ______ wrong to spread rumors about other people on the Internet.", "zh": "在網路上散布別人的謠言，在法律上和＿＿上都是錯的。", "o": ["morally", "physically", "literarily", "commercially"], "a": 0, "w": {"1": "physically 是「身體上」，意思不合。", "2": "literarily 是「文學上」，意思不合。", "3": "commercially 是「商業上」，意思不合。"}, "k": "關鍵：和 legally（法律上）並列 → 「道德上」錯：morally wrong。", "v": "morally 道德上｜legally 法律上｜rumor 謠言"}, {"n": 4, "s": "These warm-up exercises are designed to help people ______ their muscles and prevent injuries.", "zh": "這些暖身運動是設計來幫助大家＿＿肌肉、預防受傷的。", "o": ["produce", "connect", "broaden", "loosen"], "a": 3, "w": {"0": "produce 是「生產」，意思不合。", "1": "connect 是「連接」，意思不合。", "2": "broaden 是「拓寬」，用在視野、知識，不用在肌肉。"}, "k": "關鍵：暖身是為了「放鬆」肌肉：loosen one’s muscles。", "v": "loosen 使放鬆｜warm-up 暖身｜injury 受傷"}, {"n": 5, "s": "Mei-ling has a very close relationship with her parents. She always ______ them before she makes important decisions.", "zh": "美玲和爸媽很親近，做重要決定前總是會＿＿他們。", "o": ["impresses", "advises", "consults", "motivates"], "a": 2, "w": {"0": "impresses 是「使印象深刻」，意思不合。", "1": "advises 是「給建議」，是她給爸媽建議，方向反了。", "3": "motivates 是「激勵」，意思不合。"}, "k": "關鍵：做決定前「請教、徵詢」爸媽的意見：consult。", "v": "consult 請教；諮詢｜relationship 關係"}, {"n": 6, "s": "The restaurant has a ______ charge of NT$250 per person. So the four of us need to pay at least NT$1,000 to eat there.", "zh": "這家餐廳每人＿＿消費 250 元，所以我們四個人至少要付 1,000 元。", "o": ["definite", "minimum", "flexible", "numerous"], "a": 1, "w": {"0": "definite 是「明確的」，不說 definite charge。", "2": "flexible 是「有彈性的」，和 at least 不合。", "3": "numerous 是「許多的」，修飾複數名詞。"}, "k": "關鍵：at least（至少）→ 「最低」消費：minimum charge。", "v": "minimum 最低的｜charge 費用"}, {"n": 7, "s": "At the Book Fair, exhibitors from 21 countries will ______ textbooks, novels, and comic books.", "zh": "在書展上，來自 21 國的參展商會＿＿教科書、小說和漫畫。", "o": ["predict", "require", "display", "target"], "a": 2, "w": {"0": "predict 是「預測」，意思不合。", "1": "require 是「需要；要求」，意思不合。", "3": "target 是「以……為目標」，意思不合。"}, "k": "關鍵：書展上參展商「展示」書：display。", "v": "display 展示｜exhibitor 參展者｜fair 博覽會"}, {"n": 8, "s": "Before John got on the stage to give the speech, he took a deep ______ to calm himself down.", "zh": "約翰上台演講前，深＿＿一口氣讓自己冷靜下來。", "o": ["order", "rest", "effort", "breath"], "a": 3, "w": {"0": "order 是「命令；順序」，意思不合。", "1": "take a rest 是「休息」，不說 deep rest。", "2": "effort 是「努力」，不說 take a deep effort。"}, "k": "關鍵：take a deep breath＝深呼吸。", "v": "breath 呼吸｜calm down 冷靜"}, {"n": 9, "s": "Most young people in Taiwan are not satisfied with a high school ______ and continue to pursue further education in college.", "zh": "臺灣大部分年輕人不滿足於高中＿＿，會繼續上大學深造。", "o": ["maturity", "diploma", "foundation", "guarantee"], "a": 1, "w": {"0": "maturity 是「成熟」，意思不合。", "2": "foundation 是「基礎；基金會」，意思不合。", "3": "guarantee 是「保證」，意思不合。"}, "k": "關鍵：不滿足於高中「文憑」，繼續念大學：high school diploma。", "v": "diploma 文憑｜pursue 追求｜further education 進修"}, {"n": 10, "s": "Residents are told not to dump all household waste ______ into the trash can; reusable materials should first be sorted out and recycled.", "zh": "居民被告知不要把所有家庭垃圾＿＿丟進垃圾桶，可再利用的東西應該先分類回收。", "o": ["shortly", "straight", "forward", "namely"], "a": 1, "w": {"0": "shortly 是「不久」，意思不合。", "2": "forward 是「向前」，意思不合。", "3": "namely 是「也就是」，意思不合。"}, "k": "關鍵：不分類「直接」丟進垃圾桶：straight（副詞，直接地）。", "v": "straight 直接地｜dump 傾倒｜sort out 分類"}, {"n": 11, "s": "Kevin had been standing on a ladder trying to reach for a book on the top shelf when he lost his ______ and fell to the ground.", "zh": "凱文站在梯子上，想拿最上層的書，結果失去＿＿摔到地上。", "o": ["volume", "weight", "balance", "direction"], "a": 2, "w": {"0": "volume 是「音量；體積」，意思不合。", "1": "lose weight 是「減重」，意思不合。", "3": "lose direction 是「迷失方向」，不是摔倒的原因。"}, "k": "關鍵：lose one’s balance＝失去平衡。", "v": "balance 平衡｜ladder 梯子｜shelf 架子"}, {"n": 12, "s": "If student enrollment continues to drop, some programs at the university may be ______ to reduce the operation costs.", "zh": "如果學生人數持續下降，這所大學有些學程可能會被＿＿，以降低營運成本。", "o": ["relieved", "eliminated", "projected", "accounted"], "a": 1, "w": {"0": "relieved 是「被減輕；鬆了口氣」，意思不合。", "2": "projected 是「被預測；被投射」，意思不合。", "3": "account 要接 for，不能直接被動。"}, "k": "關鍵：招生不足、降低成本 → 學程被「刪除、裁撤」：eliminate。", "v": "eliminate 刪除；淘汰｜enrollment 註冊人數｜operation 營運"}, {"n": 13, "s": "People in that remote village feed themselves by hunting and engaging in ______ forms of agriculture. No modern agricultural methods are used.", "zh": "那個偏遠村落的人靠打獵和＿＿的農業維生，沒有使用任何現代農業方法。", "o": ["universal", "splendid", "primitive", "courteous"], "a": 2, "w": {"0": "universal 是「普遍的」，意思不合。", "1": "splendid 是「壯麗的」，意思不合。", "3": "courteous 是「有禮貌的」，不形容農業。"}, "k": "關鍵：沒有現代方法 → 「原始的」農業：primitive。", "v": "primitive 原始的｜agriculture 農業｜remote 偏遠的"}, {"n": 14, "s": "The government issued a travel ______ for Taiwanese in response to the outbreak of civil war in Syria.", "zh": "因應敘利亞爆發內戰，政府對國人發布旅遊＿＿。", "o": ["alert", "monument", "exit", "circulation"], "a": 0, "w": {"1": "monument 是「紀念碑」，意思不合。", "2": "exit 是「出口」，意思不合。", "3": "circulation 是「循環；流通」，意思不合。"}, "k": "關鍵：發生內戰 → 發布旅遊「警示」：travel alert。", "v": "alert 警報｜issue 發布｜outbreak 爆發"}, {"n": 15, "s": "The baby panda Yuan Zai at the Taipei Zoo was separated from her mother because of a minor injury that occurred during her birth. She was ______ by zookeepers for a while.", "zh": "臺北動物園的貓熊寶寶圓仔出生時受了輕傷，和媽媽分開，由保育員＿＿了一陣子。", "o": ["departed", "jailed", "tended", "captured"], "a": 2, "w": {"0": "depart 是不及物動詞，不能用被動。", "1": "jailed 是「被關進監獄」，意思不合。", "3": "captured 是「被捕捉」，意思不合。"}, "k": "關鍵：受傷又和媽媽分開 → 由保育員「照顧」：tend（照料）。", "v": "tend 照顧｜separate 分開｜zookeeper 動物園管理員"}], "gl": {"1": ["解散", "滑行", "徘徊", "行軍"], "2": ["赤裸的", "生的", "堅硬的", "滑的"], "3": ["道德上", "身體上", "文學上", "商業上"], "4": ["生產", "連接", "拓寬", "放鬆"], "5": ["使印象深刻", "給建議", "請教", "激勵"], "6": ["明確的", "最低的", "有彈性的", "許多的"], "7": ["預測", "需要", "展示", "以…為目標"], "8": ["命令", "休息", "努力", "呼吸"], "9": ["成熟", "文憑", "基礎", "保證"], "10": ["不久", "直接地", "向前", "也就是"], "11": ["音量", "體重", "平衡", "方向"], "12": ["減輕", "刪除", "預測", "說明"], "13": ["普遍的", "壯麗的", "原始的", "有禮貌的"], "14": ["警報", "紀念碑", "出口", "流通"], "15": ["離開", "監禁", "照顧", "捕捉"]}, "hint": {"1": "迷路的小狗在街上怎麼走？", "2": "脫了鞋，腳是怎樣的？", "3": "和「法律上」並列的是哪方面？", "4": "暖身是讓肌肉怎樣？", "5": "做決定前先「問問」爸媽。", "6": "「至少」要付多少 → 最低消費。", "7": "書展上參展商做什麼？", "8": "上台前「深呼吸」。", "9": "高中畢業會拿到什麼？", "10": "不分類就「直接」丟。", "11": "站在梯子上摔下來，是失去了什麼？", "12": "學生太少，有些學程會被怎樣？", "13": "沒有現代方法，是什麼樣的農業？", "14": "發生戰爭，政府發布什麼？", "15": "保育員對貓熊寶寶做什麼？"}, "tag": {"1": "動詞", "2": "形容詞", "3": "副詞", "4": "動詞", "5": "動詞", "6": "形容詞", "7": "動詞", "8": "名詞", "9": "名詞", "10": "副詞", "11": "名詞", "12": "動詞", "13": "形容詞", "14": "名詞", "15": "動詞", "16": "分詞構句", "17": "介係詞", "18": "限定詞", "19": "副詞", "20": "形容詞", "21": "名詞", "22": "動詞", "23": "形容詞", "24": "介係詞", "25": "副詞", "26": "動詞", "27": "連接詞", "28": "片語", "29": "轉折語", "30": "連接詞"}};
const DATA102={"vocab": [{"n": 1, "s": "It rained so hard yesterday that the baseball game had to be ______ until next Saturday.", "zh": "昨天雨下得很大，棒球賽只好＿＿到下週六。", "o": ["surrendered", "postponed", "abandoned", "opposed"], "a": 1, "w": {"0": "surrendered 是「投降；交出」，意思不合。", "2": "abandoned 是「放棄」，但後面有 until next Saturday，表示還會比，不是放棄。", "3": "opposed 是「反對」，意思不合。"}, "k": "關鍵：until next Saturday → 比賽「延期」：postpone。", "v": "postpone 延期｜until 直到"}, {"n": 2, "s": "As more people rely on the Internet for information, it has ______ newspapers as the most important source of news.", "zh": "隨著越來越多人依賴網路獲得資訊，網路已經＿＿報紙，成為最重要的新聞來源。", "o": ["distributed", "subtracted", "replaced", "transferred"], "a": 2, "w": {"0": "distributed 是「分發」，意思不合。", "1": "subtracted 是「減去」，意思不合。", "3": "transferred 是「轉移」，意思不合。"}, "k": "關鍵：replace A as B＝取代 A 成為 B。", "v": "replace 取代｜rely on 依賴｜source 來源"}, {"n": 3, "s": "Having saved enough money, Joy ______ two trips for this summer vacation, one to France and the other to Australia.", "zh": "存夠錢之後，喬伊替今年暑假＿＿了兩趟旅行，一趟去法國，一趟去澳洲。", "o": ["booked", "observed", "enclosed", "deposited"], "a": 0, "w": {"1": "observed 是「觀察；遵守」，意思不合。", "2": "enclosed 是「附上；圍住」，意思不合。", "3": "deposited 是「存（錢）」，存錢是前面已經做的事。"}, "k": "關鍵：存夠錢後「預訂」旅行：book a trip。", "v": "book 預訂｜vacation 假期"}, {"n": 4, "s": "Since I do not fully understand your proposal, I am not in the position to make any ______ on it.", "zh": "因為我還沒完全了解你的提案，我不方便對它做任何＿＿。", "o": ["difference", "solution", "demand", "comment"], "a": 3, "w": {"0": "make a difference 是「有影響」，不接 on it。", "1": "solution 是「解決辦法」，意思不合。", "2": "demand 是「要求」，意思不合。"}, "k": "關鍵：不了解提案 → 不便「評論」：make a comment on。", "v": "comment 評論｜proposal 提案｜be in a position to 有立場、能夠"}, {"n": 5, "s": "Betty was ______ to accept her friend’s suggestion because she thought she could come up with a better idea herself.", "zh": "貝蒂＿＿接受朋友的建議，因為她認為自己能想出更好的點子。", "o": ["tolerable", "sensitive", "reluctant", "modest"], "a": 2, "w": {"0": "tolerable 是「可忍受的」，形容事物，不形容人。", "1": "sensitive 是「敏感的」，不接 to accept。", "3": "modest 是「謙虛的」，和她覺得自己點子比較好矛盾。"}, "k": "關鍵：自己有更好的點子 → 「不願意」接受：be reluctant to V。", "v": "reluctant 不情願的｜come up with 想出"}, {"n": 6, "s": "The bank tries its best to attract more customers. Its staff members are always available to provide ______ service.", "zh": "這家銀行盡力吸引更多顧客，行員隨時提供＿＿的服務。", "o": ["singular", "prompt", "expensive", "probable"], "a": 1, "w": {"0": "singular 是「單數的；非凡的」，意思不合。", "2": "expensive 是「昂貴的」，不會吸引顧客。", "3": "probable 是「可能的」，意思不合。"}, "k": "關鍵：吸引顧客、隨時待命 → 「迅速的」服務：prompt service。", "v": "prompt 迅速的｜available 有空的｜attract 吸引"}, {"n": 7, "s": "John’s part-time experience at the cafeteria is good ______ for running his own restaurant.", "zh": "約翰在自助餐廳打工的經驗，是自己開餐廳很好的＿＿。", "o": ["preparation", "recognition", "formation", "calculation"], "a": 0, "w": {"1": "recognition 是「認可」，意思不合。", "2": "formation 是「形成」，意思不合。", "3": "calculation 是「計算」，意思不合。"}, "k": "關鍵：打工經驗是開店的「準備」：good preparation for。", "v": "preparation 準備｜part-time 兼職的｜run 經營"}, {"n": 8, "s": "Women’s fashions are ______ changing: One season they may favor pantsuits, but the next season they may prefer miniskirts.", "zh": "女性的流行＿＿在變：這一季可能流行褲裝，下一季可能就流行迷你裙。", "o": ["lately", "shortly", "relatively", "constantly"], "a": 3, "w": {"0": "lately 是「最近」，通常配現在完成式。", "1": "shortly 是「不久」，意思不合。", "2": "relatively 是「相對地」，意思不合。"}, "k": "關鍵：每一季都不一樣 → 「不斷地」改變：constantly。", "v": "constantly 不斷地｜favor 偏好｜pantsuit 褲裝"}, {"n": 9, "s": "Standing on the seashore, we saw a ______ of seagulls flying over the ocean before they glided down and settled on the water.", "zh": "站在海邊，我們看到一＿＿海鷗飛過海面，再滑翔下來停在水上。", "o": ["pack", "flock", "herd", "school"], "a": 1, "w": {"0": "a pack of 用在狼、狗等。", "2": "a herd of 用在牛、象等大型動物。", "3": "a school of 用在魚群。"}, "k": "關鍵：鳥群用 a flock of birds / seagulls。", "v": "flock 一群（鳥、羊）｜seagull 海鷗｜glide 滑翔"}, {"n": 10, "s": "The book is not only informative but also ______, making me laugh and feel relaxed while reading it.", "zh": "這本書不但很有知識性，也很＿＿，讀的時候讓我笑出來、覺得放鬆。", "o": ["understanding", "infecting", "entertaining", "annoying"], "a": 2, "w": {"0": "understanding 是「體諒人的」，形容人。", "1": "infecting 是「傳染」，意思不合。", "3": "annoying 是「令人討厭的」，和 laugh、relaxed 矛盾。"}, "k": "關鍵：讓人笑、放鬆 → 「有趣的、有娛樂性的」：entertaining。", "v": "entertaining 有趣的｜informative 有知識性的"}, {"n": 11, "s": "After working in front of my computer for the entire day, my neck and shoulders got so ______ that I couldn’t even turn my head.", "zh": "在電腦前工作一整天後，我的脖子和肩膀變得很＿＿，連頭都轉不了。", "o": ["dense", "harsh", "stiff", "concrete"], "a": 2, "w": {"0": "dense 是「密集的」，意思不合。", "1": "harsh 是「嚴厲的；刺耳的」，意思不合。", "3": "concrete 是「具體的；水泥」，意思不合。"}, "k": "關鍵：頭轉不了 → 脖子肩膀「僵硬」：stiff。", "v": "stiff 僵硬的｜entire 整個的"}, {"n": 12, "s": "Getting a flu shot before the start of flu season gives our body a chance to build up protection against the ______ that could make us sick.", "zh": "在流感季開始前打流感疫苗，讓身體有機會建立保護力，對抗可能讓我們生病的＿＿。", "o": ["poison", "misery", "leak", "virus"], "a": 3, "w": {"0": "poison 是「毒藥」，流感不是中毒。", "1": "misery 是「痛苦」，意思不合。", "2": "leak 是「漏洞；漏出」，意思不合。"}, "k": "關鍵：流感是由「病毒」引起的：virus。", "v": "virus 病毒｜flu shot 流感疫苗｜protection 保護"}, {"n": 13, "s": "The kingdom began to ______ after the death of its ruler, and was soon taken over by a neighboring country.", "zh": "國王死後，這個王國開始＿＿，不久就被鄰國併吞。", "o": ["collapse", "dismiss", "rebel", "withdraw"], "a": 0, "w": {"1": "dismiss 是「解散；不理會」，要接受詞。", "2": "rebel 是「反叛」，王國反叛不通。", "3": "withdraw 是「撤退」，意思不合。"}, "k": "關鍵：被鄰國併吞 → 王國「瓦解」：collapse。", "v": "collapse 崩潰；瓦解｜ruler 統治者｜take over 接管"}, {"n": 14, "s": "Though Kevin failed in last year’s singing contest, he did not feel ______. This year he practiced day and night and finally won first place in the competition.", "zh": "雖然凱文去年歌唱比賽失敗，他並沒有感到＿＿。今年他日夜練習，終於得到第一名。", "o": ["relieved", "suspected", "discounted", "frustrated"], "a": 3, "w": {"0": "relieved 是「鬆了一口氣」，失敗不會鬆口氣。", "1": "suspected 是「被懷疑」，意思不合。", "2": "discounted 是「打折的」，意思不合。"}, "k": "關鍵：Though 失敗，卻沒有「沮喪」，反而繼續努力：frustrated。", "v": "frustrated 沮喪的｜contest 比賽"}, {"n": 15, "s": "Emma and Joe are looking for a live-in babysitter for their three-year-old twins, ______ one who knows how to cook.", "zh": "艾瑪和喬在替三歲的雙胞胎找住家保母，＿＿是會煮飯的。", "o": ["initially", "apparently", "preferably", "considerably"], "a": 2, "w": {"0": "initially 是「起初」，意思不合。", "1": "apparently 是「顯然」，意思不合。", "3": "considerably 是「相當地」，意思不合。"}, "k": "關鍵：補充條件，「最好是」會煮飯的：preferably。", "v": "preferably 最好是｜live-in 住在雇主家的｜twins 雙胞胎"}], "gl": {"1": ["投降", "延期", "放棄", "反對"], "2": ["分發", "減去", "取代", "轉移"], "3": ["預訂", "觀察", "附上", "存（錢）"], "4": ["差異", "解決辦法", "要求", "評論"], "5": ["可忍受的", "敏感的", "不情願的", "謙虛的"], "6": ["單數的", "迅速的", "昂貴的", "可能的"], "7": ["準備", "認可", "形成", "計算"], "8": ["最近", "不久", "相對地", "不斷地"], "9": ["（狼）群", "（鳥）群", "（牛）群", "（魚）群"], "10": ["體諒人的", "傳染", "有趣的", "令人討厭的"], "11": ["密集的", "嚴厲的", "僵硬的", "具體的"], "12": ["毒藥", "痛苦", "漏洞", "病毒"], "13": ["瓦解", "解散", "反叛", "撤退"], "14": ["鬆一口氣的", "被懷疑的", "打折的", "沮喪的"], "15": ["起初", "顯然", "最好是", "相當地"]}, "hint": {"1": "下雨，比賽改到下週六 → 怎麼了？", "2": "網路「取代」報紙。", "3": "存夠錢了，先把旅行「訂」好。", "4": "還不了解提案，不方便做什麼？", "5": "她覺得自己的點子更好，所以「不太想」接受。", "6": "吸引顧客的服務要很「快」。", "7": "打工經驗是開餐廳的什麼？", "8": "每一季都在變。", "9": "鳥群用哪個量詞？", "10": "讓人笑、讓人放鬆的書。", "11": "頭都轉不了，脖子怎麼了？", "12": "流感是什麼引起的？", "13": "王國被鄰國併吞前，先怎樣了？", "14": "失敗了卻沒有「灰心」。", "15": "「最好」會煮飯。"}, "tag": {"1": "動詞", "2": "動詞", "3": "動詞", "4": "名詞", "5": "形容詞", "6": "形容詞", "7": "名詞", "8": "副詞", "9": "名詞", "10": "形容詞", "11": "形容詞", "12": "名詞", "13": "動詞", "14": "形容詞", "15": "副詞", "16": "分詞", "17": "轉折語", "18": "介係詞", "19": "動詞", "20": "名詞", "21": "比較", "22": "名詞", "23": "連接詞", "24": "副詞", "25": "代名詞", "26": "形容詞", "27": "使役動詞", "28": "片語", "29": "名詞", "30": "分詞"}};
const DATA101={"vocab": [{"n": 1, "s": "The ending of the movie did not come as a ______ to John because he had already read the novel that the movie was based on.", "zh": "電影的結局對約翰來說並不＿＿，因為他已經讀過電影改編的那本小說。", "o": ["vision", "focus", "surprise", "conclusion"], "a": 2, "w": {"0": "vision 是「視力；願景」，意思不合。", "1": "focus 是「焦點」，不說 come as a focus。", "3": "conclusion 是「結論」，不說 come as a conclusion to sb。"}, "k": "關鍵：come as a surprise to sb＝讓某人感到意外；他看過小說，所以不意外。", "v": "surprise 驚訝｜be based on 根據"}, {"n": 2, "s": "In order to stay healthy and fit, John exercises ______. He works out twice a week in a gym.", "zh": "為了保持健康和好身材，約翰＿＿運動，每週去健身房兩次。", "o": ["regularly", "directly", "hardly", "gradually"], "a": 0, "w": {"1": "directly 是「直接地」，意思不合。", "2": "hardly 是「幾乎不」，和每週兩次矛盾。", "3": "gradually 是「逐漸地」，意思不合。"}, "k": "關鍵：每週兩次 → 「規律地」運動：regularly。", "v": "regularly 規律地｜work out 健身｜fit 健康的"}, {"n": 3, "s": "Traveling is a good way for us to ______ different cultures and broaden our horizons.", "zh": "旅行是我們＿＿不同文化、拓展視野的好方法。", "o": ["assume", "explore", "occupy", "inspire"], "a": 1, "w": {"0": "assume 是「假定；承擔」，意思不合。", "2": "occupy 是「佔領」，意思不合。", "3": "inspire 是「激勵」，不能激勵文化。"}, "k": "關鍵：旅行可以「探索」不同的文化：explore。", "v": "explore 探索｜broaden one’s horizons 拓展視野"}, {"n": 4, "s": "The story about Hou-I shooting down nine suns is a well-known Chinese ______, but it may not be a true historical event.", "zh": "后羿射日的故事是有名的中國＿＿，但不一定是真實的歷史事件。", "o": ["figure", "rumor", "miracle", "legend"], "a": 3, "w": {"0": "figure 是「人物；數字」，故事不是人物。", "1": "rumor 是「謠言」，不是流傳的古老故事。", "2": "miracle 是「奇蹟」，意思不合。"}, "k": "關鍵：不一定是真實的歷史 → 「傳說」：legend。", "v": "legend 傳說｜historical 歷史的"}, {"n": 5, "s": "According to recent research, children under the age of 12 are generally not ______ enough to recognize risk and deal with dangerous situations.", "zh": "根據最近的研究，12 歲以下的孩子通常還不夠＿＿，無法辨識風險、應付危險的情況。", "o": ["diligent", "mature", "familiar", "sincere"], "a": 1, "w": {"0": "diligent 是「勤勉的」，和辨識風險無關。", "2": "familiar 是「熟悉的」，要接 with。", "3": "sincere 是「真誠的」，意思不合。"}, "k": "關鍵：年紀小、不能判斷危險 → 不夠「成熟」：mature enough。", "v": "mature 成熟的｜recognize 辨識｜risk 風險"}, {"n": 6, "s": "Helen let out a sigh of ______ after hearing that her brother was not injured in the accident.", "zh": "海倫聽到弟弟在意外中沒有受傷，＿＿地嘆了一口氣。", "o": ["hesitation", "relief", "sorrow", "triumph"], "a": 1, "w": {"0": "hesitation 是「猶豫」，意思不合。", "2": "sorrow 是「悲傷」，弟弟沒事不會悲傷。", "3": "triumph 是「勝利」，意思不合。"}, "k": "關鍵：a sigh of relief＝鬆了一口氣。", "v": "relief 放心；寬慰｜sigh 嘆氣"}, {"n": 7, "s": "Research suggests that people with outgoing personalities tend to be more ______, often expecting that good things will happen.", "zh": "研究顯示，個性外向的人通常比較＿＿，常常期待好事會發生。", "o": ["efficient", "practical", "changeable", "optimistic"], "a": 3, "w": {"0": "efficient 是「有效率的」，意思不合。", "1": "practical 是「實際的」，意思不合。", "2": "changeable 是「易變的」，意思不合。"}, "k": "關鍵：期待好事會發生 → 「樂觀的」：optimistic。", "v": "optimistic 樂觀的｜outgoing 外向的｜personality 個性"}, {"n": 8, "s": "No one could beat Paul at running. He has won the running championship ______ for three years.", "zh": "賽跑沒有人贏得了保羅，他已經＿＿三年贏得賽跑冠軍。", "o": ["rapidly", "urgently", "continuously", "temporarily"], "a": 2, "w": {"0": "rapidly 是「迅速地」，不修飾「贏得冠軍三年」。", "1": "urgently 是「緊急地」，意思不合。", "3": "temporarily 是「暫時地」，和三年不合。"}, "k": "關鍵：沒人贏得了他 → 「連續」三年拿冠軍：continuously。", "v": "continuously 連續地｜championship 冠軍"}, {"n": 9, "s": "If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a ______ flight.", "zh": "如果你從台北飛東京，你搭的是國際航班，而不是＿＿航班。", "o": ["liberal", "domestic", "connected", "universal"], "a": 1, "w": {"0": "liberal 是「自由的；開明的」，意思不合。", "2": "connected 是「連接的」，意思不合。", "3": "universal 是「普遍的」，意思不合。"}, "k": "關鍵：和 international（國際）相對的是 domestic（國內）。", "v": "domestic 國內的｜international 國際的"}, {"n": 10, "s": "Jack is very proud of his fancy new motorcycle. He has been ______ to all his friends about how cool it looks and how fast it runs.", "zh": "傑克很得意他的新潮機車，一直跟朋友＿＿它有多酷、跑多快。", "o": ["boasting", "proposing", "gossiping", "confessing"], "a": 0, "w": {"1": "proposing 是「提議」，意思不合。", "2": "gossiping 是「說閒話」，通常講別人的事。", "3": "confessing 是「坦承」，意思不合。"}, "k": "關鍵：很得意 → 一直「吹噓」：boast to sb about sth。", "v": "boast 吹噓｜proud 得意的｜fancy 花俏的"}, {"n": 11, "s": "The ideas about family have changed ______ in the past twenty years. For example, my grandfather was one of ten children in his family, but I am the only child.", "zh": "過去二十年來，家庭觀念＿＿改變。例如，我爺爺家有十個孩子，我卻是獨生子。", "o": ["mutually", "narrowly", "considerably", "scarcely"], "a": 2, "w": {"0": "mutually 是「互相地」，意思不合。", "1": "narrowly 是「勉強地」，意思不合。", "3": "scarcely 是「幾乎不」，和例子矛盾。"}, "k": "關鍵：十個孩子 → 獨生子，變化很大 → 「相當大地」改變：considerably。", "v": "considerably 相當大地｜only child 獨生子"}, {"n": 12, "s": "The chairperson of the meeting asked everyone to speak up instead of ______ their opinions among themselves.", "zh": "會議主席要大家大聲說出來，而不是在彼此之間＿＿自己的意見。", "o": ["reciting", "giggling", "murmuring", "whistling"], "a": 2, "w": {"0": "reciting 是「背誦」，意思不合。", "1": "giggling 是「咯咯笑」，不接 opinions。", "3": "whistling 是「吹口哨」，意思不合。"}, "k": "關鍵：和 speak up（大聲說）相反 → 「低聲嘀咕」：murmur。", "v": "murmur 低語；嘀咕｜chairperson 主席｜speak up 大聲說"}, {"n": 13, "s": "Although Mr. Chen is rich, he is a very ______ person and is never willing to spend any money to help those who are in need.", "zh": "陳先生雖然有錢，卻很＿＿，從不願意花錢幫助需要的人。", "o": ["absolute", "precise", "economic", "stingy"], "a": 3, "w": {"0": "absolute 是「絕對的」，意思不合。", "1": "precise 是「精確的」，意思不合。", "2": "economic 是「經濟的（經濟學上）」，不形容人；「節儉」是 economical。"}, "k": "關鍵：有錢卻不願幫助別人 → 「小氣的」：stingy。", "v": "stingy 小氣的｜in need 貧困的"}, {"n": 14, "s": "If you want to know what your dreams mean, now there are websites you can visit to help you ______ them.", "zh": "如果你想知道夢代表什麼意思，現在有網站可以幫你＿＿。", "o": ["overcome", "interpret", "transfer", "revise"], "a": 1, "w": {"0": "overcome 是「克服」，意思不合。", "2": "transfer 是「轉移」，意思不合。", "3": "revise 是「修改」，意思不合。"}, "k": "關鍵：知道夢的意思 → 「解釋、解讀」夢：interpret。", "v": "interpret 解釋；解讀"}, {"n": 15, "s": "The memory ______ of the new computer has been increased so that more information can be stored.", "zh": "新電腦的記憶體＿＿增加了，所以可以儲存更多資料。", "o": ["capacity", "occupation", "attachment", "machinery"], "a": 0, "w": {"1": "occupation 是「職業；佔領」，意思不合。", "2": "attachment 是「附件」，意思不合。", "3": "machinery 是「機械」，意思不合。"}, "k": "關鍵：可以存更多資料 → 記憶體「容量」：memory capacity。", "v": "capacity 容量｜store 儲存"}], "gl": {"1": ["願景", "焦點", "驚訝", "結論"], "2": ["規律地", "直接地", "幾乎不", "逐漸地"], "3": ["假定", "探索", "佔領", "激勵"], "4": ["人物", "謠言", "奇蹟", "傳說"], "5": ["勤勉的", "成熟的", "熟悉的", "真誠的"], "6": ["猶豫", "放心", "悲傷", "勝利"], "7": ["有效率的", "實際的", "易變的", "樂觀的"], "8": ["迅速地", "緊急地", "連續地", "暫時地"], "9": ["開明的", "國內的", "連接的", "普遍的"], "10": ["吹噓", "提議", "說閒話", "坦承"], "11": ["互相地", "勉強地", "相當大地", "幾乎不"], "12": ["背誦", "咯咯笑", "低聲嘀咕", "吹口哨"], "13": ["絕對的", "精確的", "經濟的", "小氣的"], "14": ["克服", "解讀", "轉移", "修改"], "15": ["容量", "職業", "附件", "機械"]}, "hint": {"1": "看過小說，所以結局不會讓他覺得怎樣？", "2": "每週兩次是「規律」的。", "3": "旅行可以「探索」文化。", "4": "不一定是真的歷史，是什麼故事？", "5": "小孩還不夠怎樣，無法判斷危險？", "6": "聽到弟弟沒事，「鬆了一口氣」。", "7": "總是期待好事發生的人。", "8": "三年都是冠軍 → 「連續」。", "9": "和「國際」相對的航班。", "10": "很得意，一直跟朋友「炫耀」。", "11": "十個孩子變成獨生子，變化很大。", "12": "不大聲說，而是在底下「嘀咕」。", "13": "有錢卻不肯花錢幫人。", "14": "夢的意思要怎樣才知道？", "15": "能存更多資料，是什麼增加了？"}, "tag": {"1": "名詞", "2": "副詞", "3": "動詞", "4": "名詞", "5": "形容詞", "6": "名詞", "7": "形容詞", "8": "副詞", "9": "形容詞", "10": "動詞", "11": "副詞", "12": "動詞", "13": "形容詞", "14": "動詞", "15": "名詞", "16": "名詞", "17": "關係代名詞", "18": "轉折語", "19": "介係詞", "20": "分詞構句", "21": "副詞", "22": "連接詞", "23": "副詞", "24": "代名詞", "25": "片語", "26": "片語", "27": "時態", "28": "比較", "29": "名詞", "30": "動詞"}};
const DATA100={"vocab": [{"n": 1, "s": "All the new students were given one minute to ______ introduce themselves to the whole class.", "zh": "每位新生有一分鐘向全班＿＿自我介紹。", "o": ["briefly", "famously", "gradually", "obviously"], "a": 0, "w": {"1": "famously 是「出名地」，意思不合。", "2": "gradually 是「逐漸地」，意思不合。", "3": "obviously 是「明顯地」，意思不合。"}, "k": "關鍵：只有一分鐘 → 「簡短地」介紹：briefly。", "v": "briefly 簡短地｜introduce 介紹"}, {"n": 2, "s": "His dark brown jacket had holes in the elbows and had ______ to light brown, but he continued to wear it.", "zh": "他的深咖啡色夾克手肘破洞，顏色也＿＿成淺咖啡色，但他還是繼續穿。", "o": ["cycled", "faded", "loosened", "divided"], "a": 1, "w": {"0": "cycled 是「騎腳踏車；循環」，意思不合。", "2": "loosened 是「變鬆」，不能變成某個顏色。", "3": "divided 是「分開」，意思不合。"}, "k": "關鍵：深咖啡變淺咖啡 → 「褪色」：fade to＋顏色。", "v": "fade 褪色｜elbow 手肘"}, {"n": 3, "s": "Everyone in our company enjoys working with Jason. He’s got all the qualities that make a ______ partner.", "zh": "我們公司每個人都喜歡和傑森共事，他具備成為＿＿夥伴的所有特質。", "o": ["desirable", "comfortable", "frequent", "hostile"], "a": 0, "w": {"1": "comfortable 是「舒服的」，形容東西或感覺，不形容夥伴的特質。", "2": "frequent 是「頻繁的」，意思不合。", "3": "hostile 是「有敵意的」，意思相反。"}, "k": "關鍵：大家都喜歡和他工作 → 「令人想要的、理想的」夥伴：desirable。", "v": "desirable 理想的；令人嚮往的｜quality 特質"}, {"n": 4, "s": "Eyes are sensitive to light. Looking at the sun ______ could damage our eyes.", "zh": "眼睛對光很敏感，＿＿看太陽可能會傷害眼睛。", "o": ["hardly", "specially", "totally", "directly"], "a": 3, "w": {"0": "hardly 是「幾乎不」，幾乎不看太陽就不會傷眼。", "1": "specially 是「特別地」，意思不合。", "2": "totally 是「完全地」，意思不合。"}, "k": "關鍵：「直接」看太陽會傷眼：look at the sun directly。", "v": "directly 直接地｜sensitive 敏感的｜damage 傷害"}, {"n": 5, "s": "We were forced to ______ our plan for the weekend picnic because of the bad weather.", "zh": "因為天氣不好，我們被迫＿＿週末野餐的計畫。", "o": ["maintain", "record", "propose", "cancel"], "a": 3, "w": {"0": "maintain 是「維持」，和 forced、bad weather 矛盾。", "1": "record 是「記錄」，意思不合。", "2": "propose 是「提議」，意思不合。"}, "k": "關鍵：天氣不好，被迫「取消」計畫：cancel。", "v": "cancel 取消｜be forced to 被迫"}, {"n": 6, "s": "Three people are running for mayor. All three ______ seem confident that they will be elected, but we won’t know until the outcome of the election is announced.", "zh": "有三個人在競選市長，三位＿＿似乎都有信心會當選，但要等選舉結果公布才會知道。", "o": ["particles", "receivers", "candidates", "containers"], "a": 2, "w": {"0": "particles 是「粒子」，意思不合。", "1": "receivers 是「接收者」，意思不合。", "3": "containers 是「容器」，意思不合。"}, "k": "關鍵：競選（running for）的人 → 「候選人」：candidates。", "v": "candidate 候選人｜run for 競選｜elect 選舉"}, {"n": 7, "s": "If you ______ a traffic law, such as drinking and driving, you may not drive for some time.", "zh": "如果你＿＿交通規則，例如酒駕，可能會有一段時間不能開車。", "o": ["destroy", "violate", "attack", "invade"], "a": 1, "w": {"0": "destroy 是「摧毀」，不說 destroy a law。", "2": "attack 是「攻擊」，意思不合。", "3": "invade 是「侵略」，意思不合。"}, "k": "關鍵：violate a law＝違反法律。", "v": "violate 違反｜drinking and driving 酒駕"}, {"n": 8, "s": "Applying to college means sending in applications, writing study plans, and so on. It’s a long ______, and it makes students nervous.", "zh": "申請大學要送申請書、寫讀書計畫等等，是一個漫長的＿＿，讓學生很緊張。", "o": ["errand", "operation", "process", "display"], "a": 2, "w": {"0": "errand 是「差事；跑腿」，意思不合。", "1": "operation 是「手術；運作」，意思不合。", "3": "display 是「展示」，意思不合。"}, "k": "關鍵：一連串步驟 → 「過程、程序」：process。", "v": "process 過程｜application 申請書"}, {"n": 9, "s": "Dr. Chu’s speech on the new energy source attracted great ______ from the audience at the conference.", "zh": "朱博士關於新能源的演講，在研討會上吸引了聽眾很大的＿＿。", "o": ["attention", "fortune", "solution", "influence"], "a": 0, "w": {"1": "fortune 是「財富；運氣」，意思不合。", "2": "solution 是「解決辦法」，意思不合。", "3": "influence 是「影響」，不說 attract influence from。"}, "k": "關鍵：attract attention＝吸引注意。", "v": "attention 注意｜conference 研討會"}, {"n": 10, "s": "Everyone in the office must attend the meeting tomorrow. There are no ______ allowed.", "zh": "辦公室每個人明天都必須出席會議，不允許有＿＿。", "o": ["exceptions", "additions", "divisions", "measures"], "a": 0, "w": {"1": "additions 是「增加的東西」，意思不合。", "2": "divisions 是「分割；部門」，意思不合。", "3": "measures 是「措施」，意思不合。"}, "k": "關鍵：Everyone must → function mBuildBlank(sec){
  const D=MORE[sec];if(!D){$("sec-"+sec).innerHTML='<div class="notyet">這一年沒有這個題型。</div>';return}
  if(!T[sec])T[sec]={el:0,run:false,last:0,fin:false};tReset(sec);
  const isWb=sec==="wb",opts=isWb?D.bank:D.opts;
  const st={cur:D.items[0].n,s:{}};D.items.forEach(q=>st.s[q.n]={done:false,tries:0,wrong:new Set()});MS[sec]=st;
  const order=mShuffle(opts.map(o=>o.k));const LB={};order.forEach((k,i)=>LB[k]="ABCDEFGHIJ"[i]);
  const root=$("sec-"+sec);
  root.innerHTML=`<p class="howto">${isWb?"先點文章裡的空格，再從下方的字詞中選一個填進去。每個字詞只會用到一次。":"先點文章裡的空格，再從下方的句子中選一句放進去。五個句子裡有一句用不到。"}</p>
  <div class="mp"><div class="passage"><h3>${D.title}</h3>${D.p.map(t=>"<p"+(t.indexOf("{")===0?' class="noind"':"")+">"+mPara(t)+"</p>").join("")}
  <details class="tr" id="${sec}-tr" hidden><summary>看全文翻譯</summary>${D.tr.map(t=>"<p>"+t+"</p>").join("")}</details></div>
  <div class="dock${isWb?"":" static"}"><p class="now"><span id="${sec}-now"></span><button class="btn b-only" id="${sec}-hint">提示</button></p><div id="${sec}-fb"></div><div class="chips${isWb?"":" sent"}" id="${sec}-chips"></div></div>
  <div class="dlist" id="${sec}-done"></div></div>`;
  root.querySelectorAll(".mb").forEach(b=>b.onclick=()=>{if(!st.s[b.dataset.n].done){st.cur=+b.dataset.n;draw()}});
  const word=k=>opts.find(o=>o.k===k);
  function draw(){
    root.querySelectorAll(".mb").forEach(b=>b.classList.toggle("cur",+b.dataset.n===st.cur&&!st.s[b.dataset.n].done));
    const q=D.items.find(x=>x.n===st.cur);
    $(sec+"-now").textContent=q?`第 ${q.n} 題要填：`+(BASIC&&isWb?q.need:""):"全部完成";
    const used=new Set(D.items.filter(x=>st.s[x.n].done).map(x=>x.a));
    const wr=q?st.s[q.n].wrong:new Set();
    $(sec+"-chips").innerHTML=order.map(k=>{const o=word(k);const u=used.has(k),no=wr.has(k);
      return `<button class="chip${u?" used":""}${no?" no":""}" data-k="${k}"${u||no||!q?" disabled":""}><span class="k">(${LB[k]})</span>${isWb?esc(o.w)+`<small>${o.pos}・${o.m}</small>`:esc(o.t)+`<span class="czh">${o.zh}</span>`}</button>`}).join("");
    $(sec+"-chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>pick(c.dataset.k));
    const h=$(sec+"-hint");if(h){h.hidden=!q;h.onclick=()=>{$(sec+"-fb").innerHTML=`<div class="fb good"><span class="tag">提示</span>${isWb?q.why:q.k.split("。")[0]+"。"}</div>`}}
  }
  function pick(k){
    const q=D.items.find(x=>x.n===st.cur);if(!q)return;const s=st.s[q.n];s.tries++;tStart(sec);
    const o=word(k);
    if(k!==q.a){s.wrong.add(k);
      let msg;
      if(isWb){const pos=o.pos.replace("片語","");msg=pos!==q.need?`這一格要填<b>${q.need}</b>，<span class="en">${esc(o.w)}</span> 是${o.pos}，放進去文法不通。<br>${q.why}`:(q.same[k]||"詞性對了，但意思和上下文接不起來，再看看前後句。")}
      else msg=q.w[k]||"這一句和前後文接不起來，再看看空格前後在講什麼。";
      $(sec+"-fb").innerHTML=`<div class="fb bad"><span class="tag">再想想看</span>${msg}</div>`;draw();return}
    s.done=true;const b=$("mb-"+q.n);b.textContent=isWb?o.w:"("+LB[k]+")";b.classList.add("done");b.disabled=true;
    if(!isWb){b.title=o.t}
    const others=isWb?Object.entries(q.same).map(([kk,t])=>`<li>${t}</li>`).join(""):Object.entries(q.w).map(([kk,t])=>`<li><b>(${LB[kk]})</b> ${t}</li>`).join("");
    $(sec+"-done").insertAdjacentHTML("afterbegin",`<div class="drow"><div class="h">第 ${q.n} 題　<span class="en">(${LB[k]}) ${esc(isWb?o.w:o.t)}</span>${isWb?`<span class="tag">${q.need}</span>`:""}${s.tries===1?" ✓ 一次答對":""}</div><div>${q.k}</div>${others?`<ul>${others}</ul>`:""}<div class="muted small">${q.v}</div></div>`);
    $(sec+"-fb").innerHTML=`<div class="fb good"><span class="tag">答對了！</span>${q.k}</div>`;
    const next=D.items.find(x=>!st.s[x.n].done&&x.n>q.n)||D.items.find(x=>!st.s[x.n].done);
    st.cur=next?next.n:null;draw();
    const done=D.items.filter(x=>st.s[x.n].done).length,first=D.items.filter(x=>st.s[x.n].tries===1).length;
    mStatus(sec,done+" / "+D.items.length);
    if(!next){$(sec+"-tr").hidden=false;$(sec+"-fb").innerHTML="";root.querySelector(".dock").hidden=true;
      const used=mSummary(sec,root.querySelector(".mp"),first,D.items.length,()=>mBuildBlank(sec));
      const wrong=D.items.filter(x=>st.s[x.n].tries>1);
      mSave(sec,first,D.items.length,used,wrong.map(x=>x.n),wrong.map(x=>isWb?"文意選填－"+x.need:"篇章結構"))}
  }
  mStatus(sec,"0 / "+D.items.length);draw();
}

      const done=all.filter(x=>st[x.n].done).length,first=all.filter(x=>st[x.n].tries===1).length;mStatus(sec,done+" / "+all.length);

    });

  function fin(key,ok1){parts[key]=ok1;const keys=Object.keys(parts);const n=M.items.reduce((a,it)=>a+(it.type==="fill"?it.blanks.length:1),0);

      <div class="mx-s">${esc(it.s).replace(/\{(\w+)\}/g,(m,n)=>{const bb=it.blanks.find(x=>String(x.n)===n)||{};const lb=bb.lb||n;return `<b>${lb}</b> <input class="mx-in" id="mxi-${n}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第 ${lb} 題">`})}</div><p class="qz">${it.szh}</p>

      const tries={},FB={};it.blanks.forEach(b=>{tries[b.n]=0;FB[b.n]=""});
      const check=(show)=>{let html="";tStart(sec);const add=(n,h)=>{FB[n]=h};
        it.blanks.forEach(b=>{const inp=$("mxi-"+b.n);if(inp.classList.contains("ok"))return;
          const v=mNorm(inp.value);
          if(!show&&!v){add(b.n,`<div class="fb bad"><span class="tag">第 ${b.lb||b.n} 題還沒填</span></div>`);return}
          if(!show)tries[b.n]++;
          if(!show&&b.ans.includes(v)){inp.classList.remove("bad");inp.classList.add("ok");inp.disabled=true;add(b.n,`<div class="fb good"><span class="tag">第 ${b.lb||b.n} 題答對了！</span>${b.k}</div>`);fin(String(b.n),tries[b.n]===1);return}
          if(show){inp.value=b.ans[0];inp.classList.remove("bad");inp.classList.add("ok");inp.disabled=true;add(b.n,`<div class="fb good"><span class="tag">第 ${b.lb||b.n} 題答案</span>${b.k}</div>`);if(!(String(b.n) in parts))fin(String(b.n),false);return}
          inp.classList.add("bad");
          const msg=v===mNorm(b.src)?`字找對了！但是放進句子要做<b>字形變化</b>。${b.hint}`:b.hint;

        if(it.blanks.some(b=>tries[b.n]>=2&&!$("mxi-"+b.n).classList.contains("ok")))el.querySelector("[data-show]").hidden=false;
        if(it.blanks.every(b=>$("mxi-"+b.n).classList.contains("ok"))){el.querySelector("[data-chk]").hidden=true;el.querySelector("[data-show]").hidden=true}};
      el.querySelector("[data-chk]").onclick=()=>check(false);el.querySelector("[data-show]").onclick=()=>check(true);
    }else if(it.type==="multi"){
      el.innerHTML=`<p class="stem"><span class="num">${it.n}.</span>${esc(it.q)}<span class="pts">多選・${it.pts}</span></p><p class="qz">${it.qzh}</p>

      let tries=0;
      const reveal=(ok)=>{el.querySelectorAll("input").forEach(c=>{c.disabled=true;c.checked=it.a.includes(c.value)});
        el.querySelectorAll("label").forEach(l=>{l.classList.remove("bad");if(it.a.includes(l.dataset.k))l.classList.add("ok")});
        el.querySelector("[data-chk]").hidden=true;el.querySelector("[data-show]").hidden=true;
        el.querySelector(".fbw").innerHTML=`<div class="fb good"><span class="tag">${ok?"答對了！":"答案："}${it.a.join("、")}</span><ul>${it.a.map(k=>`<li><b>${k}</b>：${it.why[k]}</li>`).join("")}${Object.entries(it.no).map(([k,t])=>`<li><b>${k}</b>：${t}</li>`).join("")}</ul></div>`;
        if(!(String(it.n) in parts))fin(String(it.n),ok&&tries===1)};
      el.querySelector("[data-chk]").onclick=()=>{const sel=[...el.querySelectorAll("input:checked")].map(c=>c.value).sort();tStart(sec);
        if(!sel.length){el.querySelector(".fbw").innerHTML='<div class="fb bad"><span class="tag">還沒選</span>這題是多選題，至少要選一個。</div>';return}
        tries++;
        if(sel.join()===it.a.slice().sort().join()){reveal(true);return}
        const extra=sel.filter(k=>!it.a.includes(k)),miss=it.a.filter(k=>!sel.includes(k)).length;
        el.querySelectorAll("label").forEach(l=>l.classList.toggle("bad",extra.includes(l.dataset.k)));
        el.querySelector(".fbw").innerHTML=`<div class="fb bad"><span class="tag">再想想看</span>${extra.map(k=>`<b>${k}</b>：${it.no[k]||""}`).join("<br>")}${miss?`${extra.length?"<br>":""}還少選了 ${miss} 家店。三樣東西各要去哪一家店買？回文章找每家店賣什麼。`:""}</div>`;
        if(tries>=2)el.querySelector("[data-show]").hidden=false};
      el.querySelector("[data-show]").onclick=()=>reveal(false);
    }else if(it.type==="short"){
      el.innerHTML=`<p class="stem"><span class="num">${it.n}.</span>${esc(it.q)}<span class="pts">簡答・${it.pts}</span></p><p class="qz">${it.qzh}</p>
      <textarea class="mx-ta" aria-label="第 ${it.n} 題作答"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn primary" data-chk>檢查答案</button><button class="btn" data-show hidden>看答案</button></div><div class="fbw"></div>`;
      let tries=0;const ta=el.querySelector("textarea");
      const done=(ok)=>{ta.disabled=true;el.querySelector("[data-chk]").hidden=true;el.querySelector("[data-show]").hidden=true;
        el.querySelector(".fbw").innerHTML=`<div class="fb good"><span class="tag">${ok?"答對了！":"參考答案："+esc(it.model)}</span>${it.k}</div>`;fin(String(it.n),ok&&tries===1)};
      el.querySelector("[data-chk]").onclick=()=>{const v=mNorm(ta.value);tStart(sec);
        if(!v){el.querySelector(".fbw").innerHTML='<div class="fb bad"><span class="tag">還沒寫</span>先寫下你的答案。</div>';return}
        tries++;
        if(it.keys.some(k=>v.includes(mNorm(k)))){done(true);return}
        el.querySelector(".fbw").innerHTML=`<div class="fb bad"><span class="tag">再想想看</span>${it.hint||"回到文章找找看，答案就在原文裡。"}</div>`;
        if(tries>=2)el.querySelector("[data-show]").hidden=false};
      el.querySelector("[data-show]").onclick=()=>done(false);
    }
  });
  mStatus(sec,"0 / "+M.items.reduce((a,it)=>a+(it.type==="fill"?it.blanks.length:1),0));
}

function pick(q,sec,i,div){
  const st=state[sec][q.n]||(state[sec][q.n]={tries:0,firstWrong:false,done:false});
  if(st.done) return;
  if(!T[sec].run&&!T[sec].fin) tStart(sec);
  st.tries++;
  const btn=div.querySelector(`#o${q.n}-${i}`);const fbw=div.querySelector(".fbw");
  if(i!==q.a){
    if(st.tries===1) st.firstWrong=true;
    btn.classList.add("wrong");btn.disabled=true;
    fbw.innerHTML=`<div class="fb bad"><span class="tag">(${letter(q.n,i)}) 不對，再想想</span>${q.w[i]}</div>`;
  }else{
    st.done=true;btn.classList.add("right");div.classList.add("show-gl");div.querySelector(".hints").hidden=true;
    div.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    const others=order[q.n].filter(j=>j!==q.a).map(j=>`<li><span class="en">(${letter(q.n,j)}) ${q.o[j]}</span>：${q.w[j]}</li>`).join("");
    fbw.innerHTML=`<div class="fb good"><span class="tag">${st.firstWrong?"答對了（第 "+st.tries+" 次）":"一次就答對！"}</span>${q.k}<ul>${others}</ul><div style="margin-top:6px"><b>重點單字：</b>${q.v}</div></div>`;
    if(sec==="cloze"){const b=document.getElementById("b"+q.n);if(b){b.textContent=q.o[q.a];b.classList.add("done");}}
    const w=loadWrong();const set=new Set(w[sec]||[]);
    if(st.firstWrong) set.add(q.n); else set.delete(q.n);
    w[sec]=[...set].sort((a,b)=>a-b);saveWrong(w);
    update(sec);
  }
}
function update(sec){

  const first=list.filter(n=>state[sec][n]&&state[sec][n].done&&!state[sec][n].firstWrong).length;
  document.getElementById("sc-"+sec).textContent=`${done} / ${list.length}`;
  const box=document.getElementById("sum-"+sec);
  if(done===list.length){
    const wrong=list.filter(n=>state[sec][n].firstWrong);
    tick();T[sec].run=false;T[sec].fin=true;drawTimer();
    const used=T[sec].el,over=LIMIT>0&&used>LIMIT;
    if(scope[sec]==="全部"){try{localStorage.setItem("gsat-done-"+YEAR+"-"+sec,"1")}catch(e){}fillYears();}

}

  const root=document.getElementById("sec-"+sec);root.innerHTML="";
  const list=sec==="vocab"?vocab:cloze;
  state[sec]={};tReset(sec);scope[sec]=only?"錯題重做":"全部";
  current[sec]=list.map(q=>q.n).filter(n=>!only||only.includes(n));
  root.insertAdjacentHTML("beforeend",toolbar(sec,only));
  root.querySelector('[data-act="all"]').onclick=()=>build(sec,null);
  const wb=root.querySelector('[data-act="wrong"]');if(wb) wb.onclick=()=>build(sec,loadWrong()[sec]);
  const sheet=document.createElement("div");sheet.className="sheet";
  if(sec==="vocab"){
    root.insertAdjacentHTML("beforeend",`<p class="howto">選出最適合填入空格的字。每題下面有中文意思，看不懂英文句子時可以參考。</p>`);
    shuffle(vocab.filter(q=>current[sec].includes(q.n))).forEach((q,i)=>sheet.appendChild(renderItem(q,sec,true,i+1)));
  }else{
    root.insertAdjacentHTML("beforeend",`<p class="howto">先讀文章，再回答下面的題目。答對後，答案會自動填進文章空格。讀完可以打開「看中文翻譯」。</p>`);
    passages.forEach((ps,pi)=>{
      const nums=[...ps.p.join(" ").matchAll(/\{(\d+)\}/g)].map(m=>+m[1]);
      const use=nums.filter(n=>current[sec].includes(n));
      if(!use.length) return;
      const pa=document.createElement("div");pa.className="passage";
      pa.innerHTML=`<h3>${ps.title}</h3>`+ps.p.map(t=>"<p>"+t.replace(/\{(\d+)\}/g,(m,n)=>{const q=cloze.find(c=>c.n==n);const dn=!use.includes(+n);return `<span class="blank${dn?" done":""}" id="b${n}" role="button" tabindex="0">${dn?q.o[q.a]:n}</span>`;})+"</p>").join("")+`<details class="tr"><summary>看中文翻譯</summary>${ps.tr.map(t=>"<p>"+t+"</p>").join("")}</details>`;
      sheet.appendChild(pa);
      use.forEach(n=>sheet.appendChild(renderItem(cloze.find(c=>c.n===n),sec,false)));
    });
    sheet.addEventListener("click",e=>{const b=e.target.closest(".blank");if(b&&!b.classList.contains("done")){document.getElementById("q"+b.id.slice(1))?.scrollIntoView({behavior:"smooth",block:"center"});}});
  }
  root.appendChild(sheet);
  const sum=document.createElement("div");sum.className="summary";sum.id="sum-"+sec;sum.hidden=true;root.appendChild(sum);
  update(sec);
  if(document.getElementById("sec-"+sec).offsetParent) window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t?"true":"false"));
  ["vocab","cloze","wb","st","rd","mx","write"].forEach(k=>document.getElementById("sec-"+k).hidden=t.dataset.sec!==k);
  if(t.dataset.sec!=="write"&&!T[t.dataset.sec])T[t.dataset.sec]={el:0,run:false,last:0,fin:false};
  t.scrollIntoView({block:"nearest",inline:"nearest"});
  document.getElementById("timer").hidden=t.dataset.sec==="write";
  if(t.dataset.sec!=="write"){active=t.dataset.sec;drawTimer();}
  window.scrollTo({top:0});
}));

/* ========== 三、翻譯與作文（AI 即時批改） ========== */
const OLDFMT={"110":1,"109":1,"108":1,"107":1,"106":1,"105":1,"104":1,"103":1,"102":1,"101":1,"100":1};
function doneLabel(y){const K=OLDFMT[y]?["vocab","cloze","wb","rd"]:["vocab","cloze","wb","st","rd","mx"];let n=0;K.forEach(k=>{try{if(localStorage.getItem("gsat-done-"+y+"-"+k))n++}catch(e){}});return n===K.length?"　✓ 已完成":n?"　（完成 "+n+" / "+K.length+"）":""}
function fillYears(){const sel=document.getElementById("ysel");sel.innerHTML=YLIST.map(y=>`<option value="${y}"${y===YEAR?" selected":""}>${y} 年學測${doneLabel(y)}</option>`).join("")}
document.getElementById("ysel").addEventListener("change",async()=>{
  setYearData(document.getElementById("ysel").value);fillYears();build("vocab",null);
  if(UNLOCKED){$("sec-cloze").innerHTML='<p class="muted">讀取中…</p>';
    try{const data=await gas("getLockedContent",CODE,YEAR);
      if(data&&data.ok){passages=data.passages;cloze=data.cloze;Object.assign(GL,data.gl);Object.assign(HINT,data.hint);build("cloze",null);loadMore();}
      else $("sec-cloze").innerHTML='<p class="muted">這一年的綜合測驗讀取失敗，請重新整理頁面。</p>';
    }catch(e){$("sec-cloze").innerHTML='<p class="muted">連線失敗，請重新整理頁面。</p>'}
    loadWriting();
  }else{$("sc-cloze").textContent="訂閱解鎖";renderLock();loadMore();}
});
let WINFO=null;
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draftKey(k){return "gsat-draft-"+k}
function getDraft(k){try{return localStorage.getItem(draftKey(k))||""}catch(e){return ""}}
function setDraft(k,v){try{localStorage.setItem(draftKey(k),v)}catch(e){}}
function renderWriteLock(){
  WINFO=null;$("sc-write").textContent="AI 批改";
  $("sec-write").innerHTML=`<div class="lock"><h2>翻譯和作文的寫作指引</h2><p>先在紙上寫，再對照指引自己檢查，知道哪裡寫得好、哪裡要改。</p>
  <ul><li>中譯英：參考譯法、每個關鍵詞怎麼翻、學生最常犯的錯</li><li>英文作文：兩段怎麼安排、實用單字和句型、一篇完整的範文</li></ul>
  <p>訂閱後就可以使用。</p><button class="btn primary" id="wLogin">已經訂閱？登入</button></div>`;
  $("wLogin").onclick=()=>{window.scrollTo({top:0,behavior:"smooth"});showLogin(true);};
}
async function loadWriting(){
  $("sec-write").innerHTML=`<p class="muted">讀取中…</p>`;
  try{const r=await gas("getWritingInfo",CODE,YEAR);if(!r||!r.ok){renderWriteLock();return}WINFO=r;renderWrite();}
  catch(e){$("sec-write").innerHTML=`<p class="wmsg err">讀取失敗，請重新整理頁面。</p>`}
}
function wcount(t){return (t.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length}
function renderWrite(){
  const r=WINFO,d=r.data,left=Math.max(0,r.quota-r.used),dayLeft=Math.max(0,Math.min(left,(r.perDay||99)-(r.usedToday||0)));
  const open=r.quota>0;
  $("sc-write").textContent=open?`本月剩 ${left} 篇`:"寫作指引";
  const tr=d.translation,es=d.essay;
  const hist=r.history.length?r.history.map(h=>`<div class="hist"><div class="hd"><span>${esc(h.date)}・${esc(h.title)}</span><span class="pill ${h.done?"done":"wait"}">${h.done?"已批改":"批改中"}</span></div>
     <details><summary>${h.done?"看批改結果":"看我送出的內容"}</summary>${h.done&&h.teacher?`<p class="fbtext"><b>老師的話：</b>${esc(h.teacher)}</p>`:""}<div class="ans">${esc(h.answer)}</div>${h.done?`<p class="fbtext">${esc(h.feedback)}</p>`:""}</details></div>`).join("")
    :`<p class="muted" style="margin:0">還沒有送出過。</p>`;
  $("sec-write").innerHTML=`
  ${open?`<div class="quota">本月還可以送出 <b>${left} / ${r.quota}</b> 篇，今天還可以送 <b>${dayLeft}</b> 篇（中譯英一組算一篇）。送出後${esc(r.turnaround)}就會看到 AI 批改結果，也會保存在這一頁最下面。<br><span class="small muted">批改由 AI 依大考評分原則完成，分數是預估。請不要在作答裡寫真實姓名、學校等個人資料。</span></div>`:r.needLogin?`<div class="quota">寫完可以送給 AI 批改，大約 30 秒就有結果：預估分數、逐句修改和改寫示範。<b>用 Google 免費登入</b>就能使用。<div class="row" style="margin-top:8px"><button class="btn primary" id="wLogin2">免費登入</button></div></div>`:`<div class="quota">建議先在紙上寫，限時 30 分鐘左右，寫完再打開下面的寫作指引對照。</div>`}
  <div class="wcard"><h2>${esc(tr.title)}</h2><p class="note">${esc(tr.note)}</p>
    ${tr.items.map((x,i)=>`<p class="wq">${i+1}. ${esc(x)}</p>${open?`<label class="sr" for="wt${i}">第 ${i+1} 題翻譯</label><textarea id="wt${i}" data-k="tr${i}" spellcheck="false" placeholder="在這裡寫英文翻譯"></textarea>`:""}`).join("")}
    ${open?`<div class="row" style="margin-top:10px"><button class="btn primary" data-send="translation">送出翻譯</button></div><div data-box="translation"></div>`:""}
    ${trGuide(tr)}</div>
  <div class="wcard"><h2>${esc(es.title)}</h2><p class="note">說明：依提示寫一篇英文作文，文長至少 ${es.minWords} 個單詞（words）。</p>
    <p style="margin:0 0 6px">提示：${esc(es.prompt)}</p>
    ${es.image?`<img src="${es.image}" alt="題目圖片：${esc(es.imageDesc)}">`:""}
    ${open?`<label class="sr" for="we">英文作文</label><textarea id="we" class="essay" data-k="essay" spellcheck="false" placeholder="在這裡寫作文。兩段之間空一行。"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:8px"><span class="wcount" id="wc"></span><button class="btn primary" data-send="essay">送出作文</button></div><div data-box="essay"></div>`:""}
    ${esGuide(es)}</div>
  ${open||r.history.length?`<div class="wcard"><h2>我的批改紀錄</h2>${hist}</div>`:""}`;
  document.querySelectorAll("#sec-write textarea").forEach(ta=>{ta.value=getDraft(ta.dataset.k);ta.addEventListener("input",()=>{setDraft(ta.dataset.k,ta.value);if(ta.id==="we")updCount()})});
  function updCount(){if(!$("we"))return;const n=wcount($("we").value);$("wc").textContent=`已寫 ${n} 個單詞（至少 ${es.minWords}）`;$("wc").className="wcount"+(n>=es.minWords?" ok":"")}
  updCount();
  document.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>askSend(b.dataset.send));
  if($("wLogin2"))$("wLogin2").onclick=()=>{window.scrollTo({top:0,behavior:"smooth"});showLogin(true);};
}
function trGuide(tr){
  if(!tr.guide)return "";
  return `<details class="guide"><summary>看參考譯法與常見錯誤</summary>${tr.guide.map((g,i)=>`<div class="gsec"><p class="gq">第 ${i+1} 題</p>
    <p class="gl">參考譯法</p><ul>${g.ref.map(x=>`<li class="en">${esc(x)}</li>`).join("")}</ul>
    <p class="gl">翻譯重點</p><ul>${g.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <p class="gl">常見錯誤</p><ul>${g.errors.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</details>`;
}
function esGuide(es){
  const g=es.guide;if(!g)return "";
  return `<details class="guide"><summary>看寫作指引與範文</summary>
    <div class="gsec"><p class="gl">段落安排</p><ul>${g.structure.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="gsec"><p class="gl">實用單字</p><ul class="cols">${g.vocab.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="gsec"><p class="gl">實用句型</p><ul>${g.patterns.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="gsec"><p class="gl">範文（${wcount(g.model)} 個單詞，參考用）</p><div class="model">${esc(g.model)}</div>
    <p class="muted small">範文只是其中一種寫法。你的內容和例子不同沒關係，重點是兩段都有回答題目要求、句子正確。</p></div></details>`;
}
function askSend(kind){
  const box=document.querySelector(`[data-box="${kind}"]`),r=WINFO;
  if(r.used>=r.quota){box.innerHTML=`<p class="wmsg err">這個月的批改篇數已經用完，下個月 1 號會恢復。草稿會留在這台裝置上。</p>`;return}
  if(r.perDay&&(r.usedToday||0)>=r.perDay){box.innerHTML=`<p class="wmsg err">今天已經送出 ${r.perDay} 篇了，明天再來。草稿會留在這台裝置上。</p>`;return}
  if(kind==="translation"&&[0,1].some(i=>!$("wt"+i).value.trim())){box.innerHTML=`<p class="wmsg err">每一題都要寫完才能送出。</p>`;return}
  if(kind==="essay"){const n=wcount($("we").value);if(n<40){box.innerHTML=`<p class="wmsg err">作文太短了，寫完整再送出。</p>`;return}}
  const warn=kind==="essay"&&wcount($("we").value)<WINFO.data.essay.minWords?`<br>目前還不到 ${WINFO.data.essay.minWords} 個單詞，正式考試會扣分。`:"";
  box.innerHTML=`<div class="confirm">確定要送出嗎？送出後就不能修改，會用掉本月 1 篇額度。${warn}<div class="row" style="margin-top:8px"><button class="btn primary" data-ok>確定送出</button><button class="btn" data-no>再檢查一下</button></div></div>`;
  box.querySelector("[data-no]").onclick=()=>{box.innerHTML=""};
  box.querySelector("[data-ok]").onclick=async e=>{
    e.currentTarget.disabled=true;
    document.querySelectorAll("[data-send]").forEach(b=>b.disabled=true);
    const ans=kind==="translation"?[0,1].map(i=>$("wt"+i).value):$("we").value;
    let sec=0;const tick=()=>{box.innerHTML=`<div class="confirm" aria-live="polite">AI 正在批改，通常 20 到 40 秒…（${sec} 秒）<br><span class="small muted">請不要關閉或重新整理這一頁。</span></div>`};
    tick();const iv=setInterval(()=>{sec++;tick()},1000);
    try{const x=await gas("submitWriting",CODE,kind,ans,YEAR);
      clearInterval(iv);
      if(x&&x.ok){
        (kind==="translation"?["tr0","tr1"]:["essay"]).forEach(k=>setDraft(k,""));
        await loadWriting();
        const b2=document.querySelector(`[data-box="${kind}"]`);
        if(b2)b2.innerHTML=`<div class="wcard" style="margin-top:12px;border-color:var(--ok)"><p class="wmsg good" style="margin-top:0"><b>批改完成！</b>結果也存在這一頁最下面的「我的批改紀錄」。</p><p class="fbtext">${esc(x.feedback)}</p><p class="small muted">批改由 AI 完成，分數是依大考評分原則的預估，實際閱卷結果可能有差異。</p></div>`;
      }else{
        document.querySelectorAll("[data-send]").forEach(b=>b.disabled=false);
        box.innerHTML=`<p class="wmsg err">${esc((x&&x.msg)||"送出失敗，請再試一次。")}</p>`;
      }
    }catch(err){clearInterval(iv);document.querySelectorAll("[data-send]").forEach(b=>b.disabled=false);box.innerHTML=`<p class="wmsg err">連線中斷了。作答還在框框裡，請過一下再試。如果下面的批改紀錄已經出現這一篇，就不用重送。</p>`;loadWritingKeep(kind)}
  };
}
function loadWritingKeep(kind){/* 連線中斷時不清空作答，只更新紀錄 */
  gas("getWritingInfo",CODE,YEAR).then(r=>{if(r&&r.ok){const msg=document.querySelector(`[data-box="${kind}"]`).innerHTML;WINFO=r;renderWrite();const b=document.querySelector(`[data-box="${kind}"]`);if(b)b.innerHTML=msg}}).catch(()=>{});
}

fillYears();build("vocab",null);setFree();
if(LOGIN_URL.indexOf("http")===0)$("googleLogin").href=LOGIN_URL;else $("gwrap").hidden=true;
if(CFG.freeMode){const gp=document.querySelector("#gwrap p");if(gp)gp.textContent="免費。登入後成績會自動記錄，每週一收到練習摘要。";}
const QS=new URLSearchParams(location.search),LT=QS.get("login");
if(LT){try{history.replaceState(null,"",location.pathname)}catch(e){}
  gmsg.textContent="登入中…";
  gas("exchangeLogin",LT).then(r=>{if(r&&r.ok){try{localStorage.setItem("gsat-code",r.session)}catch(e){}
    if(QS.get("page")==="progress"){location.href="progress.html";return}enter(r.session,true)}
    else{showLogin(true);gmsg.className="gmsg err";gmsg.textContent="登入逾時了，請再按一次「用 Google 登入」。"}}).catch(()=>{gmsg.className="gmsg err";gmsg.textContent="連線失敗，請重新整理頁面。"});}
else if(SESSION){enter(SESSION,true);}
else{try{const c=localStorage.getItem("gsat-code");if(c){if(c.indexOf("S.")!==0)$("gcode").value=c;enter(c,true)}}catch(e){}}
if(location.hash==="#write"){const tw=document.getElementById("tab-write");if(tw)setTimeout(()=>tw.click(),0);}
</script>
