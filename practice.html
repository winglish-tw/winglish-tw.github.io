<title>學測英文練習｜Winglish 必英</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one narrow exam-sheet column; tabs on top; each item is a card-free row separated by rules */
:root{
  --bg:#f3f5f8; --sheet:#ffffff; --fg:#1d2733; --muted:#5d6b7a; --rule:#dde3ea;
  --ink:#1f4e8c; --ink-soft:#e6eef8;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b33a2e; --bad-soft:#fbe9e6;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --sheet:#1a2129; --fg:#e4e9ef; --muted:#9aa8b6; --rule:#2c3640;
  --ink:#8db6ec; --ink-soft:#1f2c3c; --ok:#6fcf9b; --ok-soft:#173226; --bad:#f08a7e; --bad-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --sheet:#1a2129; --fg:#e4e9ef; --muted:#9aa8b6; --rule:#2c3640;
  --ink:#8db6ec; --ink-soft:#1f2c3c; --ok:#6fcf9b; --ok-soft:#173226; --bad:#f08a7e; --bad-soft:#3a1f1c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-zh);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.homelink{display:inline-block;margin:0 0 10px;font-size:.92rem;color:var(--ink);text-decoration:none;font-weight:600}
.homelink:hover{text-decoration:underline}
header h1{font-size:1.35rem;margin:0;text-wrap:balance}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:8px;margin:18px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{flex-wrap:wrap}
.timer{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 12px}
.clock{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--ink);min-width:4.2em}
.clock.warn{color:#c27a12}
.clock.over{color:var(--bad)}
.tstate{font-size:.82rem;color:var(--muted);flex:1;min-width:8em}
.tctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tctl .btn{padding:5px 12px;font-size:.88rem}
.tctl select{font:inherit;font-size:.88rem;padding:5px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tab{flex:1;font:inherit;font-weight:500;padding:10px 8px;border:1px solid var(--rule);background:var(--sheet);color:var(--fg);border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.tab small{display:block;font-weight:400;font-size:.78rem;opacity:.85;font-variant-numeric:tabular-nums}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding-block:6px;padding-inline:18px}
.howto{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.q{padding-block:18px;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:0}
.stem{font-family:var(--f-en);font-size:1.06rem;line-height:1.6;margin:0 0 4px}
.num{font-family:var(--f-zh);font-weight:700;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.zh{font-size:.88rem;color:var(--muted);margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{font-family:var(--f-en);font-size:1rem;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--fg);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt b{font-family:var(--f-zh);margin-right:6px}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.93rem}
.fb.bad{background:var(--bad-soft);color:var(--fg);border-left:3px solid var(--bad)}
.fb.good{background:var(--ok-soft);color:var(--fg);border-left:3px solid var(--ok)}
.fb .tag{font-weight:700;display:block;margin-bottom:2px}
.fb.bad .tag{color:var(--bad)} .fb.good .tag{color:var(--ok)}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:2px 0}
.en{font-family:var(--f-en)}
.passage{font-family:var(--f-en);font-size:1.04rem;line-height:1.75;padding-block:16px;border-bottom:2px solid var(--rule)}
.passage h3{font-family:var(--f-zh);font-size:.95rem;color:var(--muted);margin:0 0 8px;font-weight:500}
.passage p{margin:0 0 .8em;text-indent:1.5em}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--ink);color:var(--ink);font-family:var(--f-zh);font-weight:700;font-size:.9rem;padding:0 4px;cursor:pointer;text-indent:0}
.blank.done{font-family:var(--f-en);font-size:1rem;color:var(--ok);border-color:var(--ok);font-weight:600}
details.tr{margin:4px 0 0;font-size:.92rem}
details.tr summary{cursor:pointer;color:var(--ink);font-weight:500}
details.tr p{text-indent:0;font-family:var(--f-zh);color:var(--muted);margin:.5em 0}
.summary{margin-top:16px;padding:16px 18px;background:var(--ink-soft);border-radius:10px}
.summary h2{font-size:1.05rem;margin:0 0 4px}
.summary p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.btn{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--sheet)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.gate{min-height:70vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gbox{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:22px;max-width:420px;width:100%}
.gbox h1{font-size:1.3rem;margin:0 0 4px}
.gbox p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.gbox label{font-weight:500;font-size:.9rem}
.grow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.grow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;letter-spacing:.05em;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--fg);text-transform:uppercase}
.grow input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.gmsg{min-height:1.4em;margin:10px 0 0!important}
.gmsg.err{color:var(--bad)!important}
.ubar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.ubar .btn{font-size:.85rem;padding:5px 12px;text-decoration:none}
.login{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin:6px 0 10px}
.login label{font-weight:500;font-size:.9rem}
.gbtn{display:inline-block;text-decoration:none;text-align:center;min-width:12em}
.small{font-size:.86rem}.muted{color:var(--muted)}
.lock{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:20px 18px}
.lock h2{margin:0 0 6px;font-size:1.15rem}
.lock>p{color:var(--muted);margin:0 0 12px}
.lock ul{margin:0 0 16px;padding-left:1.2em}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.plan{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.plan.best{border:2px solid var(--ink)}
.plan .pn{font-weight:700}
.plan .pp{font-size:1.2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.plan .pt{font-size:.82rem;color:var(--muted);flex:1}
.plan .btn{text-align:center;text-decoration:none;margin-top:6px}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
[hidden]{display:none!important}
.yearbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.yearbar label{font-weight:700}
.yearbar select{font:inherit;font-size:1rem;padding:7px 10px;border:1px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--fg);min-width:12em}
.yearbar select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tab{white-space:nowrap;padding-left:4px!important;padding-right:4px!important}
@media (max-width:420px){.tab{font-size:.92rem}}
.guide{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.guide summary{cursor:pointer;color:var(--ink);font-weight:700}
.gsec{margin-top:10px}
.gq{font-weight:700;margin:12px 0 2px}
.gl{font-size:.82rem;letter-spacing:.04em;color:var(--ink);font-weight:700;margin:8px 0 2px}
.guide ul{margin:0;padding-left:1.2em}
.guide li{margin:3px 0}
.guide ul.cols{columns:2;column-gap:20px}
@media (max-width:480px){.guide ul.cols{columns:1}}
.model{white-space:pre-wrap;font-family:var(--f-en);font-size:1.02rem;line-height:1.75;background:var(--bg);border-radius:8px;padding:12px 14px}
.wcard{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.wcard h2{font-size:1.08rem;margin:0 0 6px}
.wcard .note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.wq{margin:12px 0 4px;font-weight:500}
.wcard textarea{width:100%;min-height:4.5em;font-family:var(--f-en);font-size:1rem;line-height:1.6;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical;box-sizing:border-box}
.wcard textarea.essay{min-height:16em}
.wcard textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.wcard img{display:block;width:100%;border-radius:6px;margin:8px 0 4px;border:1px solid var(--rule)}
.wcount{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wcount.ok{color:var(--ok)}
.quota{background:var(--ink-soft);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:.92rem}
.quota b{font-variant-numeric:tabular-nums}
.confirm{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--ink-soft);font-size:.92rem}
.wmsg{min-height:1.4em;font-size:.9rem;margin:8px 0 0}
.wmsg.err{color:var(--bad)} .wmsg.good{color:var(--ok)}
.hist{border-top:1px solid var(--rule);padding-block:10px}
.hist:first-of-type{border-top:0}
.hist .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}
.pill{font-size:.78rem;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.wait{background:var(--ink-soft);color:var(--ink)} .pill.done{background:var(--ok-soft);color:var(--ok)}
.hist details{margin-top:6px;font-size:.92rem}
.hist summary{cursor:pointer;color:var(--ink);font-weight:500}
.fbtext{white-space:pre-wrap;margin:8px 0 0;line-height:1.7}
.ans{white-space:pre-wrap;font-family:var(--f-en);background:var(--bg);border-radius:6px;padding:8px 10px;margin:6px 0 0}
.savemsg{font-size:.88rem;margin:4px 0;padding:6px 10px;border-radius:8px;background:var(--ink-soft)}
.savemsg.err{background:var(--bad-soft);color:var(--bad)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.mbtn{font:inherit;font-weight:700;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--fg);cursor:pointer}
.mbtn small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.mbtn[aria-pressed="true"]{border:2px solid var(--ink);background:var(--ink-soft);color:var(--ink)}
.mbtn:focus-visible,.hbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap:not(.basic) .b-only{display:none}
.opt .gl{display:none;font-family:var(--f-zh);font-size:.82rem;color:var(--muted);margin-left:6px}
.basic .show-gl .opt .gl{display:inline}
.show-gl .opt.right .gl,.show-gl .opt.wrong .gl{display:inline}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hbtn{font:inherit;font-size:.85rem;padding:5px 10px;border-radius:999px;border:1px dashed var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.hbtn:disabled{opacity:.45;cursor:default}
.hintbox{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--ink-soft);font-size:.92rem}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 12px}
.bar .mode{font-size:.88rem;color:var(--muted)}
.bar .btn{font-size:.9rem;padding:6px 12px}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}
/* ===== 文意選填／篇章結構／閱讀測驗／混合題 ===== */
.tabrow{display:flex;gap:6px;overflow-x:auto;flex-basis:100%;padding-bottom:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabrow .tab{flex:0 0 auto;min-width:5.6em;padding:8px 10px!important}
.mp{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:6px 18px 14px}
.mp .passage p{text-indent:1.5em}
.mp .passage p.noind{text-indent:0}
.mb{display:inline-block;min-width:3.2em;text-align:center;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--f-zh);font-weight:700;font-size:.9rem;padding:0 6px;line-height:1.5;cursor:pointer;text-indent:0;border-radius:4px 4px 0 0}
.mb.cur{background:var(--ink-soft);outline:2px solid var(--ink);outline-offset:1px}
.mb.done{font-family:var(--f-en);font-size:1rem;color:var(--ok);border-color:var(--ok);font-weight:600;cursor:default}
.mb.long{display:inline;min-width:0;padding:0 8px}
.dock{position:sticky;bottom:0;z-index:4;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin-top:12px;box-shadow:0 -6px 18px rgba(0,0,0,.08);max-height:45vh;overflow:auto}
.dock.static{position:static;max-height:none;box-shadow:none}
.dock .now{font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dock .now .btn{padding:3px 10px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-family:var(--f-en);font-size:.98rem;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--fg);cursor:pointer;text-align:left}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip small{font-family:var(--f-zh);font-size:.78rem;color:var(--muted);margin-left:4px}
.chip .k{font-family:var(--f-zh);font-weight:700;color:var(--muted);margin-right:4px;font-size:.85rem}
.chip.used{opacity:.4;text-decoration:line-through}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip:disabled{cursor:default}
.chips.sent{flex-direction:column}
.chips.sent .chip{width:100%}
.chip .czh{display:none;font-family:var(--f-zh);font-size:.84rem;color:var(--muted);margin-top:2px}
.basic .chip .czh{display:block}
.wrap:not(.basic) .chip small{display:none}
.dlist{margin-top:14px}
.drow{border-top:1px solid var(--rule);padding:10px 0;font-size:.93rem}
.drow .h{font-weight:700;margin-bottom:2px}
.drow .tag{display:inline-block;font-size:.75rem;background:var(--ink-soft);color:var(--ink);border-radius:999px;padding:0 8px;margin-left:6px;font-weight:500}
.drow ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.qz{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.wrap:not(.basic) .qz,.wrap:not(.basic) .oz{display:none}
.oz{display:block;font-family:var(--f-zh);font-size:.82rem;color:var(--muted);font-weight:400}
.rimg{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:8px;margin:6px 0 10px;background:#fff}
.mx-s{font-family:var(--f-en);font-size:1.04rem;line-height:2.1;background:var(--bg);border-radius:8px;padding:10px 14px;margin:8px 0}
.mx-in{font:inherit;font-family:var(--f-en);width:8.5em;padding:2px 8px;border:0;border-bottom:2px solid var(--ink);background:var(--sheet);color:var(--fg);border-radius:4px 4px 0 0}
.mx-in.ok{border-color:var(--ok);color:var(--ok);font-weight:600;background:var(--ok-soft)}
.mx-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.mx-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
@media (max-width:480px){.mx-checks{grid-template-columns:1fr}}
.mx-checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--f-en)}
.mx-checks label.ok{background:var(--ok-soft);border-color:var(--ok)}
.mx-checks label.bad{background:var(--bad-soft);border-color:var(--bad)}
.mx-ta{font:inherit;font-family:var(--f-en);width:100%;min-height:3.2em;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--fg)}
.pts{font-size:.8rem;color:var(--muted);font-weight:400;margin-left:6px}
.notyet{background:var(--sheet);border:1px dashed var(--rule);border-radius:10px;padding:22px 18px;color:var(--muted)}
.notyet b{color:var(--fg)}
</style>

<div class="wrap" id="main">
  <div class="ubar">
    <span id="ustate">免費試用中：詞彙題可以直接做，綜合測驗需要訂閱。</span>
    <span class="row" id="uact"><button class="btn primary" id="openlogin">已訂閱？登入</button></span>
  </div>
  <form class="login" id="gform" hidden>
    <div id="gwrap"><a class="btn primary gbtn" id="googleLogin" target="_top">用 Google 登入</a><p class="small muted" style="margin:6px 0 12px">請選擇付款時填寫的 Gmail 帳號。<br><b>手機或瀏覽器登入了好幾個 Google 帳號？</b>按了登入如果出現「很抱歉，目前無法開啟這個檔案」，請改用<b>無痕視窗</b>打開 winglish.tw 再登入，就可以了。</p></div>
    <label for="gcode">或輸入訂閱者代碼（開通信裡的那組代碼）</label>
    <div class="grow"><input id="gcode" autocomplete="off" autocapitalize="characters" placeholder="例如 G7K2QX" required><button class="btn primary" id="gbtn" type="submit">解鎖</button><button class="btn" id="gcancel" type="button">取消</button></div>
    <p class="gmsg" id="gmsg" role="status"></p>
  </form>
  <p class="savemsg" id="savemsg" role="status" hidden></p>
  <a class="homelink" href="https://winglish-tw.github.io/" target="_top">‹ 回到 Winglish 首頁</a>
  <header>
    <h1>學測英文｜歷屆試題練習</h1>

function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function tick(){const now=Date.now();for(const k in T){const t=T[k];if(t.run){t.el+=(now-t.last)/1000;t.last=now}}drawTimer()}
function tStart(sec){const t=T[sec];if(t.run||t.fin)return;t.run=true;t.last=Date.now();drawTimer()}
function tPause(sec){const t=T[sec];if(!t.run)return;tick();t.run=false;drawTimer()}
function tReset(sec){T[sec]={el:0,run:false,last:0,fin:false};drawTimer()}
function drawTimer(){
  const t=T[active],c=document.getElementById("clock"),st=document.getElementById("tstate"),b=document.getElementById("tbtn");
  c.classList.remove("warn","over");
  if(LIMIT>0){
    const left=LIMIT-t.el;
    if(left>=0){c.textContent=fmt(Math.ceil(left));if(left<=60)c.classList.add("warn")}
    else{c.textContent="+"+fmt(-left);c.classList.add("over")}
  }else c.textContent=fmt(t.el);
  if(t.fin) st.textContent="已完成，用時 "+fmt(t.el)+(LIMIT>0&&t.el>LIMIT?"（超時 "+fmt(t.el-LIMIT)+"）":"");
  else if(t.run) st.textContent=(LIMIT>0&&t.el>LIMIT)?"時間到！還沒做完的題目可以繼續作答":"計時中";
  else st.textContent=t.el>0?"已暫停":"作答第一題時自動開始";

}

const DATA114={"vocab": [{"n": 1, "s": "If you put a ______ under a leaking faucet, you will be surprised at the amount of water collected in 24 hours.", "zh": "如果你在漏水的水龍頭下面放一個＿＿，你會驚訝 24 小時能接到多少水。", "o": ["border", "timer", "container", "marker"], "a": 2, "w": {"0": "border 是「邊界、邊緣」，放在水龍頭下面接不了水。", "1": "timer 是「計時器」，雖然句子提到 24 小時，但計時器不能接水。", "3": "marker 是「麥克筆、標記」，不能用來裝水。"}, "k": "關鍵：put a ___ under a leaking faucet，後面又說 water collected（收集到的水）→ 要放一個「容器」：container。", "v": "container 容器｜leak 漏水｜faucet 水龍頭｜collect 收集"}, {"n": 2, "s": "The local farmers’ market is popular as it offers a variety of fresh seasonal ______ to people in the community.", "zh": "當地的農夫市集很受歡迎，因為它提供社區民眾各式各樣新鮮的當季＿＿。", "o": ["produce", "fashion", "brand", "trend"], "a": 0, "w": {"1": "fashion 是「時尚」，農夫市集不賣「新鮮的當季時尚」。", "2": "brand 是「品牌」，品牌不會是新鮮的。", "3": "trend 是「趨勢」，趨勢不能吃，也不會是當季的新鮮東西。"}, "k": "關鍵：farmers’ market（農夫市集）＋ fresh seasonal（新鮮、當季的）→ 農產品。produce 當名詞時是「農產品」，重音在第一個音節。", "v": "produce（名詞）農產品｜seasonal 當季的｜a variety of 各式各樣的｜community 社區"}, {"n": 3, "s": "As the years have passed by, many of my childhood memories are already ______; I can no longer recall clearly what happened back then.", "zh": "隨著時間過去，很多童年回憶已經＿＿了；我再也想不清楚當時發生了什麼事。", "o": ["blurring", "trimming", "draining", "glaring"], "a": 0, "w": {"1": "trimming 是「修剪」（頭髮、樹枝），回憶不會被修剪。", "2": "draining 是「排水、耗盡」，回憶不是液體。", "3": "glaring 是「刺眼的、怒視」，跟「想不清楚」相反。"}, "k": "關鍵：分號後面說「再也想不清楚」→ 回憶變「模糊」：blur。", "v": "blur 變模糊｜childhood 童年｜recall 回想起"}, {"n": 4, "s": "Racist remarks are by nature ______ and hurtful, and should be avoided on all occasions.", "zh": "種族歧視的言論本質上就是＿＿又傷人的，在任何場合都應該避免。", "o": ["excessive", "furious", "offensive", "stubborn"], "a": 2, "w": {"0": "excessive 是「過度的」，「本質上就是過度的」意思不完整。", "1": "furious 是「狂怒的」，形容人的情緒，言論本身不會生氣。", "3": "stubborn 是「固執的」，用來形容人。"}, "k": "關鍵：空格和 hurtful（傷人的）用 and 連接，意思要相近 → offensive（冒犯人的）。", "v": "offensive 冒犯人的｜racist 種族歧視的｜remark 言論｜by nature 本質上｜occasion 場合"}, {"n": 5, "s": "Not satisfied with the first ______ of her essay, Mary revised it several times before turning it in to the teacher.", "zh": "Mary 對作文的第一份＿＿不滿意，交給老師之前修改了好幾次。", "o": ["text", "brush", "draft", "plot"], "a": 2, "w": {"0": "text 是「文字、課文」，不會說作文的「第一份文字」。", "1": "brush 是「刷子、畫筆」。", "3": "plot 是「（故事的）情節」，作文不一定有情節，而且後面修改的是整份稿子。"}, "k": "關鍵：first draft ＝ 初稿。後面說 revised it several times（修改好幾次）→ 草稿：draft。", "v": "draft 草稿｜revise 修改｜turn in 繳交"}, {"n": 6, "s": "Left ______ for years, the deserted house was filled with a thick coating of dust and a smell of old damp wood.", "zh": "這棟廢棄的房子＿＿了好幾年，積滿厚厚的灰塵，還有老舊潮濕木頭的味道。", "o": ["casual", "fragile", "remote", "vacant"], "a": 3, "w": {"0": "casual 是「隨意的、休閒的」，用來形容態度或穿著。", "1": "fragile 是「易碎的」，房子不會因為放著不管而變得易碎。", "2": "remote 是「偏遠的」，房子的位置不會因為沒人住而改變。"}, "k": "關鍵：deserted（廢棄的）、滿是灰塵 → 房子一直「空著」：left vacant。", "v": "vacant 空著的｜deserted 廢棄的｜coating 一層｜damp 潮濕的"}, {"n": 7, "s": "The high school student showed ______ courage when she helped the old man escape from the fire.", "zh": "這位高中生幫助老先生逃離火場時，展現了＿＿的勇氣。", "o": ["gigantic", "exclusive", "multiple", "enormous"], "a": 3, "w": {"0": "gigantic 也是「巨大的」，但多半形容看得到的體積，例如 a gigantic building，不用來形容勇氣。", "1": "exclusive 是「獨家的、專屬的」。", "2": "multiple 是「多個的」，後面接複數名詞，courage 是不可數名詞。"}, "k": "關鍵：enormous courage ＝ 極大的勇氣。enormous 可以形容抽象的程度，gigantic 多半只形容具體的大小。", "v": "enormous 極大的｜courage 勇氣｜escape 逃離"}, {"n": 8, "s": "Publicly financed projects are often ______ or delayed during tough economic times due to a lack of resources.", "zh": "經濟不景氣時，公共出資的計畫常常因為缺乏資源而被＿＿或延後。", "o": ["halted", "hatched", "possessed", "reinforced"], "a": 0, "w": {"1": "hatched 是「孵化」，也可以指「策劃」，但缺乏資源不會讓計畫被策劃出來。", "2": "possessed 是「擁有、被附身」。", "3": "reinforced 是「強化」，缺乏資源時反而沒辦法強化。"}, "k": "關鍵：和 delayed（延後）並列，原因是 lack of resources（缺乏資源）→ 計畫被「中止」：halt。", "v": "halt 中止｜finance 出資｜tough 艱困的｜resource 資源"}, {"n": 9, "s": "Despite his busy schedule, the President ______ the school’s graduation ceremony with his presence and a heartwarming speech.", "zh": "儘管行程忙碌，總統還是＿＿了學校的畢業典禮，並發表溫暖人心的演講。", "o": ["praised", "graced", "addressed", "credited"], "a": 1, "w": {"0": "praised 是「稱讚」，「用他的出席來稱讚典禮」不通。", "2": "addressed 是「對……演說、處理」，可以說 address the ceremony（在典禮上致詞），但不會接 with his presence（用他的出席）。", "3": "credited 是「歸功於」。"}, "k": "關鍵：grace an event with one’s presence ＝ 某人蒞臨，讓活動增光，是固定用法。", "v": "grace 使增光；蒞臨｜presence 出席｜heartwarming 溫暖人心的"}, {"n": 10, "s": "The manager of the company was sued for ______ abusing his colleagues, calling them “hopeless losers.”", "zh": "這家公司的經理＿＿霸凌同事，罵他們是「無可救藥的魯蛇」，因此被告。", "o": ["verbally", "dominantly", "legitimately", "relevantly"], "a": 0, "w": {"1": "dominantly 是「佔優勢地」，不是形容霸凌的方式。", "2": "legitimately 是「合法地」，霸凌不會是合法的。", "3": "relevantly 是「相關地」。"}, "k": "關鍵：calling them “hopeless losers”（用話罵人）→ 言語上的霸凌：verbally abuse。", "v": "verbally 言語上｜abuse 虐待；霸凌｜sue 控告｜colleague 同事"}], "gl": {"1": ["邊界", "計時器", "容器", "麥克筆；標記"], "2": ["農產品", "時尚", "品牌", "趨勢"], "3": ["變模糊", "修剪", "排乾；耗盡", "刺眼；怒視"], "4": ["過度的", "狂怒的", "冒犯人的", "固執的"], "5": ["文字；課文", "刷子", "草稿", "情節"], "6": ["隨意的", "易碎的", "偏遠的", "空著的"], "7": ["巨大的（體積）", "獨家的", "多個的", "極大的"], "8": ["中止", "孵化", "擁有", "強化"], "9": ["稱讚", "蒞臨；使增光", "演講；處理", "歸功於"], "10": ["言語上", "佔優勢地", "合法地", "相關地"]}, "hint": {"1": "放在漏水的水龍頭下面，又能「收集」水，會是什麼東西？", "2": "農夫市集賣的「新鮮、當季」的東西是什麼？注意 produce 當名詞的意思。", "3": "分號後面說「再也想不清楚」，表示回憶變得怎麼樣？", "4": "空格和 hurtful（傷人的）用 and 連接，兩個字意思要相近。", "5": "第一次寫好、之後還要改好幾次的東西叫什麼？", "6": "房子被「放著」好幾年沒人住，滿是灰塵，它是什麼狀態？", "7": "gigantic 和 enormous 都有「很大」的意思，哪一個可以形容「勇氣」這種看不見的東西？", "8": "沒錢的時候，計畫會被「延後」或怎麼樣？", "9": "看後面的 with his presence（他的出席），哪個動詞常跟這個片語一起用？", "10": "後面說他罵同事 hopeless losers，是用什麼方式霸凌？"}, "tag": {"1": "名詞", "2": "名詞", "3": "動詞", "4": "形容詞", "5": "名詞", "6": "形容詞", "7": "形容詞", "8": "動詞", "9": "動詞", "10": "副詞", "11": "時態", "12": "動詞", "13": "動詞", "14": "片語", "15": "轉折語", "16": "動詞", "17": "上下文邏輯", "18": "文法", "19": "片語", "20": "轉折語"}};
const DATA113={"vocab": [{"n": 1, "o": ["spicy", "slender", "slight", "slippery"], "a": 1, "zh": "想要擁有＿＿身材的人，應該規律運動並保持健康的飲食習慣。", "w": {"0": "spicy 是「辣的」，用來形容食物。", "2": "slight 最常見的意思是「輕微的、少量的」，例如 a slight cold；形容身材時偏向「瘦小、單薄」，不是一般人想要的身材。desire a slender figure 才是常見說法。", "3": "slippery 是「滑的」，例如 a slippery floor。"}, "k": "關鍵：規律運動、健康飲食 → 想要「苗條」的身材：a slender figure。", "v": "slender 苗條的｜figure 身材｜maintain 維持", "s": "People who desire a ______ figure should exercise regularly and maintain healthy eating habits."}, {"n": 2, "o": ["emerging", "flashing", "rushing", "floating"], "a": 0, "zh": "看太陽從雲海中＿＿，是所有到阿里山的遊客必做的事。", "w": {"1": "flashing 是「閃爍」，太陽不會一閃一閃的。", "2": "rushing 是「衝、急忙」，日出是慢慢升起的。", "3": "floating 是「漂浮」，太陽不是漂在雲海上。"}, "k": "關鍵：emerge from ＝ 從……出現、浮現。日出時，太陽從雲海中「冒出來」。", "v": "emerge 出現；浮現｜a sea of clouds 雲海｜must-do 必做的", "s": "Watching the sun ______ from a sea of clouds is a must-do activity for all visitors to Ali Mountain."}, {"n": 3, "o": ["apt", "due", "bound", "docked"], "a": 1, "zh": "你知道下一班公車＿＿幾點到嗎？我已經在這裡等了超過 30 分鐘。", "w": {"0": "apt 是「有……傾向的」，要接 to + 原形動詞，例如 be apt to forget。", "2": "bound 可以表示「開往」，但要說 bound for + 地點，例如 bound for Taipei，不接時間。", "3": "docked 是「（船）靠岸的」，用在船，不用在公車。"}, "k": "關鍵：be due ＝ 預定（到達）。What time is the bus due? ＝ 公車預定幾點到？", "v": "due 預定的；到期的｜apt 有……傾向的｜bound for 開往", "s": "Do you know what time the next bus is ______? I’ve been waiting here for more than 30 minutes."}, {"n": 4, "o": ["density", "humidity", "circulation", "atmosphere"], "a": 1, "zh": "炙熱的高溫加上很高的＿＿，讓我覺得又熱又黏，不管做什麼都涼不下來。", "w": {"0": "density 是「密度」，高密度不會讓人覺得黏。", "2": "circulation 是「循環、流通」，空氣流通好反而比較涼快。", "3": "atmosphere 是「大氣、氣氛」，不會說 high atmosphere。"}, "k": "關鍵：hot and sticky（又熱又黏）→ 空氣很潮濕：high humidity（高濕度）。", "v": "humidity 濕度｜roasting 炙熱的｜sticky 黏的｜cool off 涼快下來", "s": "The roasting heat and high ______ made me feel hot and sticky, no matter what I did to cool off."}, {"n": 5, "o": ["stay", "take", "serve", "stand"], "a": 3, "zh": "像畢卡索和莫內這樣真正偉大的藝術家，他們的作品無疑能＿＿時間的考驗。", "w": {"0": "stay 是「停留、保持」，stay the test 不是英文說法。", "1": "take the test 是「參加考試」，不是「經得起考驗」。", "2": "serve 是「服務、供應」，不接 the test of time。"}, "k": "關鍵：stand the test of time ＝ 經得起時間的考驗，是固定說法。", "v": "stand the test of time 經得起時間考驗｜no doubt 無疑地｜artwork 藝術作品", "s": "Artwork created by truly great artists such as Picasso and Monet will no doubt ______ the test of time."}, {"n": 6, "o": ["forceful", "realistic", "compulsory", "distinctive"], "a": 2, "zh": "在一些國家，服兵役只對男性是＿＿的；女性不必當兵。", "w": {"0": "forceful 是「強而有力的」，用來形容人或說法，例如 a forceful speech。", "1": "realistic 是「實際的、寫實的」。", "3": "distinctive 是「獨特的」。"}, "k": "關鍵：分號後面說女性「不必」當兵 → 對男性是「強制的、義務的」：compulsory。", "v": "compulsory 強制的；義務的｜military service 兵役｜serve in the military 服兵役", "s": "In some countries, military service is ______ for men only; women do not have to serve in the military."}, {"n": 7, "o": ["advantage", "revenge", "remedy", "credit"], "a": 3, "zh": "團隊成員抱怨，隊長總是把大家辛苦工作的＿＿攬在自己身上。", "w": {"0": "take advantage of 是「利用」，後面要接 of，不接 for。", "1": "take revenge for 是「為……報仇」，意思不合理。", "2": "remedy 是「補救、療法」，不和 take ... for 搭配。"}, "k": "關鍵：take (the) credit for ＝ 把……的功勞攬在自己身上。", "v": "credit 功勞｜complain 抱怨", "s": "The team complained that its leader always took the ______ for all the hard work done by the team members."}, {"n": 8, "o": ["proposes", "contains", "promises", "confirms"], "a": 2, "zh": "這間商務飯店位在市中心，＿＿不只有好的服務，還有方便的大眾運輸。", "w": {"0": "proposes 是「提議」，飯店不會「提議」好服務。", "1": "contains 是「包含」，通常指容器裡裝著東西，不用來說飯店提供服務或交通便利。", "3": "confirms 是「確認」，意思不通。"}, "k": "關鍵：promise 在這裡是「保證有、可望提供」：飯店「保證」有好服務，交通也方便。", "v": "promise 保證；可望｜convenient 方便的｜public transport 大眾運輸", "s": "Located at the center of the city, the business hotel ______ not only good service but also convenient public transport."}, {"n": 9, "o": ["appeal", "approach", "operation", "observation"], "a": 0, "zh": "因為血庫存量降到非常低的程度，很多醫院正在＿＿民眾捐血。", "w": {"1": "approach 是「方法、接近」，make an approach 不是「呼籲」的意思。", "2": "operation 是「手術、運作」。", "3": "observation 是「觀察」。"}, "k": "關鍵：make an appeal for sb to do sth ＝ 呼籲某人做某事。", "v": "appeal 呼籲｜critically 危急地｜donate 捐贈", "s": "As blood supplies have fallen to a critically low level, many hospitals are making an ______ for the public to donate blood."}, {"n": 10, "o": ["eligibly", "randomly", "apparently", "consequently"], "a": 1, "zh": "David 發現自己不能選讀書夥伴，而是會被＿＿分到一個讀書小組，覺得很失望。", "w": {"0": "eligibly 是「有資格地」，不是分組的方式。", "2": "apparently 是「顯然地」，放在這裡意思不通。", "3": "consequently 是「因此」，是連接前後句的副詞，不用來形容「被分組」的方式。"}, "k": "關鍵：不能自己選夥伴 → 被「隨機」分組：randomly。", "v": "randomly 隨機地｜disappointed 失望的｜be placed in 被分到", "s": "David felt disappointed when he found out that he could not choose his study partners, but would be ______ placed in a study group."}], "gl": {"1": ["辣的", "苗條的", "輕微的；瘦小的", "滑的"], "2": ["浮現", "閃爍", "衝", "漂浮"], "3": ["有……傾向的", "預定到達的", "開往（接 for）", "（船）靠岸的"], "4": ["密度", "濕度", "循環", "大氣；氣氛"], "5": ["停留", "參加（考試）", "服務", "經得起"], "6": ["強而有力的", "實際的", "強制的", "獨特的"], "7": ["優勢", "報復", "補救；療法", "功勞"], "8": ["提議", "包含", "保證（有）", "確認"], "9": ["呼籲", "方法；接近", "手術；運作", "觀察"], "10": ["有資格地", "隨機地", "顯然地", "因此"]}, "hint": {"1": "規律運動、健康飲食，是為了擁有什麼樣的身材？", "2": "日出時，太陽從雲海裡慢慢「冒出來」，哪個字有這個意思？", "3": "問的是公車「預定」幾點到，哪個字接在 be 動詞後面可以表示「預定」？", "4": "覺得「黏黏的」通常是因為空氣怎麼樣？", "5": "「經得起時間的考驗」是固定說法：___ the test of time。", "6": "女性「不必」當兵，那對男性來說是怎樣的？", "7": "大家抱怨的是，隊長總是拿走大家努力的什麼？", "8": "飯店位置好，可以「保證」給客人什麼？", "9": "血不夠了，醫院會對民眾做什麼，請大家來捐血？", "10": "不能自己選夥伴，那是怎麼被分組的？"}, "tag": {"1": "形容詞", "2": "動詞", "3": "形容詞", "4": "名詞", "5": "片語", "6": "形容詞", "7": "片語", "8": "動詞", "9": "名詞", "10": "副詞", "11": "片語", "12": "文法", "13": "上下文邏輯", "14": "形容詞", "15": "名詞", "16": "時態", "17": "片語", "18": "上下文邏輯", "19": "動詞", "20": "動詞"}};
const DATA112={"vocab": [{"n": 1, "o": ["sticky", "greasy", "clumsy", "mighty"], "a": 0, "zh": "公車司機常抱怨乘客座位底下的口香糖，因為它＿＿又很難清掉。", "w": {"1": "greasy 是「油膩的」，口香糖的問題是黏，不是油。", "2": "clumsy 是「笨手笨腳的」，用來形容人。", "3": "mighty 是「強大的」，不會用來形容口香糖。"}, "k": "關鍵：口香糖「很難清掉」的原因 → 黏黏的：sticky。", "v": "sticky 黏的｜chewing gum 口香糖｜remove 去除", "s": "The bus driver often complains about chewing gum found under passenger seats because it is ______ and very hard to remove."}, {"n": 2, "o": ["clap", "toss", "pose", "snap"], "a": 2, "zh": "Jesse 是很有天分的模特兒，拍照時可以輕鬆擺出優雅的＿＿。", "w": {"0": "clap 是「拍手」，不會說「擺出優雅的拍手」。", "1": "toss 是「拋、扔」。", "3": "snap 是「快照、啪一聲」，是拍照的人做的事，不是模特兒擺出來的。"}, "k": "關鍵：模特兒拍照時擺出的「姿勢」：adopt a pose（擺出姿勢）。", "v": "pose 姿勢｜adopt 採取；擺出｜elegant 優雅的｜shoot 拍攝", "s": "Jesse is a talented model. He can easily adopt an elegant ______ for a camera shoot."}, {"n": 3, "o": ["siblings", "commuters", "ancestors", "instructors"], "a": 2, "zh": "為了畫家譜，Mary 試著追溯她的＿＿，一直追到他們剛抵達北美的時候。", "w": {"0": "siblings 是「兄弟姊妹」，不需要追溯到很久以前。", "1": "commuters 是「通勤者」，跟家譜無關。", "3": "instructors 是「教練、講師」，跟家譜無關。"}, "k": "關鍵：family tree（家譜）＋ trace back（追溯）→ 祖先：ancestors。", "v": "ancestor 祖先｜family tree 家譜｜trace 追溯", "s": "In order to draw her family tree, Mary tried to trace her ______ back to their arrival in North America."}, {"n": 4, "o": ["blank", "bare", "hollow", "queer"], "a": 1, "zh": "一聽到超級颱風警報，Nancy 就衝去超市，結果卻發現貨架幾乎＿＿，存貨也快沒了。", "w": {"0": "blank 是「空白的」，通常形容紙張、表情或螢幕，例如 a blank page，不用來形容貨架被買光。", "2": "hollow 是「中空的」，例如 a hollow tree，指東西裡面是空心的。", "3": "queer 是「奇怪的」，是比較舊的用法。"}, "k": "關鍵：shelves almost bare ＝ 貨架幾乎被搬空。bare 形容「光禿禿、空蕩蕩」，後面 stock nearly gone 也是線索。", "v": "bare 光禿的；空的｜stock 存貨｜only to 結果卻", "s": "Upon the super typhoon warning, Nancy rushed to the supermarket—only to find the shelves almost ______ and the stock nearly gone."}, {"n": 5, "o": ["liability", "generosity", "integrity", "sincerity"], "a": 3, "zh": "雖然 Jack 當面跟我說了對不起，我卻感受不到他的道歉有任何＿＿。", "w": {"0": "liability 是「責任、負債」，不會「感受到」道歉裡的負債。", "1": "generosity 是「慷慨」，道歉不需要慷慨。", "2": "integrity 是「正直」，形容人的品格，不是形容一句道歉。"}, "k": "關鍵：Even though（雖然）表示前後相反：說了對不起，卻感受不到「誠意」：sincerity。", "v": "sincerity 誠意｜apology 道歉｜in person 親自", "s": "Even though Jack said “Sorry!” to me in person, I did not feel any ______ in his apology."}, {"n": 6, "o": ["resolve", "fraction", "privilege", "recall"], "a": 3, "zh": "我爺爺的＿＿力驚人，他到現在還能生動地描述小時候第一天上學的情形。", "w": {"0": "resolve 當名詞是「決心」，跟描述童年回憶無關。", "1": "fraction 是「部分、分數」。", "2": "privilege 是「特權」。"}, "k": "關鍵：還能清楚描述小時候的事 → 記憶力很好。powers of recall ＝ 記憶力（recall 當名詞是「回想、記憶」）。", "v": "recall 記憶；回想｜astonishing 驚人的｜vividly 生動地", "s": "My grandfather has astonishing powers of ______. He can still vividly describe his first day at school as a child."}, {"n": 7, "o": ["provoke", "counter", "expose", "convert"], "a": 1, "zh": "最近的研究找到很多證據，可以＿＿這家藥廠宣稱的「神奇」抗癌藥丸。", "w": {"0": "provoke 是「激起、挑釁」，證據不會激起藥廠的說法。", "2": "expose 是「揭露」，通常揭露的是秘密或醜聞，例如 expose the lie；「揭露宣稱」語意不完整。", "3": "convert 是「轉換、使改變信仰」。"}, "k": "關鍵：「神奇」加了引號，表示作者不相信 → 證據是用來「反駁」這些說法：counter（反駁、對抗）。", "v": "counter 反駁｜evidence 證據｜claim 宣稱｜tablet 藥片", "s": "Recent research has found lots of evidence to ______ the drug company’s claims about its “miracle” tablets for curing cancer."}, {"n": 8, "o": ["crippled", "accelerated", "rendered", "ventured"], "a": 0, "zh": "貪污的官員和錯誤的政策＿＿了國家的經濟，也讓人民背負龐大的外債。", "w": {"1": "accelerated 是「加速」，貪污和錯誤政策不會加速經濟發展。", "2": "rendered 是「使成為」，要接受詞加補語，例如 render it useless，這裡少了補語。", "3": "ventured 是「冒險」。"}, "k": "關鍵：貪污、錯誤政策、龐大外債，都是負面的 → 經濟被「重創」：cripple（使癱瘓、重創）。", "v": "cripple 重創；使癱瘓｜corrupt 貪污的｜misguided 錯誤的｜burden 使負擔", "s": "Corrupt officials and misguided policies have ______ the country’s economy and burdened its people with enormous foreign debts."}, {"n": 9, "o": ["choked", "disturbed", "enclosed", "injected"], "a": 0, "zh": "因為來看棒球冠軍賽的球迷人數創新高，球場周圍的公路一整天都被車潮＿＿。", "w": {"1": "disturbed 是「打擾」，通常用在人，公路不會被打擾。", "2": "enclosed 是「圍起來」，車潮不會把公路圍起來。", "3": "injected 是「注射」。"}, "k": "關鍵：be choked with traffic ＝ 被車潮塞滿、塞得動彈不得。", "v": "choke 塞滿；使窒息｜record 創紀錄的｜stadium 體育場", "s": "As a record number of fans showed up for the baseball final, the highways around the stadium were ______ with traffic all day."}, {"n": 10, "o": ["undoubtedly", "roughly", "understandably", "supposedly"], "a": 3, "zh": "研究顯示，＿＿公正的媒體，其實常常深受政治意識形態影響。", "w": {"0": "undoubtedly 是「無疑地」，但後面說它們「其實」受影響，前後矛盾。", "1": "roughly 是「大約」，不能形容「公正」。", "2": "understandably 是「可以理解地」，意思不通。"}, "k": "關鍵：in fact（事實上）表示和前面的說法相反 →「照理說、據說」公正：supposedly。", "v": "supposedly 照理說；據說｜unbiased 公正的｜ideology 意識形態", "s": "Studies show that the ______ unbiased media are in fact often deeply influenced by political ideology."}], "gl": {"1": ["黏的", "油膩的", "笨拙的", "強大的"], "2": ["拍手", "拋", "姿勢", "快照"], "3": ["兄弟姊妹", "通勤者", "祖先", "講師"], "4": ["空白的", "空蕩蕩的", "中空的", "奇怪的"], "5": ["責任；負債", "慷慨", "正直", "誠意"], "6": ["決心", "部分", "特權", "記憶；回想"], "7": ["激起", "反駁", "揭露", "轉換"], "8": ["重創", "加速", "使成為", "冒險"], "9": ["塞滿", "打擾", "圍起來", "注射"], "10": ["無疑地", "大約", "可以理解地", "照理說"]}, "hint": {"1": "口香糖「很難清掉」，是因為它怎麼樣？", "2": "模特兒拍照時要擺出什麼？", "3": "畫家譜要一路「往回追」，追的是誰？", "4": "颱風前大家搶購，貨架變得怎麼樣？", "5": "Even though 表示前後相反：說了對不起，卻感受不到什麼？", "6": "能清楚描述小時候的事，表示他哪一種能力很好？", "7": "「神奇」加了引號，表示作者相信嗎？證據是要支持還是反駁？", "8": "貪污、錯誤政策、龐大外債，對經濟是好是壞？", "9": "球迷人數創新高，公路被車潮怎麼了？", "10": "後面說 in fact（事實上）受到影響，所以前面的「公正」只是怎樣的說法？"}, "tag": {"1": "形容詞", "2": "名詞", "3": "名詞", "4": "形容詞", "5": "名詞", "6": "名詞", "7": "動詞", "8": "動詞", "9": "動詞", "10": "副詞", "11": "上下文邏輯", "12": "形容詞", "13": "片語", "14": "片語", "15": "轉折語", "16": "片語", "17": "形容詞", "18": "文法", "19": "形容詞", "20": "片語"}};
const DATA111={"vocab": [{"n": 1, "o": ["advanced", "delivered", "offered", "stretched"], "a": 1, "zh": "Jeffery 不想煮飯的時候，常常上網訂披薩，請人＿＿到家裡。", "w": {"0": "advanced 是「前進、提前」，不會把披薩 advance 到家裡。", "2": "offered 是「提供」，offer 後面通常接人，例如 offer sb sth，不會說 offer it to his house。", "3": "stretched 是「伸展、拉長」。"}, "k": "關鍵：訂披薩 → 外送到家：have it delivered（請人把它送來）。have + 物 + 過去分詞 ＝ 請人做某事。", "v": "deliver 遞送｜order 訂購｜feel like 想要", "s": "When Jeffery doesn’t feel like cooking, he often orders pizza online and has it ______ to his house."}, {"n": 2, "o": ["assistant", "influence", "contribution", "politician"], "a": 0, "zh": "Jane 是我遇過最好的＿＿，沒有她幫忙，我無法想像辦公室要怎麼運作。", "w": {"1": "influence 是「影響」，不是一個人。", "2": "contribution 是「貢獻」，也不是一個人。", "3": "politician 是「政治人物」，跟幫忙管理辦公室無關。"}, "k": "關鍵：空格要填一個「人」，又是幫忙處理辦公室事務的 → 助理：assistant。", "v": "assistant 助理｜run an office 經營辦公室｜imagine 想像", "s": "Jane is the best ______ I have ever had. I cannot imagine running my office without her help."}, {"n": 3, "o": ["chat", "quiz", "puppet", "variety"], "a": 2, "zh": "這間廟舉辦十天的舞獅、歌仔戲和傳統＿＿戲表演，來慶祝媽祖節。", "w": {"0": "chat 是「聊天」，chat show 是談話節目，不是傳統表演。", "1": "quiz 是「小考、問答」，quiz show 是益智節目。", "3": "variety 是「多樣」，variety show 是綜藝節目，不是傳統表演。"}, "k": "關鍵：hand puppet show ＝ 布袋戲。和舞獅、歌仔戲並列，都是廟會的傳統表演。", "v": "puppet 木偶；布偶｜host 舉辦｜opera 戲劇", "s": "The temple celebrated Mazu Festival by hosting ten days of lion dances, Taiwanese operas, and traditional hand ______ shows."}, {"n": 4, "o": ["potentially", "delicately", "ambiguously", "optionally"], "a": 0, "zh": "這種新疫苗因為＿＿致命的副作用，被食品藥物管理局禁止使用。", "w": {"1": "delicately 是「細緻地、巧妙地」，不能形容副作用。", "2": "ambiguously 是「模稜兩可地」。", "3": "optionally 是「可選擇地」，副作用不是可以選的。"}, "k": "關鍵：potentially fatal ＝ 可能致命的。副作用有致命的「可能」，所以被禁。", "v": "potentially 可能地｜fatal 致命的｜side effect 副作用｜ban 禁止", "s": "The new vaccine was banned by the Food and Drug Administration due to its ______ fatal side effects."}, {"n": 5, "o": ["Tagging", "Flocking", "Rolling", "Snapping"], "a": 0, "zh": "＿＿照片標上日期和關鍵字，能幫你在檔案裡輕鬆整理它們。", "w": {"1": "flock 是「成群聚集」，是不及物動詞，不接 the photos。", "2": "roll 是「滾動」，不會說 roll the photos with dates。", "3": "snap 是「拍照、折斷」，拍照片不會「拍上日期」。"}, "k": "關鍵：tag A with B ＝ 給 A 標上 B。幫照片「加上標籤」：tagging。動名詞片語當主詞，後面的動詞用 help。", "v": "tag 加標籤｜keyword 關鍵字｜sort 分類；整理", "s": "______ the photos with dates and keywords help you sort them easily in your file."}, {"n": 6, "o": ["enormous", "intimate", "agreeable", "ultimate"], "a": 2, "zh": "＿＿的人通常很好相處，但別期待他什麼事都會說「好」。", "w": {"0": "enormous 是「巨大的」，不能形容人的個性。", "1": "intimate 是「親密的」，形容關係，例如 an intimate friend，不是個性。", "3": "ultimate 是「最終的、極致的」。"}, "k": "關鍵：pleasant and easy to get along with（好相處）→ 隨和的：agreeable。後面 always say yes 也和 agree 有關。", "v": "agreeable 隨和的；令人愉快的｜get along with 和……相處", "s": "An ______ person is usually pleasant and easy to get along with, but don’t expect that he or she will always say “yes” to everything."}, {"n": 7, "o": ["identical", "visible", "available", "remarkable"], "a": 1, "zh": "這家米其林星級餐廳的入口藏在小巷深處、夾在一堆小店之間，路人幾乎＿＿。", "w": {"0": "identical 是「完全相同的」，要說 identical to sth，意思不對。", "2": "available 是「可取得的、有空的」，入口不是被取得的東西。", "3": "remarkable 是「了不起的」，跟 hidden 意思相反。"}, "k": "關鍵：Hidden deep（藏得很深）→ 路人幾乎「看不到」：barely visible。", "v": "visible 看得見的｜barely 幾乎不｜alley 小巷｜passerby 路人", "s": "Hidden deep in a small alley among various tiny shops, the entrance of the Michelin star restaurant is barely ______ to passersby."}, {"n": 8, "o": ["moderate", "absolute", "promising", "eventual"], "a": 3, "zh": "我環島旅行原本的預算是五千元，但＿＿花費很可能會高出五成。", "w": {"0": "moderate 是「適中的」，但後面說會多出五成，不是適中。", "1": "absolute 是「絕對的」，不會說絕對的花費。", "2": "promising 是「有希望的」，用來形容人或前景。"}, "k": "關鍵：but 和 original（原本的）形成對比 →「最後的」花費：eventual cost。", "v": "eventual 最後的｜budget 預算｜round-island 環島的", "s": "The original budget for my round-island trip was NT$5,000, but the ______ cost is likely to be 50 percent higher."}, {"n": 9, "o": ["trial", "route", "strike", "quest"], "a": 3, "zh": "看完自然史的電視節目後，Adam 決定去南達科他州＿＿恐龍化石。", "w": {"0": "trial 是「試驗、審判」，go on trial 是「受審」。", "1": "route 是「路線」，不會說 go on a route for fossils。", "2": "strike 是「罷工、打擊」，go on strike 是「罷工」。"}, "k": "關鍵：go on a quest for ＝ 去尋找、探尋。去找恐龍化石：a quest for dinosaur fossils。", "v": "quest 探尋｜fossil 化石｜natural history 自然史", "s": "After watching a TV program on natural history, Adam decided to go on a ______ for dinosaur fossils in South Dakota."}, {"n": 10, "o": ["bounces", "blushes", "polishes", "transfers"], "a": 1, "zh": "到處都開著粉紅色的櫻花，山谷在明亮的春日陽光下，像年輕的新娘一樣＿＿。", "w": {"0": "bounces 是「彈跳」，山谷不會跳。", "2": "polishes 是「擦亮」，要有受詞，而且新娘不會「像在擦亮」。", "3": "transfers 是「轉移」。"}, "k": "關鍵：粉紅色的櫻花 ＋ 害羞的新娘 → 臉紅：blush。這是把山谷比喻成臉紅的新娘。", "v": "blush 臉紅｜blossom 花｜bloom 開花｜bride 新娘", "s": "With pink cherry blossoms blooming everywhere, the valley ______ like a young bride under the bright spring sunshine."}], "gl": {"1": ["前進；提前", "遞送", "提供", "伸展"], "2": ["助理", "影響", "貢獻", "政治人物"], "3": ["聊天", "問答", "木偶；布偶", "多樣"], "4": ["可能地", "細緻地", "模稜兩可地", "可選擇地"], "5": ["加標籤", "聚集", "滾動", "拍照；折斷"], "6": ["巨大的", "親密的", "隨和的", "最終的"], "7": ["完全相同的", "看得見的", "可取得的", "了不起的"], "8": ["適中的", "絕對的", "有希望的", "最後的"], "9": ["試驗；審判", "路線", "罷工；打擊", "探尋"], "10": ["彈跳", "臉紅", "擦亮", "轉移"]}, "hint": {"1": "訂了披薩，要請人把它怎麼樣到家裡？", "2": "空格要填一個「人」，這個人在辦公室幫她很多忙。", "3": "和舞獅、歌仔戲並列的傳統表演，用手操作的是什麼戲？", "4": "副作用不一定會發生，但有致命的「可能」，要用哪個副詞？", "5": "給照片「加上」日期和關鍵字，方便整理，是在做什麼？", "6": "好相處、常說好，這是什麼樣的個性？", "7": "入口藏在小巷深處，路人幾乎怎麼樣？", "8": "but 前面說「原本的」預算，後面說的是什麼時候的花費？", "9": "去南達科他州「找」恐龍化石，哪個字是「探尋」？", "10": "粉紅色的櫻花讓山谷看起來像新娘的臉怎麼了？"}, "tag": {"1": "動詞", "2": "名詞", "3": "名詞", "4": "副詞", "5": "動詞", "6": "形容詞", "7": "形容詞", "8": "形容詞", "9": "名詞", "10": "動詞", "11": "動詞", "12": "時態", "13": "上下文邏輯", "14": "名詞", "15": "上下文邏輯", "16": "片語", "17": "時態", "18": "動詞", "19": "片語", "20": "動詞"}};
const DATA110={"vocab": [{"n": 1, "s": "Tom is really a naughty boy. He likes to ______ and play jokes on his younger sister when their parents are not around.", "zh": "Tom 真的是個頑皮的男孩。爸媽不在時，他喜歡＿＿妹妹、對她惡作劇。", "o": ["alert", "spare", "tease", "oppose"], "a": 2, "w": {"0": "alert 是「警告、提醒」，跟後面的 play jokes on（惡作劇）意思接不起來。", "1": "spare 是「饒恕；撥出（時間）」，頑皮的男孩不會饒恕妹妹。", "3": "oppose 是「反對」，後面要接受詞（oppose a plan），也和「惡作劇」不搭。"}, "k": "關鍵：naughty（頑皮的）＋ and play jokes on（惡作劇）→ 空格要和「捉弄」意思接近：tease＝捉弄、嘲弄。", "v": "tease 捉弄｜naughty 頑皮的｜play jokes on 對……惡作劇"}, {"n": 2, "s": "Elderly shoppers in this store are advised to take the elevator rather than the ______, which may move too fast for them to keep their balance.", "zh": "這家店建議年長的顧客搭電梯，不要搭＿＿，因為它動得太快，他們可能站不穩。", "o": ["airway", "operator", "escalator", "instrument"], "a": 2, "w": {"0": "airway 是「航線；呼吸道」，不是在店裡搭的東西。", "1": "operator 是「操作員；接線生」，是人，不能「搭」。", "3": "instrument 是「儀器；樂器」，不會「動得太快讓人站不穩」。"}, "k": "關鍵：和 elevator（電梯）比較，又會 move too fast 讓人站不穩 → escalator＝手扶梯。", "v": "escalator 手扶梯｜elevator 電梯｜keep one's balance 保持平衡"}, {"n": 3, "s": "Upon hearing its master’s call, the dog wagged its tail, and followed her out of the room ______.", "zh": "一聽到主人叫牠，狗就搖搖尾巴，＿＿跟著她走出房間。", "o": ["obediently", "apparently", "logically", "thoroughly"], "a": 0, "w": {"1": "apparently 是「顯然地；看來」，通常放在句首評論整件事，不是形容跟著走的樣子。", "2": "logically 是「合乎邏輯地」，形容狗跟著主人走不自然。", "3": "thoroughly 是「徹底地」，「徹底地跟著走出房間」不通。"}, "k": "關鍵：聽到主人叫就搖尾巴跟上 → 很聽話：obediently＝順從地、聽話地。", "v": "obediently 順從地｜wag 搖動（尾巴）｜master 主人"}, {"n": 4, "s": "Since many of our house plants are from humid jungle environments, they need ______ air to keep them green and healthy.", "zh": "因為很多室內植物來自潮濕的叢林環境，它們需要＿＿的空氣來保持翠綠健康。", "o": ["moist", "stale", "crisp", "fertile"], "a": 0, "w": {"1": "stale 是「不新鮮的；悶的」，對植物不好。", "2": "crisp 是「（空氣）清新乾爽的；脆的」，和 humid（潮濕的）相反。", "3": "fertile 是「肥沃的」，形容土壤，不形容空氣。"}, "k": "關鍵：來自 humid（潮濕的）叢林 → 需要潮濕的空氣：moist＝濕潤的。", "v": "moist 濕潤的｜humid 潮濕的｜jungle 叢林"}, {"n": 5, "s": "The skydiver managed to land safely after jumping out of the aircraft, even though her ______ failed to open in midair.", "zh": "雖然她的＿＿在半空中沒有打開，這名跳傘員跳出飛機後還是成功安全落地。", "o": ["glimpse", "latitude", "segment", "parachute"], "a": 3, "w": {"0": "glimpse 是「一瞥」，不會「打開」。", "1": "latitude 是「緯度」，跟跳傘無關。", "2": "segment 是「部分；片段」，意思不通。"}, "k": "關鍵：skydiver（跳傘員）跳出飛機，在空中要打開的東西 → parachute＝降落傘。", "v": "parachute 降落傘｜skydiver 跳傘員｜midair 半空中"}, {"n": 6, "s": "The invention of the steam engine, which was used to power heavy machines, brought about a ______ change in society.", "zh": "蒸汽機被用來推動重型機器，它的發明為社會帶來＿＿的改變。", "o": ["persuasive", "harmonious", "conventional", "revolutionary"], "a": 3, "w": {"0": "persuasive 是「有說服力的」，形容言論，不形容社會的改變。", "1": "harmonious 是「和諧的」，跟發明帶來的大改變不搭。", "2": "conventional 是「傳統的」，新發明帶來的改變不會是「傳統的」。"}, "k": "關鍵：蒸汽機帶動了工業革命 → 帶來「革命性的」改變：revolutionary。", "v": "revolutionary 革命性的｜steam engine 蒸汽機｜bring about 帶來"}, {"n": 7, "s": "To encourage classroom ______, the teacher divided the class into groups and asked them to solve a problem together with their partners.", "zh": "為了鼓勵課堂上的＿＿，老師把全班分組，請學生和夥伴一起解決問題。", "o": ["operation", "interaction", "adjustment", "explanation"], "a": 1, "w": {"0": "operation 是「操作；手術」，classroom operation 不是分組合作的目的。", "2": "adjustment 是「調整」，分組討論不是為了調整。", "3": "explanation 是「解釋」，分組一起解決問題重點是互動，不是解釋。"}, "k": "關鍵：分組、和夥伴一起解決問題 → 鼓勵同學之間的「互動」：interaction。", "v": "interaction 互動｜divide into 分成｜partner 夥伴"}, {"n": 8, "s": "Lisa ______ onto the ground and injured her ankle while she was playing basketball yesterday.", "zh": "Lisa 昨天打籃球時＿＿到地上，扭傷了腳踝。", "o": ["buried", "punched", "scattered", "tumbled"], "a": 3, "w": {"0": "buried 是「埋葬」，要接受詞，也不會讓自己受傷。", "1": "punched 是「用拳頭打」，後面要接打的對象。", "2": "scattered 是「散落；撒」，形容東西散開，不是人跌倒。"}, "k": "關鍵：onto the ground（到地上）＋ injured her ankle（腳踝受傷）→ 跌倒：tumble＝跌倒、摔倒。", "v": "tumble 跌倒｜ankle 腳踝｜injure 使受傷"}, {"n": 9, "s": "Hundreds of residents received free testing ______ from the city government to find out if their water contained any harmful chemicals.", "zh": "數百位居民從市政府領到免費的檢測＿＿，用來檢查家裡的水有沒有有害化學物質。", "o": ["kits", "trials", "zones", "proofs"], "a": 0, "w": {"1": "trials 是「試驗；審判」，不是可以「領到」的東西。", "2": "zones 是「區域」，居民不會領到檢測區域。", "3": "proofs 是「證據」，要先檢測才知道，不是先領到證據。"}, "k": "關鍵：居民「領到」可以自己檢測水質的東西 → testing kit＝檢測套組、試劑包。", "v": "kit 一套用具｜resident 居民｜harmful 有害的"}, {"n": 10, "s": "The 2011 Nobel Peace Prize was awarded ______ to three women for the efforts they made in fighting for women’s rights.", "zh": "2011 年諾貝爾和平獎＿＿頒給三位女性，表揚她們為爭取女權所做的努力。", "o": ["actively", "earnestly", "jointly", "naturally"], "a": 2, "w": {"0": "actively 是「積極地」，獎項不會「積極地」頒發。", "1": "earnestly 是「誠懇地」，形容人的態度，不形容頒獎。", "3": "naturally 是「自然地；當然」，意思不合。"}, "k": "關鍵：同一個獎頒給「三位」女性 → 共同獲獎：jointly＝共同地。", "v": "jointly 共同地｜award 頒發｜women’s rights 女權"}, {"n": 11, "s": "The company is ______ and making great profits under the wise leadership of the chief executive officer.", "zh": "在執行長英明的領導下，這家公司＿＿，賺了很多錢。", "o": ["applauding", "flourishing", "circulating", "exceeding"], "a": 1, "w": {"0": "applauding 是「鼓掌」，公司不會鼓掌。", "2": "circulating 是「流通；循環」，形容錢、血液或消息，不形容公司經營得好。", "3": "exceeding 是「超過」，要接受詞（exceed expectations），不能單獨用。"}, "k": "關鍵：and making great profits（賺很多錢）→ 公司「蓬勃發展」：flourish＝興旺、繁榮。", "v": "flourish 興旺｜profit 利潤｜CEO 執行長"}, {"n": 12, "s": "It is absolutely ______ to waste your money on an expensive car when you cannot even get a driver’s license.", "zh": "你連駕照都考不到，卻把錢浪費在昂貴的車上，真是太＿＿了。", "o": ["absurd", "cautious", "vigorous", "obstinate"], "a": 0, "w": {"1": "cautious 是「謹慎的」，亂花錢正好相反。", "2": "vigorous 是「精力充沛的」，形容人或活動，意思不通。", "3": "obstinate 是「固執的」，形容人，It is obstinate to... 不是正確用法。"}, "k": "關鍵：沒駕照卻買貴車 → 很荒謬：absurd＝荒謬的、可笑的。It is absurd to V.", "v": "absurd 荒謬的｜absolutely 完全地｜driver’s license 駕照"}, {"n": 13, "s": "The problem of illegal drug use is very complex and cannot be traced to merely one ______ reason.", "zh": "非法用藥的問題很複雜，不能只歸咎於一個＿＿的原因。", "o": ["singular", "countable", "favorable", "defensive"], "a": 0, "w": {"1": "countable 是「可數的」，「可數的原因」不通。", "2": "favorable 是「有利的」，跟找問題的原因不合。", "3": "defensive 是「防禦的」，意思不通。"}, "k": "關鍵：very complex（很複雜）＋ merely one（只有一個）→ 不能歸咎於「單一的」原因：singular。", "v": "singular 單一的｜complex 複雜的｜trace to 追溯到"}, {"n": 14, "s": "The non-profit organization has ______ $1 million over five years to finance the construction of the medical center.", "zh": "這個非營利組織已經＿＿在五年內拿出一百萬美元，資助醫療中心的興建。", "o": ["equipped", "resolved", "committed", "associated"], "a": 2, "w": {"0": "equipped 是「裝備」，equip A with B，不能接一筆錢。", "1": "resolved 是「解決；下定決心」，resolved $1 million 不通。", "3": "associated 是「把……聯想在一起」，跟出錢無關。"}, "k": "關鍵：拿出一筆錢 to finance（資助）建設 → commit money to＝承諾撥出（資金）。", "v": "commit 承諾投入｜non-profit 非營利的｜finance 資助"}, {"n": 15, "s": "One week after the typhoon, some bridges were finally opened and bus service ______ in the country’s most severely damaged areas.", "zh": "颱風過後一週，一些橋梁終於開通，受災最嚴重地區的公車服務也＿＿了。", "o": ["departed", "resumed", "transported", "corresponded"], "a": 1, "w": {"0": "departed 是「出發；離開」，bus service（公車服務）不會「出發」。", "2": "transported 是「運送」，要接受詞，而且 bus service 不是被運送的東西。", "3": "corresponded 是「通信；相符」，意思不合。"}, "k": "關鍵：颱風後橋梁 finally opened → 公車服務也「恢復」了：resume＝重新開始、恢復。", "v": "resume 恢復｜typhoon 颱風｜severely 嚴重地"}], "gl": {"1": ["警告", "饒恕；撥出", "捉弄", "反對"], "2": ["航線", "操作員", "手扶梯", "儀器；樂器"], "3": ["順從地", "顯然地", "合邏輯地", "徹底地"], "4": ["濕潤的", "不新鮮的", "清脆的；清新乾爽的", "肥沃的"], "5": ["一瞥", "緯度", "部分", "降落傘"], "6": ["有說服力的", "和諧的", "傳統的", "革命性的"], "7": ["操作；手術", "互動", "調整", "解釋"], "8": ["埋葬", "用拳頭打", "散落", "跌倒"], "9": ["套組", "試驗", "區域", "證據"], "10": ["積極地", "誠懇地", "共同地", "自然地"], "11": ["鼓掌", "興旺", "流通", "超過"], "12": ["荒謬的", "謹慎的", "精力充沛的", "固執的"], "13": ["單一的", "可數的", "有利的", "防禦的"], "14": ["裝備", "解決", "承諾投入", "聯想"], "15": ["出發", "恢復", "運送", "通信；相符"]}, "hint": {"1": "他是個 naughty（頑皮的）男孩，還會 play jokes on（惡作劇）妹妹，他會對妹妹做什麼？", "2": "跟 elevator（電梯）比較，在商店裡、會動、走太快讓人站不穩的是什麼？", "3": "狗聽到主人叫，搖著尾巴跟上，牠的樣子是怎樣？", "4": "這些植物來自 humid（潮濕的）叢林，需要什麼樣的空氣？", "5": "跳傘員跳出飛機後，在空中要打開什麼？", "6": "蒸汽機帶來了工業革命，那是一種什麼樣的改變？", "7": "分組、和夥伴一起解題，老師想鼓勵同學之間多做什麼？", "8": "到地上（onto the ground），還扭傷腳踝，她怎麼了？", "9": "居民「領到」可以自己檢驗水的東西，是一整套什麼？", "10": "一個獎頒給「三個人」，是怎麼頒的？", "11": "後面說公司賺很多錢，公司的狀態是怎樣？", "12": "連駕照都沒有就買貴車，這件事怎麼樣？", "13": "問題很複雜，所以不能只怪「一個」什麼樣的原因？", "14": "組織「拿出」一百萬美元來資助，哪個動詞可以表示承諾撥出一筆錢？", "15": "颱風後橋終於開了，公車服務也怎麼了？"}, "tag": {"1": "動詞", "2": "名詞", "3": "副詞", "4": "形容詞", "5": "名詞", "6": "形容詞", "7": "名詞", "8": "動詞", "9": "名詞", "10": "副詞", "11": "動詞", "12": "形容詞", "13": "形容詞", "14": "動詞", "15": "動詞", "16": "介係詞", "17": "片語", "18": "動詞", "19": "副詞", "20": "分詞", "21": "片語", "22": "動詞", "23": "片語", "24": "片語", "25": "假設語氣", "26": "片語", "27": "形容詞", "28": "分詞構句", "29": "形容詞", "30": "片語"}};
const DATA109={"vocab": [{"n": 1, "s": "After hours of discussion, our class finally reached the ______ that we would go to Hualien for our graduation trip.", "zh": "討論了好幾個小時，我們班終於得到＿＿：畢業旅行要去花蓮。", "o": ["balance", "conclusion", "definition", "harmony"], "a": 1, "w": {"0": "balance 是「平衡」，reach a balance 是取得平衡，後面不接 that 子句說明內容。", "2": "definition 是「定義」，討論畢旅地點不是在下定義。", "3": "harmony 是「和諧」，reach the harmony that... 不通。"}, "k": "關鍵：討論很久之後「得到結論」：reach the conclusion that＋子句＝得出……的結論。", "v": "conclusion 結論｜discussion 討論｜graduation trip 畢業旅行"}, {"n": 2, "s": "Jane ______ her teacher by passing the exam with a nearly perfect score; she almost failed the course last semester.", "zh": "Jane 考試拿到幾乎滿分，讓老師＿＿；她上學期這科差點被當。", "o": ["bored", "amazed", "charmed", "informed"], "a": 1, "w": {"0": "bored 是「使無聊」，考高分不會讓老師覺得無聊。", "2": "charmed 是「使著迷」，通常形容人的魅力，不是考試成績。", "3": "informed 是「通知」，通知老師不是考高分帶來的結果。"}, "k": "關鍵：上學期差點被當，這次幾乎滿分 → 老師很「驚訝」：amaze＝使驚奇。", "v": "amaze 使驚奇｜nearly 幾乎｜semester 學期"}, {"n": 3, "s": "The vacuum cleaner is not working. Let’s send it back to the ______ to have it inspected and repaired.", "zh": "吸塵器壞了。我們把它送回＿＿檢查和修理吧。", "o": ["lecturer", "publisher", "researcher", "manufacturer"], "a": 3, "w": {"0": "lecturer 是「講師」，不修吸塵器。", "1": "publisher 是「出版商」，出書的，不做家電。", "2": "researcher 是「研究員」，不負責修理產品。"}, "k": "關鍵：家電壞了送回去檢查修理 → 送回「製造商」：manufacturer。", "v": "manufacturer 製造商｜vacuum cleaner 吸塵器｜inspect 檢查"}, {"n": 4, "s": "Due to the global financial crisis, the country’s exports ______ by 40 percent last month, the largest drop since 2000.", "zh": "因為全球金融危機，這個國家上個月的出口＿＿了 40%，是 2000 年以來最大的跌幅。", "o": ["flattered", "transformed", "relieved", "decreased"], "a": 3, "w": {"0": "flattered 是「奉承」，不能形容出口。", "1": "transformed 是「轉變」，by 40 percent 表示數量增減，transform 不接百分比。", "2": "relieved 是「減輕（痛苦）」，不形容出口數量。"}, "k": "關鍵：金融危機、the largest drop（最大跌幅）→ 出口「減少」：decrease by＋百分比。", "v": "decrease 減少｜export 出口｜financial crisis 金融危機"}, {"n": 5, "s": "The potato chips have been left uncovered on the table for such a long time that they no longer taste fresh and ______.", "zh": "洋芋片沒蓋著放在桌上太久了，吃起來已經不新鮮也不＿＿了。", "o": ["solid", "crispy", "original", "smooth"], "a": 1, "w": {"0": "solid 是「固體的；堅固的」，洋芋片放久還是固體。", "2": "original 是「原本的；原創的」，taste original 不通。", "3": "smooth 是「滑順的」，洋芋片本來就不是滑順的口感。"}, "k": "關鍵：洋芋片放太久受潮 → 不再「酥脆」：crispy。", "v": "crispy 酥脆的｜uncovered 沒蓋住的｜no longer 不再"}, {"n": 6, "s": "The townspeople built a ______ in memory of the brave teacher who sacrificed her life to save her students from a burning bus.", "zh": "鎮民建了一座＿＿，紀念那位犧牲生命、從起火的公車上救出學生的勇敢老師。", "o": ["monument", "refugee", "souvenir", "firecracker"], "a": 0, "w": {"1": "refugee 是「難民」，是人，不能「建」。", "2": "souvenir 是「紀念品」，是買來留念的小東西，不是為了紀念人而建造的。", "3": "firecracker 是「鞭炮」，不能用來紀念人。"}, "k": "關鍵：built（建造）＋ in memory of（紀念）→ 「紀念碑」：monument。", "v": "monument 紀念碑｜in memory of 紀念｜sacrifice 犧牲"}, {"n": 7, "s": "The students in Professor Smith’s classical Chinese class are required to ______ poems by famous Chinese poets.", "zh": "史密斯教授古文課的學生必須＿＿中國名詩人的詩。", "o": ["construct", "expose", "recite", "install"], "a": 2, "w": {"0": "construct 是「建造」，不能建造別人的詩。", "1": "expose 是「暴露」，意思不通。", "3": "install 是「安裝」，詩不能安裝。"}, "k": "關鍵：古文課，要對詩做的事 → 「背誦」：recite。", "v": "recite 背誦｜classical 古典的｜poet 詩人"}, {"n": 8, "s": "Although Mr. Tang claims that the house belongs to him, he has not offered any proof of ______.", "zh": "雖然唐先生聲稱房子是他的，他卻沒有提出任何＿＿證明。", "o": ["convention", "relationship", "insurance", "ownership"], "a": 3, "w": {"0": "convention 是「慣例；大會」，意思不通。", "1": "relationship 是「關係」，房子是不是他的，要證明的不是關係。", "2": "insurance 是「保險」，有保險不代表房子是他的。"}, "k": "關鍵：the house belongs to him（房子屬於他）→ 要提出「所有權」證明：proof of ownership。", "v": "ownership 所有權｜claim 聲稱｜belong to 屬於"}, {"n": 9, "s": "Ancient Athens, famous for its early development of the democratic system, is often said to be the ______ of democracy.", "zh": "古雅典很早就發展出民主制度，常被稱為民主的＿＿。", "o": ["mission", "target", "cradle", "milestone"], "a": 2, "w": {"0": "mission 是「任務」，雅典不是民主的任務。", "1": "target 是「目標」，雅典不是民主要達到的目標。", "3": "milestone 是「里程碑」，指發展過程中的重要事件，雅典是民主「開始」的地方。"}, "k": "關鍵：early development（很早開始發展）→ 民主的「發源地」：the cradle of＝……的搖籃、發源地。", "v": "cradle 搖籃；發源地｜democracy 民主｜ancient 古代的"}, {"n": 10, "s": "The candy can no longer be sold because it was found to contain artificial ingredients far beyond the ______ level.", "zh": "這款糖果不能再賣了，因為被發現含有的人工成分遠遠超過＿＿標準。", "o": ["abundant", "immense", "permissible", "descriptive"], "a": 2, "w": {"0": "abundant 是「豐富的」，「遠超過豐富的標準」不通。", "1": "immense 是「巨大的」，不形容標準。", "3": "descriptive 是「描述的」，意思不通。"}, "k": "關鍵：超過什麼標準就不能賣？→「允許的」標準：permissible level。", "v": "permissible 允許的｜artificial 人工的｜ingredient 成分"}, {"n": 11, "s": "Jack’s excellent performance in last week’s game has ______ all the doubts about his ability to play on our school basketball team.", "zh": "Jack 上週比賽的精彩表現，＿＿了大家對他能不能進校隊的所有懷疑。", "o": ["erased", "canceled", "overlooked", "replaced"], "a": 0, "w": {"1": "canceled 是「取消」，多用在活動、訂單，不說取消懷疑。", "2": "overlooked 是「忽略」，表現好是讓懷疑消失，不是忽略懷疑。", "3": "replaced 是「取代」，取代懷疑要說用什麼取代，這裡意思不完整。"}, "k": "關鍵：表現很好 → 讓大家的懷疑「消除」：erase doubts。", "v": "erase 消除｜doubt 懷疑｜performance 表現"}, {"n": 12, "s": "It is bullying to ______ a foreign speaker’s accent. No one deserves to be laughed at for their pronunciation.", "zh": "＿＿外國人的口音是一種霸凌。沒有人應該因為發音而被嘲笑。", "o": ["mock", "sneak", "prompt", "glare"], "a": 0, "w": {"1": "sneak 是「偷偷溜走」，不及物，不接口音。", "2": "prompt 是「促使；提示」，意思不通。", "3": "glare 是「怒視」，要用 glare at，而且怒視不是「嘲笑」。"}, "k": "關鍵：後句 laughed at（被嘲笑）→ 「嘲弄」口音：mock。", "v": "mock 嘲弄｜bullying 霸凌｜accent 口音"}, {"n": 13, "s": "Mary lost ten kilograms in three months, so her ______ skin-tight jeans are now hanging off her hips.", "zh": "Mary 三個月瘦了十公斤，所以她那件＿＿很緊的牛仔褲，現在都掛在臀部上快掉下來了。", "o": ["barely", "evenly", "currently", "formerly"], "a": 3, "w": {"0": "barely 是「幾乎沒有」，barely skin-tight 意思不通。", "1": "evenly 是「平均地」，意思不合。", "2": "currently 是「目前」，但牛仔褲「現在」是鬆的，不是緊的。"}, "k": "關鍵：瘦了十公斤，牛仔褲「以前」很緊，現在變鬆 → formerly＝以前。", "v": "formerly 以前｜skin-tight 緊身的｜hang off 鬆垮地掛著"}, {"n": 14, "s": "The police officer showed us pictures of drunk driving accidents to highlight the importance of staying ______ on the road.", "zh": "警察給我們看酒駕事故的照片，強調開車上路時保持＿＿的重要。", "o": ["sober", "majestic", "vigorous", "noticeable"], "a": 0, "w": {"1": "majestic 是「雄偉的」，形容山或建築，不形容開車的人。", "2": "vigorous 是「精力充沛的」，跟酒駕的主題不搭。", "3": "noticeable 是「顯而易見的」，stay noticeable 不是重點。"}, "k": "關鍵：drunk driving（酒駕）的相反 → 保持「清醒、沒喝酒」：stay sober。", "v": "sober 清醒的；沒喝醉的｜highlight 強調｜drunk driving 酒駕"}, {"n": 15, "s": "The claim that eating chocolate can prevent heart disease is ______ because there is not enough scientific evidence to support it.", "zh": "「吃巧克力可以預防心臟病」這個說法是＿＿的，因為沒有足夠的科學證據支持。", "o": ["creative", "disputable", "circular", "magnificent"], "a": 1, "w": {"0": "creative 是「有創意的」，跟證據不足無關。", "2": "circular 是「圓形的；循環的」，意思不合。", "3": "magnificent 是「壯麗的」，不形容說法。"}, "k": "關鍵：not enough scientific evidence（證據不足）→ 這個說法「有爭議、值得懷疑」：disputable。", "v": "disputable 有爭議的｜claim 說法｜evidence 證據"}], "gl": {"1": ["平衡", "結論", "定義", "和諧"], "2": ["使無聊", "使驚奇", "使著迷", "通知"], "3": ["講師", "出版商", "研究員", "製造商"], "4": ["奉承", "轉變", "減輕", "減少"], "5": ["固體的", "酥脆的", "原本的", "滑順的"], "6": ["紀念碑", "難民", "紀念品", "鞭炮"], "7": ["建造", "暴露", "背誦", "安裝"], "8": ["慣例；大會", "關係", "保險", "所有權"], "9": ["任務", "目標", "搖籃；發源地", "里程碑"], "10": ["豐富的", "巨大的", "允許的", "描述的"], "11": ["消除", "取消", "忽略", "取代"], "12": ["嘲弄", "偷溜", "促使", "怒視"], "13": ["幾乎沒有", "平均地", "目前", "以前"], "14": ["清醒的", "雄偉的", "精力充沛的", "顯著的"], "15": ["有創意的", "有爭議的", "圓形的", "壯麗的"]}, "hint": {"1": "討論好幾個小時，最後「得到」什麼？後面的 that 子句就是內容。", "2": "上學期差點被當，這次幾乎滿分，老師會有什麼感覺？", "3": "吸塵器壞了要送回去修，送回哪裡？", "4": "後面說 the largest drop（最大跌幅），出口怎麼了？", "5": "洋芋片放太久受潮，吃起來不再怎樣？", "6": "「建造」一個東西來「紀念」老師，是什麼？", "7": "古文課，要對名詩人的詩做什麼？", "8": "他說房子是他的，要證明什麼？", "9": "雅典是民主「最早開始」的地方，英文用哪個比喻？", "10": "超過什麼樣的標準，糖果就不能賣了？", "11": "表現很好，大家的懷疑怎麼了？", "12": "後面說 laughed at（被嘲笑），對口音做什麼是霸凌？", "13": "瘦了十公斤，牛仔褲是「以前」緊還是「現在」緊？", "14": "跟酒駕相反，開車時要保持什麼狀態？", "15": "沒有足夠證據支持的說法，是怎樣的說法？"}, "tag": {"1": "名詞", "2": "動詞", "3": "名詞", "4": "動詞", "5": "形容詞", "6": "名詞", "7": "動詞", "8": "名詞", "9": "名詞", "10": "形容詞", "11": "動詞", "12": "動詞", "13": "副詞", "14": "形容詞", "15": "形容詞", "16": "時態", "17": "名詞", "18": "片語", "19": "轉折語", "20": "形容詞", "21": "形容詞", "22": "片語", "23": "片語", "24": "文法", "25": "形容詞", "26": "動詞", "27": "名詞", "28": "轉折語", "29": "片語", "30": "片語"}};
const DATA108={"vocab": [{"n": 1, "s": "Bobby cared a lot about his ______ at home and asked his parents not to go through his things without his permission.", "zh": "Bobby 很在意他在家裡的＿＿，要求爸媽沒經過他同意不要翻他的東西。", "o": ["discipline", "facility", "privacy", "representation"], "a": 2, "w": {"0": "discipline 是「紀律；管教」，跟「不要翻我的東西」無關。", "1": "facility 是「設施」，意思不通。", "3": "representation 是「代表；表現」，意思不合。"}, "k": "關鍵：不要沒經過同意翻他的東西 → 在意「隱私」：privacy。", "v": "privacy 隱私｜go through 翻看｜permission 允許"}, {"n": 2, "s": "The new manager is a real gentleman. He is kind and humble, totally different from the former manager, who was ______ and bossy.", "zh": "新經理是個真正的紳士，親切又謙虛，跟以前那位＿＿又愛發號施令的經理完全不同。", "o": ["eager", "liberal", "mean", "inferior"], "a": 2, "w": {"0": "eager 是「渴望的；熱切的」，不是 kind 的相反。", "1": "liberal 是「開明的；大方的」，跟 bossy 不搭。", "3": "inferior 是「較差的；下級的」，形容地位或品質，不是性格。"}, "k": "關鍵：totally different from（完全相反）kind and humble → 前經理「刻薄」又霸道：mean。", "v": "mean 刻薄的｜humble 謙虛的｜bossy 愛指使人的"}, {"n": 3, "s": "The weather bureau ______ that the typhoon would bring strong winds and heavy rains, and warned everyone of the possible danger.", "zh": "氣象局＿＿颱風會帶來強風豪雨，並提醒大家可能的危險。", "o": ["conveyed", "associated", "interpreted", "predicted"], "a": 3, "w": {"0": "conveyed 是「傳達」，要說傳達給誰，而且 would bring 是對未來的判斷，用 predict 最準確。", "1": "associated 是「把……聯想在一起」，不接 that 子句。", "2": "interpreted 是「解讀；口譯」，意思不合。"}, "k": "關鍵：would bring（將會帶來）是對未來的判斷 → 氣象局「預測」：predict that...。", "v": "predict 預測｜weather bureau 氣象局｜warn A of B 警告 A 注意 B"}, {"n": 4, "s": "Different airlines have different ______ for carry-on luggage, but many international airlines limit a carry-on piece to 7 kilograms.", "zh": "不同航空公司對隨身行李有不同的＿＿，但很多國際航空公司限制一件隨身行李 7 公斤。", "o": ["landmarks", "restrictions", "percentages", "circumstances"], "a": 1, "w": {"0": "landmarks 是「地標」，意思不通。", "2": "percentages 是「百分比」，跟行李重量限制無關。", "3": "circumstances 是「情況」，different circumstances for luggage 不通。"}, "k": "關鍵：後面說 limit ... to 7 kilograms（限制 7 公斤）→ 對行李的「限制、規定」：restrictions。", "v": "restriction 限制｜carry-on luggage 隨身行李｜limit A to B 把 A 限制在 B"}, {"n": 5, "s": "Many people were happy that the government had finally ______ Children’s Day as a national holiday.", "zh": "很多人很高興政府終於＿＿兒童節為國定假日。", "o": ["appointed", "declared", "performed", "involved"], "a": 1, "w": {"0": "appointed 是「任命」，用在人（appoint sb as...），不能任命一個節日。", "2": "performed 是「表演；執行」，意思不通。", "3": "involved 是「牽涉」，意思不合。"}, "k": "關鍵：declare A as B＝宣布 A 為 B。政府「宣布」兒童節為國定假日。", "v": "declare 宣布｜national holiday 國定假日"}, {"n": 6, "s": "To reach the goal of making her company a market leader, Michelle ______ a plan to open ten new stores around the country this year.", "zh": "為了讓公司成為市場龍頭，Michelle＿＿一個今年要在全國開十家新店的計畫。", "o": ["advised", "occupied", "proposed", "recognized"], "a": 2, "w": {"0": "advised 是「建議」，要接人（advise sb to V），advise a plan 不自然。", "1": "occupied 是「佔領；佔用」，不能佔領計畫。", "3": "recognized 是「認出；認可」，計畫是她想出來的，不是認出來的。"}, "k": "關鍵：為了達成目標而「提出」計畫：propose a plan。", "v": "propose 提出｜market leader 市場龍頭"}, {"n": 7, "s": "Silence in some way is as ______ as speech. It can be used to show, for example, disagreement or lack of interest.", "zh": "沉默在某種程度上跟說話一樣＿＿。例如它可以用來表示不同意或沒興趣。", "o": ["sociable", "expressive", "reasonable", "objective"], "a": 1, "w": {"0": "sociable 是「愛社交的」，形容人，不形容沉默。", "2": "reasonable 是「合理的」，跟後面「可以表達……」沒有關係。", "3": "objective 是「客觀的」，意思不合。"}, "k": "關鍵：後句說沉默可以用來「表示」不同意或沒興趣 → 沉默跟說話一樣「能表達意思」：expressive。", "v": "expressive 富表現力的｜disagreement 不同意"}, {"n": 8, "s": "This TV program is designed for children, ______ for those under five. It contains no violence or strong language.", "zh": "這個電視節目是為兒童設計的，＿＿是五歲以下的孩子。節目裡沒有暴力或粗話。", "o": ["particularly", "sensibly", "moderately", "considerably"], "a": 0, "w": {"1": "sensibly 是「明智地」，意思不通。", "2": "moderately 是「適度地」，不能用來強調對象。", "3": "considerably 是「相當大地」，修飾程度，不用來點出特定對象。"}, "k": "關鍵：先說給兒童，再縮小範圍到五歲以下 → 「特別是」：particularly。", "v": "particularly 特別是｜violence 暴力｜strong language 粗話"}, {"n": 9, "s": "Tommy, please put away the toys in the box, or you might ______ on them and hurt yourself.", "zh": "Tommy，請把玩具收進盒子裡，不然你可能會＿＿到它們而受傷。", "o": ["stumble", "graze", "navigate", "dwell"], "a": 0, "w": {"1": "graze 是「吃草；擦傷」，graze on 是動物吃草。", "2": "navigate 是「導航」，意思不通。", "3": "dwell on 是「老是想著」，跟受傷無關。"}, "k": "關鍵：玩具沒收好，會「絆倒」受傷：stumble on/over＝被……絆倒。", "v": "stumble 絆倒｜put away 收好"}, {"n": 10, "s": "The ______ costume party, held every September, is one of the biggest events of the school year.", "zh": "每年九月舉辦的＿＿變裝派對，是學年中最大的活動之一。", "o": ["initial", "annual", "evident", "occasional"], "a": 1, "w": {"0": "initial 是「最初的」，意思不合。", "2": "evident 是「明顯的」，不形容派對。", "3": "occasional 是「偶爾的」，但派對是「每年」固定舉辦。"}, "k": "關鍵：held every September（每年九月舉辦）→「年度的」：annual。", "v": "annual 每年的｜costume party 變裝派對"}, {"n": 11, "s": "In a job interview, attitude and personality are usually important ______ that influence the decision of the interviewers.", "zh": "在求職面試中，態度和個性通常是影響面試官決定的重要＿＿。", "o": ["factors", "outcomes", "missions", "identities"], "a": 0, "w": {"1": "outcomes 是「結果」，態度和個性是原因，不是結果。", "2": "missions 是「任務」，意思不通。", "3": "identities 是「身分」，意思不合。"}, "k": "關鍵：that influence the decision（影響決定）→ 影響的「因素」：factors。", "v": "factor 因素｜personality 個性｜interviewer 面試官"}, {"n": 12, "s": "The snow-capped mountain is described so ______ in the book that the scene seems to come alive in the reader’s eyes.", "zh": "書裡把那座白雪覆頂的山描寫得非常＿＿，景色好像在讀者眼前活了起來。", "o": ["distantly", "meaningfully", "cheerfully", "vividly"], "a": 3, "w": {"0": "distantly 是「遙遠地」，跟「活了起來」相反。", "1": "meaningfully 是「有意義地」，不是讓畫面活起來的原因。", "2": "cheerfully 是「愉快地」，形容人的心情。"}, "k": "關鍵：the scene seems to come alive（景色好像活起來）→ 描寫得很「生動」：vividly。", "v": "vividly 生動地｜snow-capped 白雪覆頂的｜come alive 變得生動"}, {"n": 13, "s": "Surrounded by flowers blooming and birds ______ merrily, the Wangs had a good time hiking in the national park.", "zh": "四周花朵盛開、鳥兒快樂地＿＿，王家人在國家公園健行玩得很開心。", "o": ["napping", "scooping", "flipping", "chirping"], "a": 3, "w": {"0": "napping 是「小睡」，鳥睡覺不會「快樂地」，也不會讓人感受到。", "1": "scooping 是「舀」，意思不通。", "2": "flipping 是「翻轉」，意思不合。"}, "k": "關鍵：鳥 merrily（快樂地）做的事 → 「吱吱叫」：chirp。", "v": "chirp 鳥叫｜bloom 開花｜merrily 快樂地"}, {"n": 14, "s": "It is essential for us to maintain constant ______ with our friends to ensure that we have someone to talk to in times of need.", "zh": "我們必須和朋友保持＿＿，確保需要的時候有人可以說話。", "o": ["benefit", "contact", "gesture", "favor"], "a": 1, "w": {"0": "benefit 是「好處」，maintain benefit with 不通。", "2": "gesture 是「手勢」，意思不通。", "3": "favor 是「幫忙」，maintain favor with 不是正確搭配。"}, "k": "關鍵：maintain contact with＝和……保持聯絡，才能在需要時有人可以說話。", "v": "contact 聯絡｜maintain 保持｜in times of need 需要的時候"}, {"n": 15, "s": "The young generation in this country has shown less interest in factory work and other ______ labor jobs, such as house construction and fruit picking.", "zh": "這個國家的年輕一代對工廠工作和其他＿＿勞動的工作，例如蓋房子和採水果，比較沒興趣。", "o": ["causal", "durable", "manual", "violent"], "a": 2, "w": {"0": "causal 是「因果的」，不形容工作。", "1": "durable 是「耐用的」，形容東西。", "3": "violent 是「暴力的」，蓋房子和採水果不是暴力工作。"}, "k": "關鍵：工廠、蓋房子、採水果都是用手和體力的工作 →「體力的、手工的」：manual labor。", "v": "manual 用手的｜labor 勞動｜generation 世代"}], "gl": {"1": ["紀律", "設施", "隱私", "代表"], "2": ["熱切的", "開明的", "刻薄的", "較差的"], "3": ["傳達", "聯想", "解讀", "預測"], "4": ["地標", "限制", "百分比", "情況"], "5": ["任命", "宣布", "表演", "牽涉"], "6": ["建議", "佔用", "提出", "認出"], "7": ["愛社交的", "富表現力的", "合理的", "客觀的"], "8": ["特別是", "明智地", "適度地", "相當大地"], "9": ["絆倒", "吃草；擦傷", "導航", "居住；老想著"], "10": ["最初的", "每年的", "明顯的", "偶爾的"], "11": ["因素", "結果", "任務", "身分"], "12": ["遙遠地", "有意義地", "愉快地", "生動地"], "13": ["小睡", "舀", "翻轉", "鳥叫"], "14": ["好處", "聯絡", "手勢", "幫忙"], "15": ["因果的", "耐用的", "手工的；體力的", "暴力的"]}, "hint": {"1": "不希望別人隨便翻他的東西，他在意的是什麼？", "2": "和 kind and humble（親切謙虛）完全相反的個性是？", "3": "would bring 是對未來的判斷，氣象局做的是什麼？", "4": "後面說限制 7 公斤，這是航空公司的什麼？", "5": "政府「宣布」某天為國定假日，用哪個動詞？", "6": "為了達成目標，她想出並「提出」了一個計畫。", "7": "沉默可以「表達」不同意，所以它跟說話一樣怎樣？", "8": "先說兒童，再特別點出五歲以下，用哪個副詞？", "9": "玩具亂放，走路會怎麼樣？", "10": "every September（每年九月）舉辦，是什麼樣的派對？", "11": "態度和個性會影響面試結果，它們是什麼？", "12": "景色好像活起來，表示描寫得怎樣？", "13": "鳥快樂地在做什麼？", "14": "跟朋友保持什麼，需要時才有人說話？", "15": "工廠、蓋房子、採水果，是哪一類勞動？"}, "tag": {"1": "名詞", "2": "形容詞", "3": "動詞", "4": "名詞", "5": "動詞", "6": "動詞", "7": "形容詞", "8": "副詞", "9": "動詞", "10": "形容詞", "11": "名詞", "12": "副詞", "13": "動詞", "14": "名詞", "15": "形容詞", "16": "片語", "17": "時態", "18": "轉折語", "19": "片語", "20": "形容詞", "21": "片語", "22": "分詞", "23": "代名詞", "24": "名詞", "25": "片語", "26": "介係詞", "27": "代名詞", "28": "轉折語", "29": "形容詞", "30": "動詞"}};
const DATA107={"vocab": [{"n": 1, "s": "Mangoes are a ______ fruit here in Taiwan; most of them reach their peak of sweetness in July.", "zh": "芒果在臺灣是＿＿水果；大部分在七月最甜。", "o": ["mature", "usual", "seasonal", "particular"], "a": 2, "w": {"0": "mature 是「成熟的」，a mature fruit 不能說明「七月最甜」這個時間特色。", "1": "usual 是「平常的」，跟後面講特定月份沒有關係。", "3": "particular 是「特別的；挑剔的」，意思不合。"}, "k": "關鍵：七月最甜 → 有產季的「季節性」水果：seasonal。", "v": "seasonal 季節性的｜peak 高峰"}, {"n": 2, "s": "Writing term papers and giving oral reports are typical course ______ for college students.", "zh": "寫期末報告和上台口頭報告，是大學生典型的課程＿＿。", "o": ["requirements", "techniques", "situations", "principles"], "a": 0, "w": {"1": "techniques 是「技巧」，寫報告是要做的事，不是技巧。", "2": "situations 是「情況」，意思不合。", "3": "principles 是「原則」，意思不通。"}, "k": "關鍵：學生必須完成的報告 → 課程「要求」：course requirements。", "v": "requirement 要求｜term paper 學期報告｜oral report 口頭報告"}, {"n": 3, "s": "If we work hard to ______ our dreams when we are young, we will not feel that we missed out on something when we get old.", "zh": "如果年輕時努力＿＿夢想，老了就不會覺得錯過了什麼。", "o": ["distribute", "fulfill", "convince", "monitor"], "a": 1, "w": {"0": "distribute 是「分配」，不能分配夢想。", "2": "convince 是「說服」，要接人。", "3": "monitor 是「監控」，意思不通。"}, "k": "關鍵：fulfill one’s dream＝實現夢想。", "v": "fulfill 實現｜miss out on 錯過"}, {"n": 4, "s": "Few people will trust you if you continue making ______ promises and never make efforts to keep them.", "zh": "如果你一直做出＿＿的承諾，又從不努力遵守，很少人會相信你。", "o": ["chilly", "liberal", "hollow", "definite"], "a": 2, "w": {"0": "chilly 是「寒冷的」，不形容承諾。", "1": "liberal 是「開明的；大方的」，意思不合。", "3": "definite 是「明確的」，明確的承諾不會讓人不信任。"}, "k": "關鍵：從不遵守的承諾 → 「空洞的」承諾：hollow promises。", "v": "hollow 空洞的｜promise 承諾"}, {"n": 5, "s": "Becky ______ her ankle while she was playing tennis last week. Now it still hurts badly.", "zh": "Becky 上週打網球時＿＿了腳踝，現在還很痛。", "o": ["slipped", "dumped", "twisted", "recovered"], "a": 2, "w": {"0": "slipped 是「滑倒」，不及物，不能直接接 her ankle。", "1": "dumped 是「丟棄」，意思不通。", "3": "recovered 是「恢復」，跟「還很痛」矛盾。"}, "k": "關鍵：twist one’s ankle＝扭到腳踝。", "v": "twist 扭傷｜ankle 腳踝"}, {"n": 6, "s": "Research shows that men and women usually think differently. For example, they have quite different ______ about what marriage means in their life.", "zh": "研究顯示，男人和女人想法通常不同。例如，他們對婚姻在生命中的意義有很不一樣的＿＿。", "o": ["decisions", "beliefs", "styles", "degrees"], "a": 1, "w": {"0": "decisions 是「決定」，about what marriage means 是在講看法，不是決定。", "2": "styles 是「風格」，意思不合。", "3": "degrees 是「程度；學位」，意思不通。"}, "k": "關鍵：think differently（想法不同）→ 對婚姻意義的「信念、看法」：beliefs。", "v": "belief 信念｜marriage 婚姻"}, {"n": 7, "s": "The new manager is very ______. For instance, the employees are given much shorter deadlines for the same tasks than before.", "zh": "新經理很＿＿。例如，同樣的工作，員工拿到的期限比以前短很多。", "o": ["persuasive", "tolerable", "suspicious", "demanding"], "a": 3, "w": {"0": "persuasive 是「有說服力的」，跟期限縮短無關。", "1": "tolerable 是「可以忍受的」，形容事情，不是形容經理的作風。", "2": "suspicious 是「多疑的」，例子不是在說他懷疑別人。"}, "k": "關鍵：期限變短 → 經理「要求很高」：demanding。", "v": "demanding 要求高的｜deadline 期限"}, {"n": 8, "s": "While the couple were looking ______ for their missing children, the kids were actually having fun in the woods nearby.", "zh": "這對夫妻＿＿地找失蹤的孩子時，孩子其實正在附近的樹林裡玩得很開心。", "o": ["anxiously", "precisely", "evidently", "distinctly"], "a": 0, "w": {"1": "precisely 是「精確地」，形容找人的心情不對。", "2": "evidently 是「顯然地」，用來評論整句，不形容找的樣子。", "3": "distinctly 是「清楚地」，意思不合。"}, "k": "關鍵：孩子失蹤了，父母找的時候很「焦急」：anxiously。", "v": "anxiously 焦急地｜missing 失蹤的"}, {"n": 9, "s": "After delivering a very powerful speech, the award winner was ______ by a group of fans asking for her signature.", "zh": "發表了一場很有力的演講後，得獎者被一群要簽名的粉絲＿＿。", "o": ["deposited", "reserved", "vanished", "surrounded"], "a": 3, "w": {"0": "deposited 是「存放」，不用在人身上。", "1": "reserved 是「預訂」，意思不通。", "2": "vanished 是不及物動詞「消失」，不能用被動。"}, "k": "關鍵：一群粉絲要簽名 → 她被「包圍」：be surrounded by。", "v": "surround 包圍｜signature 簽名"}, {"n": 10, "s": "The interviewees were trying very hard to ______ the interviewers that they were very capable and should be given the job.", "zh": "應徵者很努力地讓面試官＿＿他們很有能力、應該得到這份工作。", "o": ["credit", "impress", "relieve", "acquire"], "a": 1, "w": {"0": "credit 是「把功勞歸於」，credit A with B，意思不合。", "2": "relieve 是「減輕」，意思不通。", "3": "acquire 是「獲得」，不接人＋that 子句。"}, "k": "關鍵：impress sb that...＝讓某人留下……的印象。也可以想成 convince。", "v": "impress 使印象深刻｜capable 有能力的"}, {"n": 11, "s": "After the first snow of the year, the entire grassland disappeared under a ______ of snow.", "zh": "下了今年第一場雪後，整片草原消失在一＿＿雪下面。", "o": ["flake", "blossom", "blanket", "flash"], "a": 2, "w": {"0": "a flake of snow 是「一片雪花」，蓋不住整片草原。", "1": "blossom 是「花」，意思不通。", "3": "flash 是「閃光」，意思不通。"}, "k": "關鍵：整片草原被蓋住 → a blanket of snow＝一層厚厚的雪（像毯子一樣）。", "v": "blanket 毯子；一層覆蓋物｜grassland 草原"}, {"n": 12, "s": "Peter likes books with wide ______, which provide him with enough space to write notes.", "zh": "Peter 喜歡＿＿寬的書，讓他有足夠的空間寫筆記。", "o": ["angles", "margins", "exceptions", "limitations"], "a": 1, "w": {"0": "angles 是「角度」，不能寫筆記。", "2": "exceptions 是「例外」，意思不通。", "3": "limitations 是「限制」，意思不合。"}, "k": "關鍵：書上可以寫筆記的空白處 → 「頁邊空白」：margins。", "v": "margin 頁邊空白｜note 筆記"}, {"n": 13, "s": "At the beginning of the semester, the teacher told the students that late assignments would receive a low grade as a ______.", "zh": "學期一開始，老師就告訴學生，遲交的作業會拿低分作為＿＿。", "o": ["hardship", "comment", "bargain", "penalty"], "a": 3, "w": {"0": "hardship 是「困苦」，意思不合。", "1": "comment 是「評論」，低分不是評論。", "2": "bargain 是「便宜貨；交易」，意思不通。"}, "k": "關鍵：遲交→低分，是一種「懲罰」：as a penalty。", "v": "penalty 懲罰｜assignment 作業"}, {"n": 14, "s": "Various studies have been ______ in this hospital to explore the link between a high-fat diet and cancer.", "zh": "這家醫院＿＿了很多研究，探討高脂飲食和癌症的關係。", "o": ["conducted", "confirmed", "implied", "improved"], "a": 0, "w": {"1": "confirmed 是「證實」，研究是用來探討的，還沒證實。", "2": "implied 是「暗示」，意思不通。", "3": "improved 是「改善」，意思不合。"}, "k": "關鍵：conduct a study＝進行研究。", "v": "conduct 進行｜explore 探討"}, {"n": 15, "s": "Intense, fast-moving fires raged across much of California last week. The ______ firestorm has claimed the lives of thirty people.", "zh": "上週，猛烈又快速蔓延的大火肆虐加州大部分地區。這場＿＿的大火已經奪走三十條人命。", "o": ["efficient", "reliable", "massive", "adequate"], "a": 2, "w": {"0": "efficient 是「有效率的」，不形容火災。", "1": "reliable 是「可靠的」，意思不通。", "3": "adequate 是「足夠的」，意思不合。"}, "k": "關鍵：火燒過加州大部分地區、奪走三十條人命 → 「巨大的」大火：massive。", "v": "massive 巨大的｜rage 肆虐｜claim 奪走（性命）"}], "gl": {"1": ["成熟的", "平常的", "季節性的", "特別的"], "2": ["要求", "技巧", "情況", "原則"], "3": ["分配", "實現", "說服", "監控"], "4": ["寒冷的", "開明的", "空洞的", "明確的"], "5": ["滑倒", "丟棄", "扭傷", "恢復"], "6": ["決定", "信念", "風格", "程度"], "7": ["有說服力的", "可忍受的", "多疑的", "要求高的"], "8": ["焦急地", "精確地", "顯然地", "清楚地"], "9": ["存放", "預訂", "消失", "包圍"], "10": ["歸功於", "使印象深刻", "減輕", "獲得"], "11": ["雪花", "花", "一層覆蓋物", "閃光"], "12": ["角度", "頁邊空白", "例外", "限制"], "13": ["困苦", "評論", "便宜貨", "懲罰"], "14": ["進行", "證實", "暗示", "改善"], "15": ["有效率的", "可靠的", "巨大的", "足夠的"]}, "hint": {"1": "芒果在七月最甜，表示它有自己的「產季」。", "2": "寫報告、口頭報告是大學課程「規定要做」的。", "3": "把夢想「實現」用哪個動詞？", "4": "從不遵守的承諾，是什麼樣的承諾？", "5": "打網球時腳踝怎麼了，現在還很痛？", "6": "男女「想法」不同，對婚姻有不同的什麼？", "7": "期限變短，表示經理對員工要求怎樣？", "8": "孩子不見了，父母找的時候心情如何？", "9": "一群粉絲圍過來要簽名，她被怎麼了？", "10": "應徵者想讓面試官覺得他們很有能力。", "11": "雪蓋住整片草原，像一條什麼？", "12": "書上空白、可以寫筆記的地方叫什麼？", "13": "遲交就拿低分，這是一種什麼？", "14": "「進行」研究用哪個動詞？", "15": "奪走三十條人命的大火有多大？"}, "tag": {"1": "形容詞", "2": "名詞", "3": "動詞", "4": "形容詞", "5": "動詞", "6": "名詞", "7": "形容詞", "8": "副詞", "9": "動詞", "10": "動詞", "11": "名詞", "12": "名詞", "13": "名詞", "14": "動詞", "15": "形容詞", "16": "比較", "17": "動詞", "18": "片語", "19": "關係副詞", "20": "介係詞", "21": "連接詞", "22": "名詞", "23": "片語", "24": "分詞", "25": "形容詞", "26": "名詞子句", "27": "形容詞", "28": "片語", "29": "轉折語", "30": "片語"}};
const DATA106={"vocab": [{"n": 1, "s": "John’s clock is not functioning ______. The alarm rings even when it’s not set to go off.", "zh": "約翰的時鐘沒有＿＿運作。就算沒設定，鬧鈴也會響。", "o": ["tenderly", "properly", "solidly", "favorably"], "a": 1, "w": {"0": "tenderly 是「溫柔地」，用來形容人的動作，不形容機器運作。", "2": "solidly 是「堅固地」，跟鬧鈴亂響無關。", "3": "favorably 是「有利地；贊同地」，意思不合。"}, "k": "關鍵：沒設定卻亂響 → 沒有「正常地」運作：function properly。", "v": "properly 正常地；適當地｜function 運作｜go off（鬧鈴）響"}, {"n": 2, "s": "Michael has decided to ______ a career in physics and has set his mind on becoming a professor.", "zh": "麥可決定＿＿物理學的職業，而且一心想當教授。", "o": ["pursue", "swear", "reserve", "draft"], "a": 0, "w": {"1": "swear 是「發誓」，不能 swear a career。", "2": "reserve 是「預訂；保留」，意思不合。", "3": "draft 是「起草」，意思不合。"}, "k": "關鍵：pursue a career in＋領域＝從事、追求某領域的職業。", "v": "pursue 追求；從事｜set one’s mind on 下定決心要"}, {"n": 3, "s": "Peter plans to hike in a ______ part of Africa, where he might not meet another human being for days.", "zh": "彼得打算到非洲一個＿＿的地方健行，在那裡他可能好幾天都遇不到別人。", "o": ["native", "tricky", "remote", "vacant"], "a": 2, "w": {"0": "native 是「本土的；天生的」，意思不合。", "1": "tricky 是「棘手的；狡猾的」，跟「遇不到人」無關。", "3": "vacant 是「空著的（房間、座位）」，不形容地區偏遠。"}, "k": "關鍵：好幾天遇不到人 → 「偏遠的」地方：remote。", "v": "remote 偏遠的｜hike 健行"}, {"n": 4, "s": "People in this community tend to ______ with the group they belong to, and often put group interests before personal ones.", "zh": "這個社區的人往往＿＿自己所屬的團體，常常把團體利益放在個人利益之前。", "o": ["appoint", "eliminate", "occupy", "identify"], "a": 3, "w": {"0": "appoint 是「任命」，不接 with。", "1": "eliminate 是「消除」，意思相反。", "2": "occupy 是「佔據」，不接 with。"}, "k": "關鍵：identify with＝認同；後面說把團體利益放前面，就是很「認同」團體。", "v": "identify with 認同｜interest 利益"}, {"n": 5, "s": "I mistook the man for a well-known actor and asked for his autograph; it was really ______.", "zh": "我把那個人誤認成知名演員，還跟他要簽名，真的很＿＿。", "o": ["relaxing", "embarrassing", "appealing", "defending"], "a": 1, "w": {"0": "relaxing 是「令人放鬆的」，認錯人不會放鬆。", "2": "appealing 是「吸引人的」，意思不合。", "3": "defending 是「防衛的」，意思不合。"}, "k": "關鍵：認錯人還要簽名 → 「令人尷尬的」：embarrassing。", "v": "embarrassing 令人尷尬的｜mistake A for B 把 A 誤認為 B｜autograph 簽名"}, {"n": 6, "s": "After spending most of her salary on rent and food, Amelia ______ had any money left for entertainment and other expenses.", "zh": "把大部分薪水花在房租和食物後，愛蜜莉亞＿＿沒剩什麼錢可以花在娛樂和其他開銷上。", "o": ["barely", "fairly", "merely", "readily"], "a": 0, "w": {"1": "fairly 是「相當地；公平地」，fairly had any money 不通。", "2": "merely 是「僅僅」，後面要接肯定的內容，不和 any 連用。", "3": "readily 是「容易地；樂意地」，意思不合。"}, "k": "關鍵：句中有 any → 需要帶否定意味的副詞。barely＝幾乎沒有，barely had any money＝幾乎沒錢。", "v": "barely 幾乎沒有｜salary 薪水｜expense 開銷"}, {"n": 7, "s": "In the Bermuda Triangle, a region in the western part of the North Atlantic Ocean, some airplanes and ships were reported to have mysteriously disappeared without a ______.", "zh": "在北大西洋西部的百慕達三角，據報導有些飛機和船隻神祕地消失，沒有留下一點＿＿。", "o": ["guide", "trace", "code", "print"], "a": 1, "w": {"0": "guide 是「嚮導」，意思不合。", "2": "code 是「密碼；規範」，意思不合。", "3": "print 是「印刷品；印痕」，沒有 without a print 這個說法。"}, "k": "關鍵：disappear without a trace＝消失得無影無蹤（固定說法）。", "v": "trace 痕跡｜mysteriously 神祕地"}, {"n": 8, "s": "Shouting greetings and waving a big sign, Tony ______ the passing shoppers to visit his shop and buy the freshly baked bread.", "zh": "東尼一邊大聲打招呼、一邊揮舞大招牌，＿＿路過的顧客來他店裡買剛出爐的麵包。", "o": ["accessed", "edited", "imposed", "urged"], "a": 3, "w": {"0": "accessed 是「進入；取得」，不接 sb to V。", "1": "edited 是「編輯」，意思不合。", "2": "imposed 是「強加」，句型是 impose A on B。"}, "k": "關鍵：urge sb to V＝催促、極力勸某人做某事。", "v": "urge 催促；力勸｜freshly baked 剛出爐的"}, {"n": 9, "s": "With a continuous 3 km stretch of golden sand, the beach attracts artists around the world each summer to create amazing ______ with its fine soft sand.", "zh": "這片海灘有連綿三公里的金色沙灘，每年夏天吸引世界各地的藝術家，用細軟的沙創作驚人的＿＿。", "o": ["constitutions", "objections", "sculptures", "adventures"], "a": 2, "w": {"0": "constitutions 是「憲法；體質」，意思不合。", "1": "objections 是「反對」，意思不合。", "3": "adventures 是「冒險」，不是用沙做出來的東西。"}, "k": "關鍵：藝術家用沙子做出來的 → 沙雕：sculptures。", "v": "sculpture 雕刻品｜stretch 一片（土地）｜continuo
