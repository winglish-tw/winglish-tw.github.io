<main class="mx-wrap">

    <h1>混合題專區</h1>
    <p>學測混合題常搭配圖表，要把文章和圖對照著看。這裡的題目是 winglish.tw 自己出的，題型比照學測：填充、多選、圖表判讀、簡答。</p>

<script>
/* 每一組題目放在 SETS 裡，之後新增題組只要往下加一組 */
const IMG_CLASS=`<svg viewBox="0 0 520 210" role="img" aria-label="教室裡三個學生，一個接一個打哈欠">
<defs><filter id="hand"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></defs>
<g filter="url(#hand)" fill="none" stroke="#1A2238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
 <path d="M20 182 C150 178 360 186 500 181"/>
 <!-- desks -->
 <path d="M40 150 C80 147 130 149 160 150 M52 151 C54 165 53 174 55 182 M150 151 C149 166 151 173 149 182"/>
 <path d="M200 150 C240 148 290 150 320 149 M212 150 C213 166 211 174 213 182 M310 150 C309 165 311 174 309 182"/>
 <path d="M360 150 C400 147 450 150 480 149 M372 151 C371 165 373 174 371 182 M470 150 C471 165 469 174 471 182"/>
 <!-- student 1: big yawn, arms stretched -->
 <path d="M100 74 C78 74 70 92 72 104 C74 120 88 128 100 128 C114 128 127 118 128 102 C129 88 120 74 100 74Z"/>
 <path d="M84 96 C88 94 91 94 94 96 M106 96 C109 94 112 94 116 96"/>

 <path d="M76 120 C64 104 56 86 52 66 M124 120 C138 104 146 86 150 66"/>
 <path d="M84 128 C82 136 80 144 80 150 M116 128 C118 136 120 144 120 150"/>
 <path d="M150 46 C156 40 162 42 160 48 M158 34 C166 28 172 32 168 38" stroke-width="1.8"/>
 <!-- student 2: starting to yawn, hand over mouth -->
 <path d="M260 80 C240 80 232 96 234 108 C236 122 248 130 260 130 C273 130 285 121 286 106 C287 93 279 80 260 80Z"/>
 <path d="M245 101 C249 99 252 99 255 101 M266 101 C269 99 272 99 276 101"/>
 <path d="M254 111 C254 120 266 121 266 111 C264 107 256 107 254 111Z" fill="#1A2238"/>
 <path d="M240 126 C236 138 250 128 258 118 C262 114 266 116 262 122"/>
 <path d="M280 126 C284 136 286 144 286 150"/>
 <!-- student 3: watching, eyes sleepy -->
 <path d="M420 82 C400 82 392 98 394 110 C396 124 408 132 420 132 C433 132 445 123 446 108 C447 95 439 82 420 82Z"/>
 <path d="M405 104 C409 106 412 106 415 104 M426 104 C429 106 432 106 436 104"/>
 <path d="M412 118 C417 120 423 120 428 118"/>
 <path d="M400 128 C398 136 396 144 396 150 M440 128 C442 136 444 144 444 150"/>
 <path d="M300 60 C330 50 360 52 384 66" stroke-dasharray="4 6" stroke-width="1.6"/>
 <path d="M378 58 C382 62 384 64 386 68 C381 68 378 68 374 69" stroke-width="1.6"/>
</g></svg>`;

const CHART=`<svg viewBox="0 0 440 270" role="img" aria-label="長條圖：冷敷組約 9%，溫敷組約 41% 的人被傳染打哈欠">
<g font-family="Noto Sans TC, sans-serif" fill="#1A2238">
<text x="220" y="20" text-anchor="middle" font-size="15" font-weight="700">Who Caught a Yawn?</text>
<line x1="70" y1="40" x2="70" y2="220" stroke="#4A536B" stroke-width="1.5"/>
<line x1="70" y1="220" x2="410" y2="220" stroke="#4A536B" stroke-width="1.5"/>
<g font-size="12" fill="#4A536B" text-anchor="end">
 <text x="62" y="224">0%</text><text x="62" y="179">10%</text><text x="62" y="134">20%</text><text x="62" y="89">30%</text><text x="62" y="44">40%</text>
</g>
<g stroke="#E4E9F2"><line x1="71" y1="175" x2="410" y2="175"/><line x1="71" y1="130" x2="410" y2="130"/><line x1="71" y1="85" x2="410" y2="85"/><line x1="71" y1="40" x2="410" y2="40"/></g>
<rect x="125" y="179.5" width="80" height="40.5" fill="#4A7BB7" rx="3"/>
<rect x="275" y="35.5" width="80" height="184.5" fill="#D23F57" rx="3"/>
<g font-size="14" font-weight="700" text-anchor="middle"><text x="165" y="172">9%</text><text x="315" y="28">41%</text></g>
<g font-size="13" text-anchor="middle"><text x="165" y="240">Cold pack</text><text x="315" y="240">Warm pack</text></g>
<text x="18" y="130" font-size="12" fill="#4A536B" transform="rotate(-90 18 130)" text-anchor="middle">people who caught a yawn</text>
<text x="240" y="262" font-size="11" fill="#4A536B" text-anchor="middle">Participants watched videos of people yawning. (Data simplified)</text>
</g></svg>`;

const SETS=[{
  title:"Why Can't We Stop Yawning?",
  img:IMG_CLASS, imgCap:"",
  p:[
"Have you ever noticed that when one person yawns in a quiet classroom, others soon start to do the same? This is known as contagious yawning. It is so powerful that some people begin to yawn just by hearing a yawn, or even by reading about one. If you feel a yawn coming as you read this, you are not alone.",
"Yawning itself starts very early in life; babies yawn even before they are born. Catching a yawn from someone else, however, is a skill that develops much later. Most children do not respond to other people's yawns until they are about four or five years old.",
"Why do we catch yawns? One popular explanation is empathy, the ability to understand and share the feelings of others. Studies have found that people are more likely to catch yawns from family members and close friends than from strangers. Chimpanzees show a similar pattern, and some dogs even yawn after watching their owners yawn.",
"Not all scientists agree, though. One large study found that age predicted contagious yawning better than empathy did: the older the participants were, the less likely they were to catch yawns. Another group of researchers believes yawning helps cool the brain. In one experiment, people who held a cold pack against their foreheads yawned much less while watching videos of others yawning than those who held a warm one. The chart below shows the results.",
"Scientists are still trying to solve this everyday mystery. For now, one thing is certain: a single yawn can travel around a room faster than you might expect."],
  chartAfter:3, chart:CHART,
  tr:[
"你有沒有注意過，安靜的教室裡只要有一個人打哈欠，其他人很快也跟著打？這叫做「傳染性哈欠」。它的力量大到有些人光是聽到別人打哈欠，甚至只是讀到跟哈欠有關的文字，就會開始打哈欠。如果你讀到這裡也想打哈欠，你並不孤單。",
"打哈欠這件事在人生很早就開始了，嬰兒在出生前就會打哈欠。不過，被別人的哈欠傳染是很晚才發展出來的能力。大多數孩子要到四、五歲左右，才會對別人的哈欠有反應。",
"我們為什麼會被哈欠傳染？一個常見的解釋是同理心，也就是理解並感受他人情緒的能力。研究發現，人比較容易被家人和好朋友的哈欠傳染，被陌生人傳染的機會比較小。黑猩猩也有類似的情形，有些狗甚至看到主人打哈欠後也會跟著打。",
"不過，並不是所有科學家都同意。一項大型研究發現，年齡比同理心更能預測一個人會不會被哈欠傳染：受試者年紀越大，越不容易被傳染。另一群研究者則認為，打哈欠能幫助大腦降溫。在一項實驗中，受試者觀看別人打哈欠的影片時，額頭敷著冷敷袋的人，打哈欠的次數比敷溫熱敷袋的人少得多。下方的圖表顯示了實驗結果。",
"科學家仍在努力解開這個日常生活中的謎題。不過，目前可以確定的是：一個哈欠在房間裡傳開的速度，可能比你想像的還快。"],
  q:[
   {type:"fill",n:1,pts:"2 分",inst:"請從文章中找出最適當的單詞（word）填入空格，並視語法需要作適當的字形變化，使句子合乎文法且語意完整。",
    s:"Tom {A} his friend's yawn during the boring lecture, and the yawn {B} to the whole row in less than a minute.",
    blanks:{A:{ans:["caught"],src:"catch",hint:"文章裡說被別人的哈欠「傳染」用哪個動詞？",k:"文章用 catch a yawn（被哈欠傳染）。句子說的是過去的事，要改成過去式 caught。"},
            B:{ans:["traveled","travelled"],src:"travel",hint:"看第 5 段最後一句，哈欠在房間裡「傳開」用哪個動詞？",k:"第 5 段 a single yawn can travel around a room。過去式 traveled（英式拼法 travelled 也對）。"}}},
   {type:"multi",n:2,pts:"4 分",q:"According to the passage, which of the following statements are true? (多選)",
    opts:["Babies begin to catch yawns soon after they are born.","People catch yawns from close friends more easily than from strangers.","Contagious yawning has been observed only in humans.","Older people tend to catch yawns less often than younger people.","Holding something warm against the forehead stops people from yawning."],
    a:[1,3],why:["錯。第 2 段：嬰兒出生前就會打哈欠，但要到四、五歲左右才會被傳染。","對。第 3 段：比較容易被家人和好朋友傳染。","錯。第 3 段提到黑猩猩和狗也會。","對。第 4 段：年紀越大，越不容易被傳染。","錯。實驗用的溫敷組反而打比較多哈欠，冷敷組才比較少。"]},
   {type:"single",n:3,pts:"2 分",q:"Which of the following statements is supported by the chart?",
    opts:["Most people in the warm-pack group caught a yawn.","Fewer than one in ten people in the cold-pack group caught a yawn.","People who watched more videos yawned more often.","Older participants caught fewer yawns than younger ones."],
    a:1,why:["錯。溫敷組只有 41%，不到一半，不能說 most（大多數）。","對。冷敷組是 9%，不到十分之一。","錯。圖表沒有比較看幾部影片。","錯。這是第 4 段文字提到的另一項研究，圖表裡沒有年齡的資料。這種「文章有寫、圖表沒有」的選項是常見陷阱。"]},
   {type:"short",n:4,pts:"2 分",inst:"請以英文作答。",q:"According to the passage, at about what age do most children start to catch other people's yawns?",
    check:v=>/(four|4)/.test(v)&&/(five|5)/.test(v),model:"(At) about four or five (years old).",k:"答案在第 2 段最後一句：until they are about four or five years old。"}
  ]
}];

const $=s=>document.querySelector(s);
const L="ABCDE";
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function norm(v){return v.trim().toLowerCase().replace(/[.!?,]+$/,"").replace(/\s+/g," ")}
let cur=0;
function sets(){$("#sets").innerHTML=SETS.map((s,i)=>`<button class="set-btn${i===cur?" on":""}" data-i="${i}">第 ${i+1} 組：${esc(s.title)}</button>`).join("");
  document.querySelectorAll(".set-btn").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;build()})}
function build(){
  sets();const S=SETS[cur];let done=0;const total=S.q.length;
  let ph=S.p.map((t,i)=>`<p><span class="pn">(${i+1})</span>${esc(t)}</p>`+(i===S.chartAfter?`<figure>${S.chart}</figure>`:"")).join("");
  $("#app").innerHTML=`<div class="card passage"><h2>閱讀下文，回答第 1 至 ${total} 題</h2><h3>${esc(S.title)}</h3><figure>${S.img}</figure>${ph}
  <details class="tr" id="tr" hidden><summary>看全文翻譯</summary>${S.tr.map(t=>`<p>${t}</p>`).join("")}</details></div>
  <div class="card" id="qs">${S.q.map((q,i)=>`<div class="q" id="q${i}"></div>`).join("")}<div id="end"></div></div>`;
  const finish=()=>{done++;if(done===total){$("#tr").hidden=false;$("#end").innerHTML=`<p class="done">全部完成！可以打開上面的「看全文翻譯」再讀一次。</p>`}};
  S.q.forEach((q,i)=>{
    const el=$("#q"+i);let tries=0,over=false;
    const head=`<p class="qt">${q.n}. ${q.type==="fill"?"填充題":q.type==="short"?"簡答題":q.type==="multi"?"多選題":"單選題"}<span class="pts">${q.pts}</span></p>${q.inst?`<p class="inst">${q.inst}</p>`:""}`;
    const btns=`<div class="row"><button class="b main" data-c>檢查答案</button><button class="b" data-s hidden>看答案</button></div><div class="fbw"></div>`;
    const fbw=()=>el.querySelector(".fbw");
    const end=()=>{over=true;el.querySelector("[data-c]").hidden=true;el.querySelector("[data-s]").hidden=true;finish()};
    if(q.type==="fill"){
      el.innerHTML=head+`<p class="en">${esc(q.s).replace(/\{(\w)\}/g,(m,k)=>`<b>(${k})</b> <input class="in" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="空格 ${k}">`)}</p>`+btns;
      const run=show=>{let out="";if(!show)tries++;
        el.querySelectorAll(".in").forEach(inp=>{const B=q.blanks[inp.dataset.k];if(inp.classList.contains("ok"))return;const v=norm(inp.value);
          if(show){inp.value=B.ans[0];inp.classList.remove("bad");inp.classList.add("ok");inp.disabled=true;out+=`<div class="fb good"><b class="t">(${inp.dataset.k}) ${B.ans[0]}</b>${B.k}</div>`;return}
          if(B.ans.includes(v)){inp.classList.remove("bad");inp.classList.add("ok");inp.disabled=true;out+=`<div class="fb good"><b class="t">(${inp.dataset.k}) 答對了！</b>${B.k}</div>`;return}
          inp.classList.add("bad");out+=`<div class="fb bad"><b class="t">(${inp.dataset.k}) 再想想看</b>${v===B.src?"字找對了！但要做<b>字形變化</b>。":""}${B.hint}</div>`});
        fbw().innerHTML=out;
        if([...el.querySelectorAll(".in")].every(x=>x.classList.contains("ok")))end();else if(tries>=2)el.querySelector("[data-s]").hidden=false};
      el.querySelector("[data-c]").onclick=()=>run(false);el.querySelector("[data-s]").onclick=()=>run(true);
    }else if(q.type==="multi"||q.type==="single"){
      const tp=q.type==="multi"?"checkbox":"radio";
      el.innerHTML=head+`<p class="en">${esc(q.q)}</p><div class="opts">${q.opts.map((o,k)=>`<label><input type="${tp}" name="r${i}" value="${k}"><span>(${L[k]}) ${esc(o)}</span></label>`).join("")}</div>`+btns;
      const ans=[].concat(q.a);
      const reveal=ok=>{el.querySelectorAll("input").forEach(c=>{c.disabled=true;c.checked=ans.includes(+c.value)});
        el.querySelectorAll("label").forEach((l,k)=>{l.classList.remove("bad");if(ans.includes(k))l.classList.add("ok")});
        fbw().innerHTML=`<div class="fb good"><b class="t">${ok?"答對了！":"答案："}${ans.map(k=>"("+L[k]+")").join("")}</b><ul>${q.why.map((w,k)=>`<li>(${L[k]}) ${w}</li>`).join("")}</ul></div>`;end()};
      el.querySelector("[data-c]").onclick=()=>{const sel=[...el.querySelectorAll("input:checked")].map(c=>+c.value);
        if(!sel.length){fbw().innerHTML=`<div class="fb bad"><b class="t">還沒選答案</b></div>`;return}
        tries++;const ok=sel.length===ans.length&&sel.every(k=>ans.includes(k));
        if(ok)return reveal(true);
        el.querySelectorAll("label").forEach((l,k)=>l.classList.toggle("bad",sel.includes(k)&&!ans.includes(k)));
        fbw().innerHTML=`<div class="fb bad"><b class="t">再想想看</b>${q.type==="multi"?`正確答案有 ${ans.length} 個。紅色的選項不對，`:""}回到文章${q.type==="single"?"和圖表":""}再找找證據。</div>`;
        if(tries>=2)el.querySelector("[data-s]").hidden=false};
      el.querySelector("[data-s]").onclick=()=>reveal(false);
    }else{
      el.innerHTML=head+`<p class="en">${esc(q.q)}</p><input class="in long" autocomplete="off" spellcheck="false" aria-label="簡答">`+btns;
      const inp=el.querySelector(".in");
      const show=ok=>{inp.disabled=true;inp.classList.remove("bad");if(ok)inp.classList.add("ok");fbw().innerHTML=`<div class="fb good"><b class="t">${ok?"答對了！":"參考答案"}</b>參考答案：${q.model}<br>${q.k}</div>`;end()};
      el.querySelector("[data-c]").onclick=()=>{const v=norm(inp.value);if(!v){fbw().innerHTML=`<div class="fb bad"><b class="t">還沒作答</b></div>`;return}
        tries++;if(q.check(v))return show(true);inp.classList.add("bad");fbw().innerHTML=`<div class="fb bad"><b class="t">再想想看</b>回到第 2 段，找跟「孩子」有關的句子。</div>`;if(tries>=2)el.querySelector("[data-s]").hidden=false};
      el.querySelector("[data-s]").onclick=()=>show(false);
    }
  });
}
build();
</script>
</body>
</html>
